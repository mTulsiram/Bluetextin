<!-- Floating Scroll to Top and Scroll to Bottom Buttons -->
<div class="bt-scroll-buttons d-flex flex-column gap-2" style="position: fixed; bottom: 24px; right: 24px; z-index: 1040;">
  <button class="btn bt-scroll-btn" id="scroll-to-top-btn" type="button" aria-label="Scroll to top" title="Scroll to top">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="18 15 12 9 6 15"></polyline></svg>
  </button>
  <button class="btn bt-scroll-btn" id="scroll-to-bottom-btn" type="button" aria-label="Scroll to bottom" title="Scroll to bottom">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"></polyline></svg>
  </button>
</div>

<script>
  (function initScrollButtons() {
    function setup() {
      const topBtn = document.getElementById("scroll-to-top-btn");
      const bottomBtn = document.getElementById("scroll-to-bottom-btn");
      
      if (topBtn) {
        topBtn.onclick = () => window.scrollTo({ top: 0, behavior: "smooth" });
      }
      
      if (bottomBtn) {
        bottomBtn.onclick = () => window.scrollTo({ top: document.documentElement.scrollHeight, behavior: "smooth" });
      }
    }
    
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", setup, { once: true });
    } else {
      setup();
    }
    document.addEventListener("bt:components-ready", setup);
  })();
</script>
