name: Feature request
description: Suggest an improvement or new tool
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing your idea.

  - type: dropdown
    id: feature_type
    attributes:
      label: Feature type
      options:
        - New tool
        - Existing tool improvement
        - Localization improvement
        - UX/Design enhancement
        - Performance/SEO enhancement
        - Developer workflow/script
        - Other
    validations:
      required: true

  - type: input
    id: title
    attributes:
      label: Short title
      placeholder: Add bulk image watermark tool
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What user problem does this solve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe expected behavior, inputs, outputs, and UX
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Any links, references, mockups, or examples
    validations:
      required: false
