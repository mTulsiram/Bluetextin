<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Image to Base64 | Bluetext.in</title>
  <meta name="description" content="Convert any image to a Base64 data URL string instantly in browser.">
  <link rel="stylesheet" href="../../../assets/css/main.css">
</head>
<body>
  <div id="site-header"></div>
  <main class="doc-page" role="main">
    <p class="doc-page__back"><a href="../../../index.html">Back to home</a></p>
    <h1>Image to Base64</h1>
    <p>Upload an image and get its Base64 data URL for embedding in HTML or CSS.</p>

    <section class="panel">
      <div class="tool-form">
        <label>Upload image<input id="img-file" type="file" accept="image/*"></label>
      </div>
    </section>

    <section class="tool-output" aria-live="polite">
      <p id="img-status">Upload an image to begin.</p>
      <div style="margin-top:0.6rem;display:flex;gap:0.5rem;flex-wrap:wrap;">
        <button id="copy-data-url" class="btn btn--ghost" type="button" style="display:none;">Copy Data URL</button>
        <button id="copy-src" class="btn btn--ghost" type="button" style="display:none;">Copy as img src</button>
      </div>
      <textarea id="img-output" rows="6" class="mono" readonly style="margin-top:0.75rem;width:100%;border:1px solid var(--stroke);border-radius:var(--radius-sm);padding:0.65rem 0.75rem;font:inherit;resize:vertical;background:var(--surface-soft);display:none;" placeholder="Base64 output..."></textarea>
      <img id="img-preview" alt="Preview" style="max-width:100%;margin-top:0.75rem;border-radius:var(--radius-md);display:none;">
    </section>
  </main>
  <div id="site-footer"></div>
  <script>
    const fileInput = document.querySelector("#img-file");
    const status = document.querySelector("#img-status");
    const output = document.querySelector("#img-output");
    const preview = document.querySelector("#img-preview");
    const copyDataUrl = document.querySelector("#copy-data-url");
    const copySrc = document.querySelector("#copy-src");

    fileInput.addEventListener("change", () => {
      const file = fileInput.files && fileInput.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = () => {
        const dataUrl = reader.result;
        output.value = dataUrl;
        output.style.display = "";
        preview.src = dataUrl;
        preview.style.display = "";
        copyDataUrl.style.display = "";
        copySrc.style.display = "";
        status.textContent = `${file.name} — ${(file.size / 1024).toFixed(2)} KB`;
      };
      reader.onerror = () => { status.textContent = "Could not read the image file."; };
      reader.readAsDataURL(file);
    });

    copyDataUrl.addEventListener("click", () => {
      navigator.clipboard.writeText(output.value).then(() => { status.textContent = "Data URL copied."; });
    });

    copySrc.addEventListener("click", () => {
      navigator.clipboard.writeText(`<img src="${output.value}" alt="">`).then(() => { status.textContent = "img tag copied."; });
    });
  </script>
  <script src="/assets/js/partials.js"></script>
</body>
</html>
