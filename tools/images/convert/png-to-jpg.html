<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="/assets/css/main.css">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PNG to JPG Converter | Bluetext.in</title>
  <meta name="description" content="Convert PNG images to JPG format instantly in your browser. Control quality and background color.">
  
</head>
<body>
  <div id="site-header"></div>
  <main class="doc-page" role="main">
    <p class="doc-page__back"><a href="../../../index.html">Back to home</a></p>
    <h1>PNG to JPG Converter</h1>
    <p>Convert PNG images to JPEG. Set quality and background color for transparency areas.</p>

    <section class="panel">
      <form id="conv-form" class="tool-form" novalidate>
        <label>Select PNG image<input id="img-file" type="file" accept="image/png"></label>
        <div class="tool-grid-2">
          <label>Quality (1–100)<input id="quality" type="number" min="1" max="100" value="92" step="1"></label>
          <label>Background color <small>(for transparency)</small><input id="bg-color" type="color" value="#ffffff"></label>
        </div>
        <div class="tool-actions">
          <button id="btn-download" class="btn btn--primary" type="submit" disabled>Convert &amp; Download JPG</button>
        </div>
      </form>
    </section>

    <section class="tool-output" aria-live="polite">
      <p id="status">Upload a PNG to begin.</p>
      <img id="preview" alt="Preview">
    </section>
  </main>
  <div id="site-footer"></div>
  <script>
    const fileInput = document.querySelector("#img-file");
    const qualityInput = document.querySelector("#quality");
    const bgColorInput = document.querySelector("#bg-color");
    const btnDownload = document.querySelector("#btn-download");
    const status = document.querySelector("#status");
    const preview = document.querySelector("#preview");
    let objectUrl = null;

    fileInput.addEventListener("change", () => {
      const file = fileInput.files && fileInput.files[0];
      if (!file) return;
      if (objectUrl) URL.revokeObjectURL(objectUrl);
      objectUrl = URL.createObjectURL(file);
      preview.src = objectUrl;
      preview.style.display = "block";
      status.textContent = `${file.name} — ${(file.size / 1024).toFixed(1)} KB`;
      btnDownload.disabled = false;
    });

    document.querySelector("#conv-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const file = fileInput.files && fileInput.files[0];
      if (!file || !objectUrl) return;
      const quality = Math.max(1, Math.min(100, Number(qualityInput.value) || 92)) / 100;
      const bg = bgColorInput.value;
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement("canvas");
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0);
        const link = document.createElement("a");
        link.download = file.name.replace(/\.[^.]+$/, "") + ".jpg";
        link.href = canvas.toDataURL("image/jpeg", quality);
        link.click();
        status.textContent = "Downloaded as JPG.";
      };
      img.src = objectUrl;
    });
  </script>
  <script src="/assets/js/partials.js"></script>
</body>
</html>
