<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8">
  <link rel="stylesheet" href="/assets/css/main.css">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Image Resizer | Bluetext.in</title>
	<meta name="description" content="Resize images by custom width and height directly in browser.">
	
</head>
<body>
  <div id="site-header"></div>
	<main class="doc-page" role="main">
		<p class="doc-page__back"><a href="../../../index.html">Back to home</a></p>
		<h1>Image Resizer</h1>
		<p>Upload an image, set output dimensions, and download the resized result.</p>

		<section class="panel">
			<form id="resize-form" class="tool-form" novalidate>
				<label>
					Upload image
					<input id="image-file" type="file" accept="image/*" required>
				</label>

				<div class="tool-grid-2">
					<label>
						Width (px)
						<input id="target-width" type="number" min="1" step="1" placeholder="e.g. 1200" required>
					</label>
					<label>
						Height (px)
						<input id="target-height" type="number" min="1" step="1" placeholder="e.g. 800" required>
					</label>
				</div>

				<div class="tool-actions">
					<button class="btn btn--primary" type="submit">Resize and Download</button>
					<button class="btn btn--ghost" type="button" id="aspect-btn">Auto-fill height</button>
					<button class="btn btn--ghost" type="reset">Reset</button>
				</div>
			</form>
		</section>

		<section class="tool-output" aria-live="polite">
			<p id="resize-status">Upload an image to start resizing.</p>
			<canvas id="preview-canvas"></canvas>
		</section>
	</main>

	<script>
		const form = document.querySelector("#resize-form");
		const imageFileInput = document.querySelector("#image-file");
		const widthInput = document.querySelector("#target-width");
		const heightInput = document.querySelector("#target-height");
		const status = document.querySelector("#resize-status");
		const canvas = document.querySelector("#preview-canvas");
		const ctx = canvas.getContext("2d");
		const aspectBtn = document.querySelector("#aspect-btn");

		let sourceImage = null;

		function loadImageFromFile(file) {
			return new Promise((resolve, reject) => {
				const reader = new FileReader();
				reader.onload = () => {
					const img = new Image();
					img.onload = () => resolve(img);
					img.onerror = () => reject(new Error("Invalid image file."));
					img.src = reader.result;
				};
				reader.onerror = () => reject(new Error("Unable to read the image file."));
				reader.readAsDataURL(file);
			});
		}

		imageFileInput.addEventListener("change", async () => {
			const file = imageFileInput.files && imageFileInput.files[0];
			if (!file) {
				sourceImage = null;
				return;
			}

			try {
				sourceImage = await loadImageFromFile(file);
				widthInput.value = sourceImage.width;
				heightInput.value = sourceImage.height;
				status.textContent = `Loaded ${file.name} (${sourceImage.width}x${sourceImage.height}).`;
			} catch (error) {
				sourceImage = null;
				status.textContent = error.message;
			}
		});

		aspectBtn.addEventListener("click", () => {
			if (!sourceImage) {
				status.textContent = "Upload an image first.";
				return;
			}

			const width = Number(widthInput.value);
			if (!Number.isFinite(width) || width <= 0) {
				status.textContent = "Enter a valid width before using auto-fill.";
				return;
			}

			const ratio = sourceImage.height / sourceImage.width;
			heightInput.value = String(Math.round(width * ratio));
		});

		form.addEventListener("submit", (event) => {
			event.preventDefault();

			if (!sourceImage) {
				status.textContent = "Upload an image before resizing.";
				return;
			}

			const width = Number(widthInput.value);
			const height = Number(heightInput.value);

			if (!Number.isFinite(width) || !Number.isFinite(height) || width <= 0 || height <= 0) {
				status.textContent = "Enter valid width and height values.";
				return;
			}

			canvas.width = Math.round(width);
			canvas.height = Math.round(height);
			ctx.clearRect(0, 0, canvas.width, canvas.height);
			ctx.drawImage(sourceImage, 0, 0, canvas.width, canvas.height);
			canvas.style.display = "block";

			canvas.toBlob((blob) => {
				if (!blob) {
					status.textContent = "Could not export resized image.";
					return;
				}
				const url = URL.createObjectURL(blob);
				const link = document.createElement("a");
				link.href = url;
				link.download = `resized-${canvas.width}x${canvas.height}.png`;
				link.click();
				URL.revokeObjectURL(url);
				status.textContent = `Image resized to ${canvas.width}x${canvas.height}.`;
			}, "image/png");
		});

		form.addEventListener("reset", () => {
			sourceImage = null;
			canvas.style.display = "none";
			status.textContent = "Upload an image to start resizing.";
		});
	</script>
  <div id="site-footer"></div>
  <script src="/assets/js/partials.js"></script>
</body>
</html>
