<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="/assets/css/main.css">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grayscale Image | Bluetext.in</title>
  <meta name="description" content="Convert any image to grayscale instantly in your browser.">
  
</head>
<body>
  <div id="site-header"></div>
  <main class="doc-page" role="main">
    <p class="doc-page__back"><a href="../../../index.html">Back to home</a></p>
    <h1>Grayscale Image Converter</h1>
    <p>Upload an image and convert it to grayscale. Downloads as PNG — no data leaves your browser.</p>

    <section class="panel">
      <div class="tool-form">
        <label>Upload image<input id="img-file" type="file" accept="image/*"></label>
      </div>
      <div class="tool-actions">
        <button id="btn-convert" class="btn btn--primary" type="button" disabled>Convert to Grayscale</button>
        <button id="btn-download" class="btn btn--ghost" type="button">Download</button>
      </div>
    </section>

    <section class="tool-output" aria-live="polite">
      <p id="status">Upload an image to begin.</p>
      <canvas id="canvas"></canvas>
    </section>
  </main>
  <div id="site-footer"></div>
  <script>
    const fileInput = document.querySelector("#img-file");
    const btnConvert = document.querySelector("#btn-convert");
    const btnDownload = document.querySelector("#btn-download");
    const canvas = document.querySelector("#canvas");
    const ctx = canvas.getContext("2d");
    const status = document.querySelector("#status");
    let imgEl = null;

    fileInput.addEventListener("change", () => {
      const file = fileInput.files && fileInput.files[0];
      if (!file) return;
      const url = URL.createObjectURL(file);
      imgEl = new Image();
      imgEl.onload = () => {
        status.textContent = `${file.name} — ${imgEl.naturalWidth}×${imgEl.naturalHeight} px`;
        btnConvert.disabled = false;
        btnDownload.style.display = "none";
        canvas.style.display = "none";
      };
      imgEl.src = url;
    });

    btnConvert.addEventListener("click", () => {
      if (!imgEl) return;
      canvas.width = imgEl.naturalWidth;
      canvas.height = imgEl.naturalHeight;
      ctx.drawImage(imgEl, 0, 0);

      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imageData.data;
      for (let i = 0; i < data.length; i += 4) {
        const gray = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
        data[i] = data[i + 1] = data[i + 2] = gray;
      }
      ctx.putImageData(imageData, 0, 0);
      canvas.style.display = "block";
      btnDownload.style.display = "";
      status.textContent = "Grayscale conversion done.";
    });

    btnDownload.addEventListener("click", () => {
      const link = document.createElement("a");
      link.download = "grayscale.png";
      link.href = canvas.toDataURL("image/png");
      link.click();
    });
  </script>
  <script src="/assets/js/partials.js"></script>
</body>
</html>
