<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Image Brightness Adjuster | Bluetext.in</title>
  <meta name="description" content="Adjust image brightness and contrast with a live preview. Download result as PNG.">
  <link rel="stylesheet" href="../../../assets/css/main.css">
</head>
<body>
  <div id="site-header"></div>
  <main class="doc-page" role="main">
    <p class="doc-page__back"><a href="../../../index.html">Back to home</a></p>
    <h1>Image Brightness Adjuster</h1>
    <p>Upload an image and adjust brightness with a live preview. No data leaves your browser.</p>

    <section class="panel">
      <div class="tool-form">
        <label>Upload image<input id="img-file" type="file" accept="image/*"></label>
        <label style="margin-top:0.75rem;">
          Brightness: <span id="brightness-val">100</span>%
          <input id="brightness" type="range" min="0" max="300" value="100" step="1" style="width:100%;margin-top:0.35rem;">
        </label>
        <label style="margin-top:0.5rem;">
          Contrast: <span id="contrast-val">100</span>%
          <input id="contrast" type="range" min="0" max="300" value="100" step="1" style="width:100%;margin-top:0.35rem;">
        </label>
      </div>
      <div class="tool-actions" style="margin-top:0.75rem;">
        <button id="btn-apply" class="btn btn--primary" type="button" disabled>Apply &amp; Preview</button>
        <button id="btn-download" class="btn btn--ghost" type="button" style="display:none;">Download PNG</button>
        <button id="btn-reset" class="btn btn--ghost" type="button">Reset</button>
      </div>
    </section>

    <section class="tool-output" aria-live="polite">
      <p id="status">Upload an image to begin.</p>
      <canvas id="canvas" style="max-width:100%;border-radius:var(--radius-md);margin-top:0.75rem;display:none;"></canvas>
    </section>
  </main>
  <div id="site-footer"></div>
  <script>
    const fileInput = document.querySelector("#img-file");
    const brightnessSlider = document.querySelector("#brightness");
    const contrastSlider = document.querySelector("#contrast");
    const brightnessVal = document.querySelector("#brightness-val");
    const contrastVal = document.querySelector("#contrast-val");
    const btnApply = document.querySelector("#btn-apply");
    const btnDownload = document.querySelector("#btn-download");
    const canvas = document.querySelector("#canvas");
    const ctx = canvas.getContext("2d");
    const status = document.querySelector("#status");
    let imgEl = null;

    brightnessSlider.addEventListener("input", () => { brightnessVal.textContent = brightnessSlider.value; });
    contrastSlider.addEventListener("input", () => { contrastVal.textContent = contrastSlider.value; });

    fileInput.addEventListener("change", () => {
      const file = fileInput.files && fileInput.files[0];
      if (!file) return;
      const url = URL.createObjectURL(file);
      imgEl = new Image();
      imgEl.onload = () => {
        status.textContent = `${file.name} — ${imgEl.naturalWidth}×${imgEl.naturalHeight} px`;
        btnApply.disabled = false;
        btnDownload.style.display = "none";
      };
      imgEl.src = url;
    });

    btnApply.addEventListener("click", () => {
      if (!imgEl) return;
      canvas.width = imgEl.naturalWidth;
      canvas.height = imgEl.naturalHeight;

      ctx.filter = `brightness(${brightnessSlider.value}%) contrast(${contrastSlider.value}%)`;
      ctx.drawImage(imgEl, 0, 0);
      ctx.filter = "none";

      canvas.style.display = "block";
      btnDownload.style.display = "";
      status.textContent = `Brightness: ${brightnessSlider.value}% · Contrast: ${contrastSlider.value}%`;
    });

    btnDownload.addEventListener("click", () => {
      const link = document.createElement("a");
      link.download = "adjusted.png";
      link.href = canvas.toDataURL("image/png");
      link.click();
    });

    document.querySelector("#btn-reset").addEventListener("click", () => {
      brightnessSlider.value = 100; brightnessVal.textContent = "100";
      contrastSlider.value = 100; contrastVal.textContent = "100";
    });
  </script>
  <script src="/assets/js/partials.js"></script>
</body>
</html>
