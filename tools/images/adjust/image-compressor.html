<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Image Compressor | Bluetext.in</title>
  <meta name="description" content="Compress images by adjusting quality and output format in browser.">
  <link rel="stylesheet" href="../../../assets/css/main.css">
</head>
<body>
  <div id="site-header"></div>
  <main class="doc-page" role="main">
    <p class="doc-page__back"><a href="../../../index.html">Back to home</a></p>
    <h1>Image Compressor</h1>
    <p>Reduce image file size by changing quality and format before download.</p>

    <section class="panel">
      <form id="compressor-form" class="tool-form" novalidate>
        <label>
          Upload image
          <input id="source-image" type="file" accept="image/*" required>
        </label>

        <div class="tool-grid-2">
          <label>
            Output format
            <select id="output-format">
              <option value="image/jpeg">JPEG</option>
              <option value="image/webp">WebP</option>
              <option value="image/png">PNG</option>
            </select>
          </label>
          <label>
            Quality (for JPEG/WebP)
            <input id="output-quality" type="number" min="0.1" max="1" step="0.05" value="0.75">
          </label>
        </div>

        <div class="tool-actions">
          <button class="btn btn--primary" type="submit">Compress and Download</button>
          <button class="btn btn--ghost" type="reset">Reset</button>
        </div>
      </form>
    </section>

    <section class="tool-output" aria-live="polite">
      <p id="compressor-status">Upload an image to start compression.</p>
      <p id="compressor-size" class="mono" style="margin-top:0.5rem;"></p>
      <canvas id="compressor-canvas" style="display:none;"></canvas>
    </section>
  </main>

  <script>
    const form = document.querySelector("#compressor-form");
    const sourceInput = document.querySelector("#source-image");
    const formatInput = document.querySelector("#output-format");
    const qualityInput = document.querySelector("#output-quality");
    const status = document.querySelector("#compressor-status");
    const sizeText = document.querySelector("#compressor-size");
    const canvas = document.querySelector("#compressor-canvas");
    const ctx = canvas.getContext("2d");

    let loadedImage = null;

    function loadImage(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => resolve(img);
          img.onerror = () => reject(new Error("Invalid image file."));
          img.src = reader.result;
        };
        reader.onerror = () => reject(new Error("Unable to read image file."));
        reader.readAsDataURL(file);
      });
    }

    function extensionFromMime(mime) {
      if (mime === "image/jpeg") return "jpg";
      if (mime === "image/webp") return "webp";
      return "png";
    }

    function kb(bytes) {
      return `${(bytes / 1024).toFixed(2)} KB`;
    }

    sourceInput.addEventListener("change", async () => {
      const file = sourceInput.files && sourceInput.files[0];
      if (!file) {
        loadedImage = null;
        return;
      }

      try {
        loadedImage = await loadImage(file);
        status.textContent = `Loaded ${file.name} (${loadedImage.width}x${loadedImage.height}).`;
        sizeText.textContent = `Original size: ${kb(file.size)}`;
      } catch (error) {
        loadedImage = null;
        status.textContent = error.message;
        sizeText.textContent = "";
      }
    });

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      const file = sourceInput.files && sourceInput.files[0];
      if (!file || !loadedImage) {
        status.textContent = "Please upload a valid image file.";
        return;
      }

      const mime = formatInput.value;
      const quality = Number(qualityInput.value);
      const exportQuality = Number.isFinite(quality) ? Math.min(1, Math.max(0.1, quality)) : 0.75;

      canvas.width = loadedImage.width;
      canvas.height = loadedImage.height;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(loadedImage, 0, 0);

      canvas.toBlob((blob) => {
        if (!blob) {
          status.textContent = "Unable to create compressed output.";
          return;
        }

        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `compressed.${extensionFromMime(mime)}`;
        link.click();
        URL.revokeObjectURL(url);

        status.textContent = "Compression completed.";
        sizeText.textContent = `Original: ${kb(file.size)} | Output: ${kb(blob.size)}`;
      }, mime, exportQuality);
    });

    form.addEventListener("reset", () => {
      loadedImage = null;
      status.textContent = "Upload an image to start compression.";
      sizeText.textContent = "";
    });
  </script>
  <div id="site-footer"></div>
  <script src="/assets/js/partials.js"></script>
</body>
</html>
