<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BluePDF - PDF Form Filler & Editor | Bluetext.in</title>
  <link rel="stylesheet" href="/assets/css/main.css">
  <style>
    body {
      background: #f3f4f6;
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
    }
    
    /* PDF Adobe Red Header */
    .pdf-header {
      background: #dc2626;
      color: #ffffff;
      height: 48px;
      display: flex;
      align-items: center;
      padding: 0 16px;
      justify-content: space-between;
      font-size: 0.9rem;
    }

    .pdf-header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .pdf-app-icon {
      font-size: 1.25rem;
      font-weight: 800;
    }

    .pdf-doc-title-box {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .pdf-title-input {
      background: none;
      border: 1px solid transparent;
      color: #fff;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 2px 6px;
      border-radius: 3px;
      width: 200px;
    }
    .pdf-title-input:focus {
      background: rgba(255,255,255,0.15);
      border-color: #fff;
      outline: none;
    }

    .save-badge {
      font-size: 0.75rem;
      color: #fca5a5;
    }

    /* Ribbon */
    .pdf-ribbon {
      background: #ffffff;
      border-bottom: 1px solid #d1d5db;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    .ribbon-tabs {
      display: flex;
      background: #f3f4f6;
      border-bottom: 1px solid #e5e7eb;
      padding-left: 20px;
    }

    .ribbon-tab {
      background: none;
      border: none;
      padding: 8px 16px;
      font-size: 0.8rem;
      color: #374151;
      cursor: pointer;
      font-weight: 500;
    }
    .ribbon-tab.active {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-bottom-color: transparent;
      color: #dc2626;
      font-weight: 600;
    }

    .ribbon-toolbar {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 8px 20px;
      background: #ffffff;
      flex-wrap: wrap;
    }

    .ribbon-group {
      display: flex;
      align-items: center;
      gap: 6px;
      border-right: 1px solid #e5e7eb;
      padding-right: 12px;
    }

    .ribbon-group:last-child {
      border: none;
    }

    .ribbon-btn {
      background: none;
      border: 1px solid transparent;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
      color: #374151;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .ribbon-btn:hover {
      background: #f3f4f6;
    }
    .ribbon-btn.active {
      background: #fee2e2;
      border-color: #fca5a5;
      color: #dc2626;
    }

    /* Workspace Body */
    .pdf-workspace {
      display: flex;
      height: calc(100vh - 120px);
      overflow: hidden;
    }

    .pdf-center-pane {
      flex-grow: 1;
      background: #f3f4f6;
      padding: 30px;
      overflow-y: auto;
      display: flex;
      justify-content: center;
      position: relative;
    }

    /* PDF Page container mock */
    .pdf-page-sheet {
      width: 100%;
      max-width: 800px;
      min-height: 842px;
      background: #ffffff;
      color: #1a1a1a;
      padding: 50px 60px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
      border: 1px solid #e5e7eb;
      border-radius: 2px;
      box-sizing: border-box;
      position: relative;
    }

    .pdf-section-title {
      font-size: 1.4rem;
      color: #dc2626;
      border-bottom: 2px solid #dc2626;
      padding-bottom: 6px;
      margin-bottom: 20px;
      font-weight: 700;
    }

    /* PDF interactive form controls */
    .pdf-form-group {
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .pdf-form-label {
      font-size: 0.85rem;
      font-weight: 600;
      color: #374151;
    }

    .pdf-input-text {
      width: 100%;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      padding: 8px 10px;
      border-radius: 4px;
      font-size: 0.9rem;
      outline: none;
      box-sizing: border-box;
    }
    .pdf-input-text:focus {
      background: #ffffff;
      border-color: #dc2626;
    }

    /* Watermark Overlay */
    .watermark-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 4.5rem;
      color: rgba(0,0,0,0.02);
      transform: rotate(-30deg);
      pointer-events: none;
      font-weight: 900;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      z-index: 5;
      user-select: none;
    }

    /* Right Sidebar comments & review */
    .pdf-right-sidebar {
      width: 280px;
      background: #ffffff;
      border-left: 1px solid #e5e7eb;
      display: flex;
      flex-direction: column;
      height: 100%;
      flex-shrink: 0;
    }

    .sidebar-tabs {
      display: flex;
      border-bottom: 1px solid #e5e7eb;
    }

    .sidebar-tab {
      flex: 1;
      background: #f9fafb;
      border: none;
      padding: 10px;
      font-size: 0.8rem;
      cursor: pointer;
      color: #4b5563;
    }
    .sidebar-tab.active {
      background: #ffffff;
      font-weight: 600;
      border-bottom: 2px solid #dc2626;
      color: #dc2626;
    }

    .sidebar-content {
      padding: 16px;
      overflow-y: auto;
      flex-grow: 1;
      font-size: 0.8rem;
    }

    .comment-card {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 8px;
    }

    .comment-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.72rem;
      color: #6b7280;
      margin-bottom: 4px;
    }

    .track-changes-item {
      padding: 6px 8px;
      border-left: 3px solid #10b981;
      background: rgba(16, 185, 129, 0.05);
      margin-bottom: 8px;
      border-radius: 0 4px 4px 0;
      font-size: 0.75rem;
    }

    /* Signature Modal / Canvas area */
    .signature-area {
      border: 2px dashed #cbd5e1;
      background: #f8fafc;
      border-radius: 6px;
      height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-style: italic;
      color: #64748b;
      position: relative;
      user-select: none;
    }

    .signature-rendered {
      font-family: 'Brush Script MT', cursive, sans-serif;
      font-size: 2.2rem;
      color: #0f172a;
    }
  </style>
</head>
<body>

  <!-- PDF Header -->
  <header class="pdf-header">
    <div class="pdf-header-left">
      <span class="pdf-app-icon">PDF📕</span>
      <div class="pdf-doc-title-box">
        <input type="text" class="pdf-title-input" id="docTitleInput" value="employee_onboarding.pdf" />
        <span class="save-badge" id="saveIndicator">● Saved to Local Library</span>
      </div>
    </div>
    <div>
      <a href="office-suite.html" style="color:#fff; text-decoration:none; font-weight:600; background:rgba(255,255,255,0.15); padding:6px 12px; border-radius:4px;">Dashboard</a>
    </div>
  </header>

  <!-- Ribbon -->
  <div class="pdf-ribbon">
    <div class="ribbon-tabs">
      <button class="ribbon-tab active">Interactive Fields</button>
      <button class="ribbon-tab" id="btnSignPDF" style="color:#dc2626; font-weight:bold;">✍️ Add E-Signature</button>
      <button class="ribbon-tab" onclick="alert('PDF security options locked locally.')">Encrypt Form</button>
    </div>

    <div class="ribbon-toolbar">
      <!-- Watermark overlay and comments controls -->
      <div class="ribbon-group">
        <button class="ribbon-btn" id="btnAddComment" style="color:#dc2626;">💬 New Comment</button>
        <button class="ribbon-btn" id="btnTrackChanges">Toggle Review Mode (OFF)</button>
        <label style="font-size:0.75rem; color:#4b5563; display:flex; align-items:center; gap:6px; margin-left:10px; cursor:pointer;">
          <input type="checkbox" id="chkWatermark" /> Watermark:
          <input type="text" id="watermarkText" value="COPY ONLY" style="width:90px; padding:2px; border:1px solid #ccc; font-size:0.7rem;" />
        </label>
      </div>
    </div>
  </div>

  <!-- Workspace -->
  <div class="pdf-workspace">
    <div class="pdf-center-pane">
      <div class="watermark-overlay" id="watermarkOverlay" style="display:none;">COPY ONLY</div>
      
      <div class="pdf-page-sheet">
        <div class="pdf-section-title">EMPLOYEE ONBOARDING FORM</div>
        <p style="font-size:0.85rem; color:#4b5563; margin-bottom:24px;">Please complete all interactive fields below. Forms are automatically compiled and saved in-browser.</p>
        
        <div class="pdf-form-group">
          <label class="pdf-form-label">Full Name</label>
          <input type="text" class="pdf-input-text pdf-val-sync" id="pdfFieldName" placeholder="Enter full name" />
        </div>

        <div class="pdf-form-group">
          <label class="pdf-form-label">Job Title / Designation</label>
          <input type="text" class="pdf-input-text pdf-val-sync" id="pdfFieldTitle" placeholder="Designation" />
        </div>

        <div class="pdf-form-group">
          <label class="pdf-form-label">Department / Unit</label>
          <input type="text" class="pdf-input-text pdf-val-sync" id="pdfFieldDept" placeholder="Department" />
        </div>

        <div class="pdf-form-group" style="margin-top: 30px;">
          <label class="pdf-form-label">Employee Digital Signature</label>
          <div class="signature-area" id="signatureBox">
            <span id="signaturePlaceholder">Click to Sign Form</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Right Sidebar comments & Review logs -->
    <aside class="pdf-right-sidebar">
      <div class="sidebar-tabs">
        <button class="sidebar-tab active" id="tabComments">Comments</button>
        <button class="sidebar-tab" id="tabReview">Review Logs</button>
      </div>
      
      <div class="sidebar-content" id="sidebarContent">
        <!-- Loaded dynamically -->
      </div>
    </aside>
  </div>

  <script>
    const DB_KEY = "bt_office_docs_v1";
    let documentCatalog = [];
    let activeDoc = null;
    let docComments = [];
    let reviewLogs = [];
    let activeTab = "comments";
    let isTrackChanges = false;

    let formData = {};

    const urlParams = new URLSearchParams(window.location.search);
    const docId = urlParams.get("id");

    function loadDoc() {
      const stored = localStorage.getItem(DB_KEY);
      if (stored) {
        documentCatalog = JSON.parse(stored);
      }
      
      activeDoc = documentCatalog.find(d => d.id === docId);
      if (!activeDoc) {
        alert("Document not found.");
        window.location.href = "office-suite.html";
        return;
      }

      document.getElementById("docTitleInput").value = activeDoc.name;

      formData = activeDoc.content && typeof activeDoc.content === 'object' ? activeDoc.content : {
        name: "John Doe Jr.",
        title: "Software Engineer",
        dept: "Cloud Infrastructure",
        signature: ""
      };

      // Fill values into inputs
      document.getElementById("pdfFieldName").value = formData.name || "";
      document.getElementById("pdfFieldTitle").value = formData.title || "";
      document.getElementById("pdfFieldDept").value = formData.dept || "";
      
      if (formData.signature) {
        renderSignature(formData.signature);
      }

      docComments = activeDoc.comments || [
        { user: "Jane Doe", time: "03:40 PM", text: "Please sign form promptly." }
      ];
      
      reviewLogs = activeDoc.reviewLogs || [
        { time: "03:30 PM", text: "PDF Form rendered successfully", type: "addition" }
      ];

      renderSidebar();
    }

    function saveDoc() {
      if (!activeDoc) return;
      activeDoc.name = document.getElementById("docTitleInput").value;
      activeDoc.content = formData;
      activeDoc.comments = docComments;
      activeDoc.reviewLogs = reviewLogs;

      const idx = documentCatalog.findIndex(d => d.id === activeDoc.id);
      if (idx !== -1) {
        documentCatalog[idx] = activeDoc;
      }
      localStorage.setItem(DB_KEY, JSON.stringify(documentCatalog));
    }

    // Input monitoring
    document.querySelectorAll(".pdf-val-sync").forEach(input => {
      input.addEventListener("input", (e) => {
        const id = e.target.id;
        if (id === "pdfFieldName") formData.name = e.target.value;
        if (id === "pdfFieldTitle") formData.title = e.target.value;
        if (id === "pdfFieldDept") formData.dept = e.target.value;
        saveDoc();
        if (isTrackChanges) {
          logReview(`Updated form field: ${id} to "${e.target.value}"`);
        }
      });
    });

    // Digital signature flow
    const signatureBox = document.getElementById("signatureBox");
    signatureBox.addEventListener("click", triggerSignature);
    document.getElementById("btnSignPDF").addEventListener("click", triggerSignature);

    function triggerSignature() {
      const sigName = prompt("Type your signature name to sign digital form:");
      if (!sigName) return;
      formData.signature = sigName;
      renderSignature(sigName);
      saveDoc();
      logReview(`Digitally signed form as "${sigName}"`);
    }

    function renderSignature(name) {
      signatureBox.innerHTML = `<span class="signature-rendered">${name}</span>`;
    }

    // Watermark
    const chkWatermark = document.getElementById("chkWatermark");
    const watermarkText = document.getElementById("watermarkText");
    const overlay = document.getElementById("watermarkOverlay");

    function updateWatermark() {
      if (chkWatermark.checked && watermarkText.value) {
        overlay.style.display = "flex";
        overlay.textContent = watermarkText.value;
      } else {
        overlay.style.display = "none";
      }
    }
    chkWatermark.addEventListener("change", updateWatermark);
    watermarkText.addEventListener("input", updateWatermark);

    // Comments & Review Tabs
    const tabComments = document.getElementById("tabComments");
    const tabReview = document.getElementById("tabReview");

    tabComments.addEventListener("click", () => {
      activeTab = "comments";
      tabComments.classList.add("active");
      tabReview.classList.remove("active");
      renderSidebar();
    });

    tabReview.addEventListener("click", () => {
      activeTab = "review";
      tabReview.classList.add("active");
      tabComments.classList.remove("active");
      renderSidebar();
    });

    document.getElementById("btnTrackChanges").addEventListener("click", (e) => {
      isTrackChanges = !isTrackChanges;
      e.target.textContent = `Toggle Review Mode (${isTrackChanges ? 'ON' : 'OFF'})`;
      e.target.classList.toggle("active", isTrackChanges);
    });

    document.getElementById("btnAddComment").addEventListener("click", () => {
      const comment = prompt("Add comment/notes on interactive form field:");
      if (!comment) return;
      const user = "John Smith";
      const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      docComments.push({ user, time, text: comment });
      saveDoc();
      renderSidebar();
    });

    function logReview(msg, type = "addition") {
      const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      reviewLogs.push({ time, text: msg, type });
      saveDoc();
      if (activeTab === "review") renderSidebar();
    }

    function renderSidebar() {
      const content = document.getElementById("sidebarContent");
      content.innerHTML = "";
      
      if (activeTab === "comments") {
        docComments.forEach(c => {
          const div = document.createElement("div");
          div.className = "comment-card";
          div.innerHTML = `
            <div class="comment-meta">
              <span><strong>${c.user}</strong></span>
              <span>${c.time}</span>
            </div>
            <div style="color: #374151; margin-top:4px;">${c.text}</div>
          `;
          content.appendChild(div);
        });
      } else {
        reviewLogs.forEach(r => {
          const div = document.createElement("div");
          div.className = `track-changes-item`;
          div.innerHTML = `<strong>${r.time}</strong>: ${r.text}`;
          content.appendChild(div);
        });
      }
    }

    loadDoc();
  </script>
</body>
</html>
