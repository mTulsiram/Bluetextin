<!doctype html>
<html lang="en" data-tool-id="office-suite">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BlueOffice Suite Dashboard | Bluetext.in</title>
  <meta name="description" content="A premium, serverless office suite. Create, upload, manage and share Word docs, spreadsheets, slides, PDFs and diagrams locally in your browser.">
  <link rel="stylesheet" href="/assets/css/main.css">
  
  <script async crossorigin="anonymous" src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@latest/dist/clerk.browser.js"></script>

  <style>
    .office-container {
      display: flex;
      min-height: 70vh;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      overflow: hidden;
      margin-top: 1.5rem;
      font-family: var(--font-main);
      color: var(--text-primary);
    }

    .office-sidebar {
      width: 260px;
      background: var(--bg-card);
      border-right: 1px solid var(--border-color);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      flex-shrink: 0;
      color: var(--text-primary);
    }
    
    .sidebar-title {
      font-size: 1.2rem;
      font-weight: 800;
      letter-spacing: 0.03em;
      color: var(--text-primary);
      margin-bottom: 8px;
    }
    
    .sidebar-section-title {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-secondary);
      margin-bottom: 8px;
      font-weight: 700;
    }

    .create-btn-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn-create {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      transition: all var(--transition);
      color: #ffffff;
    }
    
    .btn-doc { background: #0284c7; }
    .btn-doc:hover { background: #0369a1; }
    .btn-doc:focus-visible { outline: 3px solid #0284c7; }
    .btn-sheet { background: #16a34a; }
    .btn-sheet:hover { background: #15803d; }
    .btn-sheet:focus-visible { outline: 3px solid #16a34a; }
    .btn-slides { background: #ea580c; }
    .btn-slides:hover { background: #c2410c; }
    .btn-slides:focus-visible { outline: 3px solid #ea580c; }
    .btn-pdf { background: #dc2626; }
    .btn-pdf:hover { background: #b91c1c; }
    .btn-pdf:focus-visible { outline: 3px solid #dc2626; }

    .btn-upload {
      background: var(--bg-main);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      transition: background 0.2s;
    }
    .btn-upload:hover { background: var(--border-color); }

    .sidebar-footer-controls {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      font-size: 0.8rem;
    }

    .sidebar-footer-controls label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      color: var(--text-secondary);
    }

    .sidebar-footer-controls select {
      background: var(--bg-main);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 6px;
      border-radius: 4px;
      outline: none;
    }

    .office-main {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      background: var(--bg-main);
      min-width: 0;
    }

    .office-topbar {
      height: 60px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      background: var(--bg-card);
      color: var(--text-primary);
    }
    
    .topbar-title {
      font-weight: 700;
      font-size: 1rem;
    }

    .auth-section {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-auth-mode {
      background: var(--accent-primary);
      color: var(--accent-contrast);
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.78rem;
      cursor: pointer;
    }
    .btn-auth-mode.sandbox {
      background: var(--border-color);
      color: var(--text-primary);
    }

    .dashboard-view {
      padding: 30px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      flex-grow: 1;
      overflow-y: auto;
    }

    .doc-list-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .doc-list-header h2 {
      margin: 0;
      font-size: 1.4rem;
      color: var(--text-primary);
    }

    .btn-clear {
      background: rgba(220, 38, 38, 0.1);
      border: 1px solid #ef4444;
      color: #ef4444;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 0.78rem;
      cursor: pointer;
    }
    .btn-clear:hover { background: rgba(220, 38, 38, 0.2); }

    .document-table-wrap {
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      overflow: hidden;
      background: var(--bg-card);
    }

    .document-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
      text-align: left;
    }

    .document-table th, .document-table td {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border-color);
      color: var(--text-primary);
    }

    .document-table th {
      background: var(--bg-main);
      color: var(--text-secondary);
      font-weight: 600;
    }

    .document-table tr:hover td {
      background: rgba(0, 0, 0, 0.02);
    }

    [data-theme="dark"] .document-table tr:hover td {
      background: rgba(255, 255, 255, 0.02);
    }

    .file-icon {
      font-size: 1.1rem;
      margin-right: 8px;
    }

    .actions-cell {
      display: flex;
      gap: 12px;
    }

    .action-icon-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 1.05rem;
      padding: 4px;
      transition: color 0.2s;
    }
    .action-icon-btn:hover { color: var(--text-primary); }
    .action-icon-btn.delete:hover { color: #ef4444; }
  </style>
</head>
<body>
  <div id="site-header"></div>

  <main class="doc-page" role="main" style="max-width:100%; padding:0 24px;">
    <div class="office-container">
      
      <!-- Sidebar Control Panel -->
      <aside class="office-sidebar">
        <div class="sidebar-title">🇪🇺 EuroOffice Suite</div>
        
        <div class="sidebar-section-title">Create New</div>
        <div class="create-btn-group">
          <button type="button" class="btn-create btn-doc" id="btnNewDoc">✍️ Document</button>
          <button type="button" class="btn-create btn-sheet" id="btnNewSheet">📊 Spreadsheet</button>
          <button type="button" class="btn-create btn-slides" id="btnNewSlides">📉 Presentation</button>
          <button type="button" class="btn-create btn-pdf" id="btnNewPDFForm">📝 PDF Form</button>
        </div>

        <div style="border-top:1px solid #1e293b; padding-top:16px; display:flex; flex-direction:column; gap:10px;">
          <button type="button" class="btn-upload" id="btnUploadTrigger">📁 Upload Document</button>
          <input type="file" id="officeFileInput" style="display:none;" />
        </div>
      </aside>

      <!-- Main Panel -->
      <section class="office-main" aria-label="Office landing page">
        <header class="office-topbar">
          <div class="topbar-title">BlueOffice Suite Dashboard</div>
          <div class="auth-section">
            <span id="authStatusText" style="font-size:0.8rem; color:#94a3b8;">Status: Inhouse Sandbox</span>
            <button type="button" class="btn-auth-mode sandbox" id="btnToggleAuthMode">Toggle Clerk Auth</button>
          </div>
        </header>

        <div class="dashboard-view" id="dashboardView">
          <div class="doc-list-header">
            <h2>Your documents</h2>
            <button type="button" class="btn-clear" id="btnClearAllDocs">Clear All</button>
          </div>

          <div class="document-table-wrap">
            <table class="document-table">
              <thead>
                <tr>
                  <th>Filename</th>
                  <th>Size</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="documentTableBody">
                <!-- Loaded dynamically -->
              </tbody>
            </table>
          </div>
        </div>
      </section>

    </div>
  </main>

  <div id="site-footer"></div>

  <script>
    const DB_KEY = "bt_office_docs_v1";
    let documentCatalog = [];
    let isClerkAuth = false;

    const SAMPLE_DOCS = [
      { id: "doc1", name: "growth_business_proposal.docx", type: "WORD", size: "24 KB", content: "" },
      {

          "B16": "New / Open: Document initiation templates and file retrieval systems.",
          "B17": "Save / Save As: Location targeting (OneDrive, Local Disk) and file type conversion.",
          "B18": "Print: Print layout previews, margin configuration, and printer routing.",
          "B19": "Export: Direct generation of PDF/XPS documents.",

          "A24": "* Core Purpose: Day-to-day data entry, structural layout design, and immediate aesthetic formatting.",
          "A25": "* Key Groups & Contents:",
          "B26": "Clipboard: Cut, Copy, Paste, and the Format Painter.",
          "B27": "Font: Typefaces, text sizing, cell borders, and background fills.",
          "B28": "Alignment: Text wrapping, cell merging, vertical/horizontal alignment, and text indentation.",
          "B29": "Number: Numeric data formatting (Currency, Percentages, Dates, decimals).",
          "B30": "Styles: Conditional Formatting (rules-based cell coloring) and structural Table Styles.",
          "B31": "Cells: Rapid row/column insertion, deletion, and height/width adjustments.",

          "A34": "## ➕ Insert",
          "A35": "* Target User: Data analysts, financial modelers, and report designers.",

          "B41": "Charts: Bar, Line, Pie, Scatter, and specialized pivot charts.",
          "B42": "Sparklines: Miniature, single-cell trend charts (Line, Column, Win/Loss).",
          "B43": "Filters: Slicers and Timelines for visual dashboard interactions.",
          "B44": "Links: Hyperlink routing to web domains or internal sheet coordinates.",

          "B83": "Accessibility: The Accessibility Checker to ensure worksheets remain functional for disabled screen readers.",
          "B84": "Insights: Smart Lookup engines using online database queries.",
          "B85": "Language: Translation tools for text cells.",
          "B86": "Comments & Notes: Threaded conversational comments and old-school sticky notes.",
          "B87": "Protect: Sheet locking, Workbook structure encryption, and editing permissions assignment.",

          "A89": "## 🖥️ View",
          "A90": "* Target User: Power users navigating large enterprise models or configuring workspace ergonomics.",
          "A91": "* Core Purpose: Modifying workspace visibility, handling multiple split screens, and managing automated macros.",
          "A92": "* Key Groups & Contents:",
          "B93": "Workbook Views: Normal View, Page Break Preview (for adjustments), and Page Layout View.",
          "B94": "Show: Visibility checkboxes for the Formula Bar, Gridlines, and Sheet Headings.",
          "B95": "Zoom: Direct screen magnification controls.",
          "B96": "Window: Freeze Panes (locking rows/columns while scrolling), Split screen, and New Window instances.",
          "B97": "Macros: Access point for recording and executing VBA automation steps.",

          "A99": "------------------------------------------------------------",
          "A100": "## Hidden & Contextual Ribbon Tabs (Crucial for Book Accuracy)",
          "A102": "Contextual Tab Name", "B102": "Trigger Action", "C102": "Core Tools Provided",
          "A103": "Chart Design / Format", "B103": "Selecting any Chart asset", "C103": "Changing layout styles, modifying data source ranges, and re-routing axis lines.",
          "A104": "Table Design", "B104": "Clicking inside an Excel Table (Ctrl+T)", "C104": "Toggling Total Rows, changing corporate color themes, and adding table names.",
          "A105": "PivotTable Analyze", "B105": "Clicking inside a PivotTable", "C105": "Refreshing source structures, updating data ranges, and nesting calculated items.",
          "A106": "Picture Format", "B106": "Selecting an embedded Image", "C106": "Background removal tools, aspect ratio cropping, and color correction.",
          "A107": "Developer (Hidden)", "B107": "Manually enabled in options", "C107": "Writing custom VBA modules, designing interactive UserForms, and XML data maps."
        }
      },
      { id: "doc3", name: "strategic_roadmap.pptx", type: "SLIDE", size: "1.2 MB", content: [] },
      { id: "doc4", name: "employee_onboarding.pdf", type: "PDF", size: "320 KB", content: [] },
      { id: "doc5", name: "system_architecture.vsdx", type: "DIAGRAM", size: "95 KB", content: {} }
    ];

    function initDb() {
      const stored = localStorage.getItem(DB_KEY);
      if (stored) {
        documentCatalog = JSON.parse(stored);
        // Force migration/replacement if doc2 has old name or data
        const doc2Idx = documentCatalog.findIndex(d => d.id === "doc2");
        if (doc2Idx !== -1 && documentCatalog[doc2Idx].name !== "RatingsCMDB.xlsx") {
          documentCatalog[doc2Idx] = SAMPLE_DOCS[1];
          saveDb();
        }
      } else {
        documentCatalog = [...SAMPLE_DOCS];
        saveDb();
      }
      renderDashboard();
    }

    function saveDb() {
      localStorage.setItem(DB_KEY, JSON.stringify(documentCatalog));
    }

    function renderDashboard() {
      const body = document.getElementById("documentTableBody");
      body.innerHTML = "";
      documentCatalog.forEach(doc => {
        const tr = document.createElement("tr");
        let typeIcon = "📄";
        let openUrl = "doc.html";
        if (doc.type === "WORD") { typeIcon = "✍️"; openUrl = "doc.html"; }
        if (doc.type === "CELL") { typeIcon = "📊"; openUrl = "sheet.html"; }
        if (doc.type === "SLIDE") { typeIcon = "📉"; openUrl = "slides.html"; }
        if (doc.type === "PDF") { typeIcon = "📝"; openUrl = "pdf.html"; }
        if (doc.type === "DIAGRAM") { typeIcon = "📐"; openUrl = "diagram.html"; }

        tr.innerHTML = `
          <td><span class="file-icon">${typeIcon}</span><strong>${doc.name}</strong></td>
          <td>${doc.size}</td>
          <td class="actions-cell">
            <a href="${openUrl}?id=${doc.id}" class="action-icon-btn" title="Open in editor">📂</a>
            <button class="action-icon-btn" title="Share" onclick="simulateShare('${doc.name}')">🤝</button>
            <button class="action-icon-btn" title="Download" onclick="simulateDownload('${doc.name}')">💾</button>
            <button class="action-icon-btn delete" title="Delete" onclick="deleteDocById('${doc.id}')">🗑️</button>
          </td>
        `;
        body.appendChild(tr);
      });
    }

    window.deleteDocById = function(id) {
      documentCatalog = documentCatalog.filter(d => d.id !== id);
      saveDb();
      renderDashboard();
    };

    window.simulateShare = function(name) {
      const shareUrl = `${window.location.origin}/tools/office/office-suite.html?file=${encodeURIComponent(name)}`;
      navigator.clipboard.writeText(shareUrl);
      alert(`Shareable collaboration link copied to clipboard:\n${shareUrl}`);
    };

    window.simulateDownload = function(name) {
      alert(`Downloading ${name} to your local drive...`);
    };

    btnToggleAuthMode = document.getElementById("btnToggleAuthMode");
    btnToggleAuthMode.addEventListener("click", () => {
      isClerkAuth = !isClerkAuth;
      const statusText = document.getElementById("authStatusText");
      if (isClerkAuth) {
        statusText.textContent = "Status: Clerk SDK Integrated";
        statusText.style.color = "#00f0ff";
        btnToggleAuthMode.textContent = "Toggle Sandbox";
        btnToggleAuthMode.classList.remove("sandbox");
        if (window.Clerk) {
          window.Clerk.load().then(() => { if (!window.Clerk.user) window.Clerk.openSignIn(); });
        } else {
          alert("Clerk cloud Auth endpoint simulated.");
        }
      } else {
        statusText.textContent = "Status: Inhouse Sandbox";
        statusText.style.color = "#94a3b8";
        btnToggleAuthMode.textContent = "Toggle Clerk Auth";
        btnToggleAuthMode.classList.add("sandbox");
      }
    });

    function generateId() {
      return "doc_" + Math.random().toString(36).substr(2, 9);
    }

    document.getElementById("btnNewDoc").addEventListener("click", () => {
      const name = prompt("Enter Document name:", "Untitled.docx");
      if (!name) return;
      const d = { id: generateId(), name: name.endsWith(".docx") ? name : name + ".docx", type: "WORD", size: "12 KB", content: "" };
      documentCatalog.push(d);
      saveDb();
      window.location.href = `doc.html?id=${d.id}`;
    });

    document.getElementById("btnNewSheet").addEventListener("click", () => {
      const name = prompt("Enter Spreadsheet name:", "Untitled.xlsx");
      if (!name) return;
      const d = { id: generateId(), name: name.endsWith(".xlsx") ? name : name + ".xlsx", type: "CELL", size: "8 KB", content: {} };
      documentCatalog.push(d);
      saveDb();
      window.location.href = `sheet.html?id=${d.id}`;
    });

    document.getElementById("btnNewSlides").addEventListener("click", () => {
      const name = prompt("Enter Presentation name:", "Untitled.pptx");
      if (!name) return;
      const d = { id: generateId(), name: name.endsWith(".pptx") ? name : name + ".pptx", type: "SLIDE", size: "250 KB", content: [] };
      documentCatalog.push(d);
      saveDb();
      window.location.href = `slides.html?id=${d.id}`;
    });

    document.getElementById("btnNewPDFForm").addEventListener("click", () => {
      const name = prompt("Enter PDF Form name:", "Untitled.pdf");
      if (!name) return;
      const d = { id: generateId(), name: name.endsWith(".pdf") ? name : name + ".pdf", type: "PDF", size: "34 KB", content: [] };
      documentCatalog.push(d);
      saveDb();
      window.location.href = `pdf.html?id=${d.id}`;
    });

    // Upload simulation
    const btnUploadTrigger = document.getElementById("btnUploadTrigger");
    const officeFileInput = document.getElementById("officeFileInput");
    btnUploadTrigger.addEventListener("click", () => officeFileInput.click());
    officeFileInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const name = file.name;
      let type = "WORD";
      let openUrl = "doc.html";
      if (/\.(xlsx|xls|csv|ods)$/i.test(name)) { type = "CELL"; openUrl = "sheet.html"; }
      else if (/\.(pptx|ppt|odp|key)$/i.test(name)) { type = "SLIDE"; openUrl = "slides.html"; }
      else if (/\.(pdf|oform)$/i.test(name)) { type = "PDF"; openUrl = "pdf.html"; }
      else if (/\.(vsdx|svg)$/i.test(name)) { type = "DIAGRAM"; openUrl = "diagram.html"; }

      const reader = new FileReader();
      reader.onload = function(evt) {
        let fileContent = evt.target.result;
        
        // Handle CSV to Excel grid mapping
        if (name.endsWith(".csv")) {
          const cells = {};
          const lines = fileContent.split(/\r?\n/);
          
          function parseCSVLine(text) {
            let p = '', c = [];
            let inQuotes = false;
            for (let i = 0; i < text.length; i++) {
              let ch = text[i];
              if (ch === '"') {
                inQuotes = !inQuotes;
              } else if (ch === ',' && !inQuotes) {
                c.push(p);
                p = '';
              } else {
                p += ch;
              }
            }
            c.push(p);
            return c;
          }

          function getColumnLabel(index) {
            let label = "";
            let temp = index;
            while (temp >= 0) {
              label = String.fromCharCode((temp % 26) + 65) + label;
              temp = Math.floor(temp / 26) - 1;
            }
            return label;
          }

          let parsedRowCount = 0;
          for (let rIdx = 0; rIdx < lines.length; rIdx++) {
            if (!lines[rIdx].trim()) continue;
            if (parsedRowCount >= 5000) break; // Limit to 5000 rows for localStorage
            const cols = parseCSVLine(lines[rIdx]);
            cols.forEach((val, cIdx) => {
              // Support up to 100 columns (A to CV)
              if (cIdx < 100) {
                const colLetter = getColumnLabel(cIdx);
                cells[`${colLetter}${parsedRowCount + 1}`] = val.replace(/^"|"$/g, '').trim();
              }
            });
            parsedRowCount++;
          }
          fileContent = cells;
        }

        const d = { id: generateId(), name: name, type: type, size: `${(file.size / 1024).toFixed(0)} KB`, content: fileContent };
        documentCatalog.push(d);
        saveDb();
        window.location.href = `${openUrl}?id=${d.id}`;
      };

      if (name.endsWith(".csv") || name.endsWith(".txt") || name.endsWith(".svg") || name.endsWith(".html")) {
        reader.readAsText(file);
      } else {
        reader.readAsDataURL(file); // fallback base64
      }
    });

    document.getElementById("btnClearAllDocs").addEventListener("click", () => {
      if (confirm("Are you sure you want to clear your local library?")) {
        documentCatalog = [];
        saveDb();
        renderDashboard();
      }
    });

    initDb();
  </script>
  <script src="/assets/js/partials.js"></script>
</body>
</html>
