<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BlueWriter - Word Online Editor | Bluetext.in</title>
  <link rel="stylesheet" href="/assets/css/main.css">
  <style>
    body {
      background: #f3f4f6;
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
    }
    
    /* Word Blue Header */
    .word-header {
      background: #107c41; /* Excel green, wait, Word is blue #2b579a or #185abd */
      background: #185abd;
      color: #ffffff;
      height: 48px;
      display: flex;
      align-items: center;
      padding: 0 16px;
      justify-content: space-between;
      font-size: 0.9rem;
    }

    .word-header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .word-app-icon {
      font-size: 1.25rem;
      font-weight: 800;
    }

    .word-doc-title-box {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .word-title-input {
      background: none;
      border: 1px solid transparent;
      color: #fff;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 2px 6px;
      border-radius: 3px;
      width: 200px;
    }
    .word-title-input:focus {
      background: rgba(255,255,255,0.15);
      border-color: #fff;
      outline: none;
    }

    .save-badge {
      font-size: 0.75rem;
      color: #c7d2fe;
    }

    /* Word Office Ribbon */
    .word-ribbon {
      background: #ffffff;
      border-bottom: 1px solid #d1d5db;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    .ribbon-tabs {
      display: flex;
      background: #f3f4f6;
      border-bottom: 1px solid #e5e7eb;
      padding-left: 20px;
    }

    .ribbon-tab {
      background: none;
      border: none;
      padding: 8px 16px;
      font-size: 0.8rem;
      color: #374151;
      cursor: pointer;
      font-weight: 500;
    }
    .ribbon-tab.active {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-bottom-color: transparent;
      color: #185abd;
      font-weight: 600;
    }

    .ribbon-toolbar {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 8px 20px;
      background: #ffffff;
      flex-wrap: wrap;
    }

    .ribbon-group {
      display: flex;
      align-items: center;
      gap: 6px;
      border-right: 1px solid #e5e7eb;
      padding-right: 12px;
    }

    .ribbon-group:last-child {
      border: none;
    }

    .ribbon-select {
      border: 1px solid #d1d5db;
      background: #f9fafb;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.78rem;
      outline: none;
    }

    .ribbon-btn {
      background: none;
      border: 1px solid transparent;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
      color: #374151;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .ribbon-btn:hover {
      background: #f3f4f6;
    }
    .ribbon-btn.active {
      background: #e0e7ff;
      border-color: #a5b4fc;
      color: #185abd;
    }

    /* Workspace Body */
    .word-workspace {
      display: flex;
      height: calc(100vh - 120px);
      overflow: hidden;
    }

    .word-center-pane {
      flex-grow: 1;
      background: #f3f4f6;
      padding: 30px;
      overflow-y: auto;
      display: flex;
      justify-content: center;
      position: relative;
    }

    /* A4 sheet style */
    .word-page-sheet {
      width: 100%;
      max-width: 800px;
      min-height: 842px;
      background: #ffffff;
      color: #1a1a1a;
      padding: 60px 80px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
      outline: none;
      font-family: Arial, sans-serif;
      font-size: 14px;
      line-height: 1.6;
      border: 1px solid #e5e7eb;
      border-radius: 2px;
      box-sizing: border-box;
    }

    .watermark-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 4.5rem;
      color: rgba(0,0,0,0.02);
      transform: rotate(-30deg);
      pointer-events: none;
      font-weight: 900;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      z-index: 5;
      user-select: none;
    }

    /* Right Sidebar comments & review */
    .word-right-sidebar {
      width: 280px;
      background: #ffffff;
      border-left: 1px solid #e5e7eb;
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .sidebar-tabs {
      display: flex;
      border-bottom: 1px solid #e5e7eb;
    }

    .sidebar-tab {
      flex: 1;
      background: #f9fafb;
      border: none;
      padding: 10px;
      font-size: 0.8rem;
      cursor: pointer;
      color: #4b5563;
    }
    .sidebar-tab.active {
      background: #ffffff;
      font-weight: 600;
      border-bottom: 2px solid #185abd;
      color: #185abd;
    }

    .sidebar-content {
      padding: 16px;
      overflow-y: auto;
      flex-grow: 1;
      font-size: 0.8rem;
    }

    .comment-card {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 8px;
    }

    .comment-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.72rem;
      color: #6b7280;
      margin-bottom: 4px;
    }

    .track-changes-item {
      padding: 6px 8px;
      border-left: 3px solid #10b981;
      background: rgba(16, 185, 129, 0.05);
      margin-bottom: 8px;
      border-radius: 0 4px 4px 0;
      font-size: 0.75rem;
    }
    .track-changes-item.deletion {
      border-left-color: #ef4444;
      background: rgba(239, 68, 68, 0.05);
    }
  </style>
</head>
<body>

  <!-- Word Online Header -->
  <header class="word-header">
    <div class="word-header-left">
      <span class="word-app-icon">W📘</span>
      <div class="word-doc-title-box">
        <input type="text" class="word-title-input" id="docTitleInput" value="growth_business_proposal.docx" />
        <span class="save-badge" id="saveIndicator">● Saved to Local Library</span>
      </div>
    </div>
    <div>
      <a href="office-suite.html" style="color:#fff; text-decoration:none; font-weight:600; background:rgba(255,255,255,0.15); padding:6px 12px; border-radius:4px;">Dashboard</a>
    </div>
  </header>

  <!-- Word Office Ribbon -->
  <div class="word-ribbon">
    <div class="ribbon-tabs">
      <button class="ribbon-tab active">Home</button>
      <button class="ribbon-tab" onclick="alert('Insert options simulation loaded.')">Insert</button>
      <button class="ribbon-tab" onclick="alert('References index generator ready.')">References</button>
      <button class="ribbon-tab" id="ribbonTabReview">Review</button>
    </div>

    <div class="ribbon-toolbar">
      <!-- Font Family & Size -->
      <div class="ribbon-group">
        <select class="ribbon-select" id="fontFamilySelect">
          <option value="Arial">Arial</option>
          <option value="Calibri" selected>Calibri</option>
          <option value="Georgia">Georgia</option>
          <option value="Times New Roman">Times New Roman</option>
        </select>
        <select class="ribbon-select" id="fontSizeSelect" style="width: 55px;">
          <option value="12px">9</option>
          <option value="14px">10</option>
          <option value="16px" selected>11</option>
          <option value="18px">12</option>
          <option value="24px">16</option>
        </select>
      </div>

      <!-- Bold, Italic, Underline, Strike -->
      <div class="ribbon-group">
        <button class="ribbon-btn" id="btnBold" title="Bold"><b>B</b></button>
        <button class="ribbon-btn" id="btnItalic" title="Italic"><i>I</i></button>
        <button class="ribbon-btn" id="btnUnderline" title="Underline"><u>U</u></button>
        <button class="ribbon-btn" id="btnStrike" style="text-decoration:line-through;" title="Strikethrough">ab</button>
      </div>

      <!-- Alignment Groups -->
      <div class="ribbon-group">
        <button class="ribbon-btn" id="btnAlignLeft">Align Left</button>
        <button class="ribbon-btn" id="btnAlignCenter">Center</button>
        <button class="ribbon-btn" id="btnAlignRight">Align Right</button>
      </div>

      <!-- Watermark overlay and comments controls -->
      <div class="ribbon-group">
        <button class="ribbon-btn" id="btnAddComment" style="color:#185abd;">💬 New Comment</button>
        <button class="ribbon-btn" id="btnTrackChanges">Toggle Review Mode (OFF)</button>
        <label style="font-size:0.75rem; color:#4b5563; display:flex; align-items:center; gap:6px; margin-left:10px; cursor:pointer;">
          <input type="checkbox" id="chkWatermark" /> Watermark:
          <input type="text" id="watermarkText" value="CONFIDENTIAL" style="width:90px; padding:2px; border:1px solid #ccc; font-size:0.7rem;" />
        </label>
      </div>
    </div>
  </div>

  <!-- Main Workpane -->
  <div class="word-workspace">
    <!-- Center canvas sheet -->
    <div class="word-center-pane">
      <div class="watermark-overlay" id="watermarkOverlay" style="display:none;">CONFIDENTIAL</div>
      <div class="word-page-sheet" id="editorArea" contenteditable="true">
        <!-- Loaded dynamically -->
      </div>
    </div>

    <!-- Right Sidebar comments & Review logs -->
    <aside class="word-right-sidebar">
      <div class="sidebar-tabs">
        <button class="sidebar-tab active" id="tabComments">Comments</button>
        <button class="sidebar-tab" id="tabReview">Review Logs</button>
      </div>
      
      <div class="sidebar-content" id="sidebarContent">
        <!-- Loaded dynamically -->
      </div>
    </aside>
  </div>

  <script>
    const DB_KEY = "bt_office_docs_v1";
    let documentCatalog = [];
    let activeDoc = null;
    let docComments = [];
    let reviewLogs = [];
    let activeTab = "comments";
    let isTrackChanges = false;

    // Get file ID from query string
    const urlParams = new URLSearchParams(window.location.search);
    const docId = urlParams.get("id");

    function loadDoc() {
      const stored = localStorage.getItem(DB_KEY);
      if (stored) {
        documentCatalog = JSON.parse(stored);
      }
      
      activeDoc = documentCatalog.find(d => d.id === docId);
      if (!activeDoc) {
        alert("Document not found.");
        window.location.href = "office-suite.html";
        return;
      }

      // Title & Content
      document.getElementById("docTitleInput").value = activeDoc.name;
      
      const defaultContent = `
        <p style="text-align: center;"><strong style="font-size: 1.8rem; line-height: 1.2;">GROWTH BUSINESS PROPOSAL</strong></p>
        <hr style="border: 0; border-top: 1px solid #1a1a1a; margin: 20px 0;" />
        <p><strong>This proposal outlines a streamlined solution designed to address key business challenges and drive growth.</strong> Our approach leverages industry expertise, innovative strategies, and data-driven insights to create a tailored plan that delivers measurable results.</p>
        
        <p style="margin-top:30px;"><strong style="font-size:1.2rem;">PROBLEM STATEMENT</strong></p>
        <p>Businesses today face challenges such as inefficiencies, rising costs, and evolving market demands. Addressing these issues requires a well-structured approach.</p>
        
        <p style="margin-top:30px;"><strong style="font-size:1.2rem;">SOLUTION SUMMARY</strong></p>
        <p>Our solution is designed to improve overall performance. Using best practices, we help businesses optimize workflows and drive innovation.</p>
      `;

      document.getElementById("editorArea").innerHTML = activeDoc.content || defaultContent;
      
      // Comments database structure
      docComments = activeDoc.comments || [
        { user: "Jane Doe", time: "10:15 AM", text: "Please review the heading sizes." }
      ];
      
      reviewLogs = activeDoc.reviewLogs || [
        { time: "10:00 AM", text: "Created document skeleton", type: "addition" }
      ];

      renderSidebar();
    }

    function saveDoc() {
      if (!activeDoc) return;
      activeDoc.name = document.getElementById("docTitleInput").value;
      activeDoc.content = document.getElementById("editorArea").innerHTML;
      activeDoc.comments = docComments;
      activeDoc.reviewLogs = reviewLogs;

      const idx = documentCatalog.findIndex(d => d.id === activeDoc.id);
      if (idx !== -1) {
        documentCatalog[idx] = activeDoc;
      }
      localStorage.setItem(DB_KEY, JSON.stringify(documentCatalog));
    }

    // Formatting Actions
    document.getElementById("btnBold").addEventListener("click", () => document.execCommand("bold"));
    document.getElementById("btnItalic").addEventListener("click", () => document.execCommand("italic"));
    document.getElementById("btnUnderline").addEventListener("click", () => document.execCommand("underline"));
    document.getElementById("btnStrike").addEventListener("click", () => document.execCommand("strikeThrough"));
    document.getElementById("btnAlignLeft").addEventListener("click", () => document.execCommand("justifyLeft"));
    document.getElementById("btnAlignCenter").addEventListener("click", () => document.execCommand("justifyCenter"));
    document.getElementById("btnAlignRight").addEventListener("click", () => document.execCommand("justifyRight"));

    document.getElementById("fontFamilySelect").addEventListener("change", (e) => {
      document.execCommand("fontName", false, e.target.value);
    });
    document.getElementById("fontSizeSelect").addEventListener("change", (e) => {
      document.execCommand("fontSize", false, e.target.value);
    });

    // Content typing saving
    document.getElementById("editorArea").addEventListener("input", () => {
      saveDoc();
      if (isTrackChanges) {
        logReview("Edited text canvas body");
      }
    });

    document.getElementById("docTitleInput").addEventListener("input", saveDoc);

    // Watermark Toggle
    const chkWatermark = document.getElementById("chkWatermark");
    const watermarkText = document.getElementById("watermarkText");
    const overlay = document.getElementById("watermarkOverlay");

    function updateWatermark() {
      if (chkWatermark.checked && watermarkText.value) {
        overlay.style.display = "flex";
        overlay.textContent = watermarkText.value;
      } else {
        overlay.style.display = "none";
      }
    }
    chkWatermark.addEventListener("change", updateWatermark);
    watermarkText.addEventListener("input", updateWatermark);

    // Comments & Review Tabs
    const tabComments = document.getElementById("tabComments");
    const tabReview = document.getElementById("tabReview");

    tabComments.addEventListener("click", () => {
      activeTab = "comments";
      tabComments.classList.add("active");
      tabReview.classList.remove("active");
      renderSidebar();
    });

    tabReview.addEventListener("click", () => {
      activeTab = "review";
      tabReview.classList.add("active");
      tabComments.classList.remove("active");
      renderSidebar();
    });

    document.getElementById("btnTrackChanges").addEventListener("click", (e) => {
      isTrackChanges = !isTrackChanges;
      e.target.textContent = `Toggle Review Mode (${isTrackChanges ? 'ON' : 'OFF'})`;
      e.target.classList.toggle("active", isTrackChanges);
    });

    document.getElementById("btnAddComment").addEventListener("click", () => {
      const comment = prompt("Add comment/notes for selected section:");
      if (!comment) return;
      const user = "John Smith";
      const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      docComments.push({ user, time, text: comment });
      saveDoc();
      renderSidebar();
    });

    function logReview(msg, type = "addition") {
      const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      reviewLogs.push({ time, text: msg, type });
      saveDoc();
      if (activeTab === "review") renderSidebar();
    }

    function renderSidebar() {
      const content = document.getElementById("sidebarContent");
      content.innerHTML = "";
      
      if (activeTab === "comments") {
        docComments.forEach(c => {
          const div = document.createElement("div");
          div.className = "comment-card";
          div.innerHTML = `
            <div class="comment-meta">
              <span><strong>${c.user}</strong></span>
              <span>${c.time}</span>
            </div>
            <div style="color: #374151; margin-top:4px;">${c.text}</div>
          `;
          content.appendChild(div);
        });
      } else {
        reviewLogs.forEach(r => {
          const div = document.createElement("div");
          div.className = `track-changes-item ${r.type}`;
          div.innerHTML = `<strong>${r.time}</strong>: ${r.text}`;
          content.appendChild(div);
        });
      }
    }

    loadDoc();
  </script>
</body>
</html>
