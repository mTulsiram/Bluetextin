<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="/assets/css/main.css">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BlueWriter - Word Online Editor | Bluetext.in</title>
  
  
</head>
<body>

  <!-- Word Online Header -->
  <header class="word-header">
    <div class="word-header-left">
      <span class="word-app-icon">W📘</span>
      <div class="word-doc-title-box">
        <input type="text" class="word-title-input" id="docTitleInput" value="growth_business_proposal.docx" />
        <span class="save-badge" id="saveIndicator">● Saved to Local Library</span>
      </div>
    </div>
    <div>
      <a href="office-suite.html">Dashboard</a>
    </div>
  </header>

  <!-- Word Office Ribbon -->
  <div class="word-ribbon">
    <div class="ribbon-tabs">
      <button class="ribbon-tab active">Home</button>
      <button class="ribbon-tab" id="btnSaveCopy">💾 Save Copy</button>
      <button class="ribbon-tab" id="btnExportTXT">📥 Export TXT</button>
      <button class="ribbon-tab" id="btnExportHTML">📥 Export HTML</button>
      <button class="ribbon-tab" id="btnExportJSON">📥 Export JSON</button>
    </div>

    <div class="ribbon-toolbar">
      <!-- Font Family & Size -->
      <div class="ribbon-group">
        <select class="ribbon-select" id="fontFamilySelect">
          <option value="Arial">Arial</option>
          <option value="Calibri" selected>Calibri</option>
          <option value="Georgia">Georgia</option>
          <option value="Times New Roman">Times New Roman</option>
        </select>
        <select class="ribbon-select" id="fontSizeSelect">
          <option value="12px">9</option>
          <option value="14px">10</option>
          <option value="16px" selected>11</option>
          <option value="18px">12</option>
          <option value="24px">16</option>
        </select>
      </div>

      <!-- Bold, Italic, Underline, Strike -->
      <div class="ribbon-group">
        <button class="ribbon-btn" id="btnBold" title="Bold"><b>B</b></button>
        <button class="ribbon-btn" id="btnItalic" title="Italic"><i>I</i></button>
        <button class="ribbon-btn" id="btnUnderline" title="Underline"><u>U</u></button>
        <button class="ribbon-btn" id="btnStrike" title="Strikethrough">ab</button>
      </div>

      <!-- Alignment Groups -->
      <div class="ribbon-group">
        <button class="ribbon-btn" id="btnAlignLeft">Align Left</button>
        <button class="ribbon-btn" id="btnAlignCenter">Center</button>
        <button class="ribbon-btn" id="btnAlignRight">Align Right</button>
      </div>

      <!-- Watermark overlay and comments controls -->
      <div class="ribbon-group">
        <button class="ribbon-btn" id="btnAddComment">💬 New Comment</button>
        <button class="ribbon-btn" id="btnTrackChanges">Toggle Review Mode (OFF)</button>
        <label>
          <input type="checkbox" id="chkWatermark" /> Watermark:
          <input type="text" id="watermarkText" value="CONFIDENTIAL" />
        </label>
      </div>
    </div>
  </div>

  <!-- Main Workpane -->
  <div class="word-workspace">
    <!-- Center canvas sheet -->
    <div class="word-center-pane">
      <div class="watermark-overlay" id="watermarkOverlay">CONFIDENTIAL</div>
      <div class="word-page-sheet" id="editorArea" contenteditable="true">
        <!-- Loaded dynamically -->
      </div>
    </div>

    <!-- Right Sidebar comments & Review logs -->
    <aside class="word-right-sidebar">
      <div class="sidebar-tabs">
        <button class="sidebar-tab active" id="tabComments">Comments</button>
        <button class="sidebar-tab" id="tabReview">Review & History</button>
      </div>
      
      <div class="sidebar-content" id="sidebarContent">
        <!-- Loaded dynamically -->
      </div>
    </aside>
  </div>

  <script>
    const DB_KEY = "bt_office_docs_v1";
    let documentCatalog = [];
    let activeDoc = null;
    let docComments = [];
    let reviewLogs = []; // Stores version snapshots: { time, text, contentSnapshot }
    let activeTab = "comments";
    let isTrackChanges = false;

    // Get file ID from query string
    const urlParams = new URLSearchParams(window.location.search);
    const docId = urlParams.get("id");

    function loadDoc() {
      const stored = localStorage.getItem(DB_KEY);
      if (stored) {
        documentCatalog = JSON.parse(stored);
      }
      
      activeDoc = documentCatalog.find(d => d.id === docId);
      if (!activeDoc) {
        alert("Document not found.");
        window.location.href = "office-suite.html";
        return;
      }

      // Title & Content
      document.getElementById("docTitleInput").value = activeDoc.name;
      
      const defaultContent = `
        <p><strong>GROWTH BUSINESS PROPOSAL</strong></p>
        <hr />
        <p><strong>This proposal outlines a streamlined solution designed to address key business challenges and drive growth.</strong> Our approach leverages industry expertise, innovative strategies, and data-driven insights to create a tailored plan that delivers measurable results.</p>
        
        <p><strong>PROBLEM STATEMENT</strong></p>
        <p>Businesses today face challenges such as inefficiencies, rising costs, and evolving market demands. Addressing these issues requires a well-structured approach.</p>
        
        <p><strong>SOLUTION SUMMARY</strong></p>
        <p>Our solution is designed to improve overall performance. Using best practices, we help businesses optimize workflows and drive innovation.</p>
      `;

      document.getElementById("editorArea").innerHTML = activeDoc.content || defaultContent;
      
      docComments = activeDoc.comments || [];
      reviewLogs = activeDoc.reviewLogs || [
        { time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }), text: "Initial document version", contentSnapshot: activeDoc.content || defaultContent }
      ];

      renderSidebar();
    }

    function saveDoc() {
      if (!activeDoc) return;
      activeDoc.name = document.getElementById("docTitleInput").value;
      activeDoc.content = document.getElementById("editorArea").innerHTML;
      activeDoc.comments = docComments;
      activeDoc.reviewLogs = reviewLogs;

      const idx = documentCatalog.findIndex(d => d.id === activeDoc.id);
      if (idx !== -1) {
        documentCatalog[idx] = activeDoc;
      }
      localStorage.setItem(DB_KEY, JSON.stringify(documentCatalog));
    }

    // Formatting Actions
    document.getElementById("btnBold").addEventListener("click", () => document.execCommand("bold"));
    document.getElementById("btnItalic").addEventListener("click", () => document.execCommand("italic"));
    document.getElementById("btnUnderline").addEventListener("click", () => document.execCommand("underline"));
    document.getElementById("btnStrike").addEventListener("click", () => document.execCommand("strikeThrough"));
    document.getElementById("btnAlignLeft").addEventListener("click", () => document.execCommand("justifyLeft"));
    document.getElementById("btnAlignCenter").addEventListener("click", () => document.execCommand("justifyCenter"));
    document.getElementById("btnAlignRight").addEventListener("click", () => document.execCommand("justifyRight"));

    document.getElementById("fontFamilySelect").addEventListener("change", (e) => {
      document.execCommand("fontName", false, e.target.value);
    });
    document.getElementById("fontSizeSelect").addEventListener("change", (e) => {
      document.execCommand("fontSize", false, e.target.value);
    });

    // Save Copy
    document.getElementById("btnSaveCopy").addEventListener("click", () => {
      const timestamp = new Date().toISOString().replace(/T/, ' ').replace(/\..+/, '');
      const originalName = document.getElementById("docTitleInput").value;
      const copyName = prompt("Save as copy (leaves original intact):", `${originalName.replace(/\.[^/.]+$/, "")} (Backup ${timestamp}).docx`);
      if (!copyName) return;

      const newId = "doc_" + Math.random().toString(36).substr(2, 9);
      const newDoc = {
        id: newId,
        name: copyName,
        type: "WORD",
        size: activeDoc.size,
        content: document.getElementById("editorArea").innerHTML,
        comments: JSON.parse(JSON.stringify(docComments)),
        reviewLogs: JSON.parse(JSON.stringify(reviewLogs))
      };
      
      documentCatalog.push(newDoc);
      localStorage.setItem(DB_KEY, JSON.stringify(documentCatalog));
      alert(`New copy saved successfully: ${copyName}`);
      window.location.href = `doc.html?id=${newId}`;
    });

    // Exports
    document.getElementById("btnExportTXT").addEventListener("click", () => {
      const text = document.getElementById("editorArea").innerText;
      const blob = new Blob([text], { type: 'text/plain;charset=utf-8;' });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.setAttribute("download", document.getElementById("docTitleInput").value.replace(/\.[^/.]+$/, "") + ".txt");
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    });

    document.getElementById("btnExportHTML").addEventListener("click", () => {
      const html = document.getElementById("editorArea").innerHTML;
      const blob = new Blob([html], { type: 'text/html;charset=utf-8;' });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.setAttribute("download", document.getElementById("docTitleInput").value.replace(/\.[^/.]+$/, "") + ".html");
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    });

    document.getElementById("btnExportJSON").addEventListener("click", () => {
      const jsonContent = JSON.stringify({ content: document.getElementById("editorArea").innerHTML }, null, 2);
      const blob = new Blob([jsonContent], { type: 'application/json;charset=utf-8;' });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.setAttribute("download", document.getElementById("docTitleInput").value.replace(/\.[^/.]+$/, "") + ".json");
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    });

    // Content typing saving
    document.getElementById("editorArea").addEventListener("input", () => {
      saveDoc();
      if (isTrackChanges) {
        logReview("Edited text canvas body");
      }
    });

    document.getElementById("docTitleInput").addEventListener("input", saveDoc);

    // Watermark Toggle
    const chkWatermark = document.getElementById("chkWatermark");
    const watermarkText = document.getElementById("watermarkText");
    const overlay = document.getElementById("watermarkOverlay");

    function updateWatermark() {
      if (chkWatermark.checked && watermarkText.value) {
        overlay.style.display = "flex";
        overlay.textContent = watermarkText.value;
      } else {
        overlay.style.display = "none";
      }
    }
    chkWatermark.addEventListener("change", updateWatermark);
    watermarkText.addEventListener("input", updateWatermark);

    // Comments & Review Tabs
    const tabComments = document.getElementById("tabComments");
    const tabReview = document.getElementById("tabReview");

    tabComments.addEventListener("click", () => {
      activeTab = "comments";
      tabComments.classList.add("active");
      tabReview.classList.remove("active");
      renderSidebar();
    });

    tabReview.addEventListener("click", () => {
      activeTab = "review";
      tabReview.classList.add("active");
      tabComments.classList.remove("active");
      renderSidebar();
    });

    document.getElementById("btnTrackChanges").addEventListener("click", (e) => {
      isTrackChanges = !isTrackChanges;
      e.target.textContent = `Toggle Review Mode (${isTrackChanges ? 'ON' : 'OFF'})`;
      e.target.classList.toggle("active", isTrackChanges);
    });

    document.getElementById("btnAddComment").addEventListener("click", () => {
      const comment = prompt("Add comment/notes for selected section:");
      if (!comment) return;

      const defaultUser = localStorage.getItem("bt_office_user") || "User";
      const author = prompt("Enter your name:", defaultUser);
      if (!author) return;
      localStorage.setItem("bt_office_user", author);

      const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      docComments.push({ user: author, time, text: comment });
      saveDoc();
      renderSidebar();
    });

    function logReview(msg) {
      const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      reviewLogs.push({
        time,
        text: msg,
        contentSnapshot: document.getElementById("editorArea").innerHTML
      });
      saveDoc();
      if (activeTab === "review") renderSidebar();
    }

    window.restoreVersionSnapshot = function(idx) {
      if (confirm("Are you sure you want to revert document text to this version?")) {
        const snapshot = reviewLogs[idx].contentSnapshot;
        if (snapshot !== undefined) {
          document.getElementById("editorArea").innerHTML = snapshot;
          saveDoc();
          alert("Version restored successfully!");
        }
      }
    };

    function renderSidebar() {
      const content = document.getElementById("sidebarContent");
      content.innerHTML = "";
      
      if (activeTab === "comments") {
        docComments.forEach(c => {
          const div = document.createElement("div");
          div.className = "comment-card";
          div.innerHTML = `
            <div class="comment-meta">
              <span><strong>${c.user}</strong></span>
              <span>${c.time}</span>
            </div>
            <div>${c.text}</div>
          `;
          content.appendChild(div);
        });
      } else {
        reviewLogs.forEach((r, idx) => {
          const div = document.createElement("div");
          div.className = `track-changes-item`;
          div.style.cursor = "pointer";
          div.title = "Click to restore this version snapshot";
          div.setAttribute("onclick", `restoreVersionSnapshot(${idx})`);
          div.innerHTML = `<strong>${r.time}</strong>: ${r.text} <span>(Restore)</span>`;
          content.appendChild(div);
        });
      }
    }

    loadDoc();
  </script>
</body>
</html>
