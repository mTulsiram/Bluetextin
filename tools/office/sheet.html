<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BlueSheet - Excel Online Editor | Bluetext.in</title>
  <link rel="stylesheet" href="/assets/css/main.css">
  <style>
    body {
      background: #f3f4f6;
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
    }
    
    /* Excel Green Header */
    .sheet-header {
      background: #107c41;
      color: #ffffff;
      height: 48px;
      display: flex;
      align-items: center;
      padding: 0 16px;
      justify-content: space-between;
      font-size: 0.9rem;
    }

    .sheet-header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .sheet-app-icon {
      font-size: 1.25rem;
      font-weight: 800;
    }

    .sheet-doc-title-box {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sheet-title-input {
      background: none;
      border: 1px solid transparent;
      color: #fff;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 2px 6px;
      border-radius: 3px;
      width: 200px;
    }
    .sheet-title-input:focus {
      background: rgba(255,255,255,0.15);
      border-color: #fff;
      outline: none;
    }

    .save-badge {
      font-size: 0.75rem;
      color: #bbf7d0;
    }

    /* Office Ribbon */
    .sheet-ribbon {
      background: #ffffff;
      border-bottom: 1px solid #d1d5db;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    .ribbon-tabs {
      display: flex;
      background: #f3f4f6;
      border-bottom: 1px solid #e5e7eb;
      padding-left: 20px;
    }

    .ribbon-tab {
      background: none;
      border: none;
      padding: 8px 16px;
      font-size: 0.8rem;
      color: #374151;
      cursor: pointer;
      font-weight: 500;
    }
    .ribbon-tab.active {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-bottom-color: transparent;
      color: #107c41;
      font-weight: 600;
    }

    .ribbon-toolbar-container {
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
    }

    .ribbon-toolbar {
      display: none;
      align-items: center;
      gap: 16px;
      padding: 8px 20px;
      background: #ffffff;
      flex-wrap: wrap;
    }
    .ribbon-toolbar.active {
      display: flex;
    }

    .ribbon-group {
      display: flex;
      align-items: center;
      gap: 6px;
      border-right: 1px solid #e5e7eb;
      padding-right: 12px;
    }

    .ribbon-group:last-child {
      border: none;
    }

    .ribbon-btn {
      background: none;
      border: 1px solid transparent;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
      color: #374151;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .ribbon-btn:hover {
      background: #f3f4f6;
    }
    .ribbon-btn.active {
      background: #dcfce7;
      border-color: #86efac;
      color: #107c41;
    }

    .ribbon-select {
      border: 1px solid #cbd5e1;
      background: #ffffff;
      padding: 4px;
      border-radius: 4px;
      font-size: 0.8rem;
      outline: none;
    }

    /* Formula Bar */
    .formula-bar-container {
      display: flex;
      align-items: center;
      background: #ffffff;
      border-bottom: 1px solid #d1d5db;
      padding: 4px 12px;
      gap: 8px;
      font-size: 0.85rem;
    }

    .formula-cell-indicator {
      font-weight: 600;
      color: #107c41;
      background: #f3f4f6;
      padding: 2px 8px;
      border: 1px solid #d1d5db;
      border-radius: 3px;
      min-width: 45px;
      text-align: center;
    }

    .formula-input {
      flex-grow: 1;
      border: 1px solid #d1d5db;
      padding: 4px 8px;
      border-radius: 3px;
      font-family: monospace;
      outline: none;
    }
    .formula-input:focus {
      border-color: #107c41;
    }

    /* Workspace Body */
    .sheet-workspace {
      display: flex;
      height: calc(100vh - 165px);
      overflow: hidden;
    }

    .sheet-center-pane {
      flex-grow: 1;
      background: #f3f4f6;
      overflow: auto;
      position: relative;
    }

    /* Spreadsheet Grid Table */
    .sheet-grid {
      border-collapse: collapse;
      background: #ffffff;
      font-size: 0.85rem;
      user-select: none;
      table-layout: fixed;
      width: 100%;
    }

    .sheet-grid th, .sheet-grid td {
      border: 1px solid #d1d5db;
      padding: 4px 6px;
      box-sizing: border-box;
      height: 25px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Row/Col Headers */
    .sheet-grid th {
      background: #f3f4f6;
      color: #4b5563;
      font-weight: 500;
      text-align: center;
      position: sticky;
      z-index: 10;
    }
    .sheet-grid tr th:first-child {
      left: 0;
      z-index: 15;
      width: 50px;
    }
    .sheet-grid thead th {
      top: 0;
    }

    /* Table cells */
    .sheet-grid td {
      background: #ffffff;
      outline: none;
      cursor: cell;
    }

    .sheet-grid td.selected {
      outline: 2px solid #107c41;
      z-index: 5;
      position: relative;
    }

    .sheet-grid tr.zebra td {
      background: #f9fafb;
    }

    .watermark-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 4.5rem;
      color: rgba(0,0,0,0.02);
      transform: rotate(-30deg);
      pointer-events: none;
      font-weight: 900;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      z-index: 5;
      user-select: none;
    }

    /* Right Sidebar comments & review */
    .sheet-right-sidebar {
      width: 280px;
      background: #ffffff;
      border-left: 1px solid #e5e7eb;
      display: flex;
      flex-direction: column;
      height: 100%;
      flex-shrink: 0;
    }

    .sidebar-tabs {
      display: flex;
      border-bottom: 1px solid #e5e7eb;
    }

    .sidebar-tab {
      flex: 1;
      background: #f9fafb;
      border: none;
      padding: 10px;
      font-size: 0.8rem;
      cursor: pointer;
      color: #4b5563;
    }
    .sidebar-tab.active {
      background: #ffffff;
      font-weight: 600;
      border-bottom: 2px solid #107c41;
      color: #107c41;
    }

    .sidebar-content {
      padding: 16px;
      overflow-y: auto;
      flex-grow: 1;
      font-size: 0.8rem;
    }

    .comment-card {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 8px;
    }

    .comment-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.72rem;
      color: #6b7280;
      margin-bottom: 4px;
    }

    .track-changes-item {
      padding: 6px 8px;
      border-left: 3px solid #10b981;
      background: rgba(16, 185, 129, 0.05);
      margin-bottom: 8px;
      border-radius: 0 4px 4px 0;
      font-size: 0.75rem;
    }
  </style>
</head>

  <script>
    const DB_KEY = "bt_office_docs_v1";
    let documentCatalog = [];
    let activeDoc = null;
    let docComments = [];
    let reviewLogs = []; // Stores version snapshots
    let activeTab = "comments";
    let isTrackChanges = false;
    
    // Grid settings and Pagination State
    let cellData = {}; 
    let cellStyles = {}; // {"A1": {fontWeight: "bold", background: "#fff"}}
    let selectedCell = "A1";
    let currentPage = 1;
    let rowsPerPage = 100;
    let maxRows = 100;
    let maxColumnsCount = 26;

    const urlParams = new URLSearchParams(window.location.search);
    const docId = urlParams.get("id");

    // Convert Column Label to Index
    function getColumnIndex(label) {
      let index = 0;
      for (let i = 0; i < label.length; i++) {
        index = index * 26 + (label.charCodeAt(i) - 64);
      }
      return index - 1;
    }

    // Convert Index to Column Label
    function getColumnLabel(index) {
      let label = "";
      let temp = index;
      while (temp >= 0) {
        label = String.fromCharCode((temp % 26) + 65) + label;
        temp = Math.floor(temp / 26) - 1;
      }
      return label;
    }

    function updateMaxDimensions() {
      let maxR = 100; 
      let maxCIdx = 25; 
      Object.keys(cellData).forEach(key => {
        const match = key.match(/^([A-Z]+)(\d+)$/);
        if (match) {
          const colLabel = match[1];
          const r = parseInt(match[2]);
          if (r > maxR) maxR = r;
          const cIdx = getColumnIndex(colLabel);
          if (cIdx > maxCIdx) maxCIdx = cIdx;
        }
      });
      maxRows = maxR;
      maxColumnsCount = maxCIdx + 1;
    }

    // Ribbon Tabs switching
    document.querySelectorAll(".ribbon-tab").forEach(tab => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".ribbon-tab").forEach(t => t.classList.remove("active"));
        document.querySelectorAll(".ribbon-toolbar").forEach(b => b.classList.remove("active"));
        
        tab.classList.add("active");
        const toolbarId = tab.getAttribute("data-tab");
        document.getElementById(toolbarId).classList.add("active");
      });
    });

    // Theme selector
    document.getElementById("themeSelect").addEventListener("change", (e) => {
      const theme = e.target.value;
      const header = document.getElementById("sheetHeader");
      const activeTabLabel = document.querySelector(".ribbon-tab.active");
      
      let headerColor = "#107c41"; // default green
      if (theme === "blue") headerColor = "#005a9e";
      if (theme === "dark") headerColor = "#201f1e";
      if (theme === "purple") headerColor = "#5c2d91";

      header.style.background = headerColor;
      if (activeDoc) {
        activeDoc.theme = theme;
        saveDoc();
      }
    });

    function buildGrid() {
      updateMaxDimensions();
      const headerRow = document.getElementById("gridHeaderRow");
      headerRow.innerHTML = '<th style="width: 50px;"></th>';
      
      const colLimit = Math.max(26, maxColumnsCount);
      const colsToRender = [];
      for (let i = 0; i < colLimit; i++) {
        colsToRender.push(getColumnLabel(i));
      }
      
      colsToRender.forEach(col => {
        const th = document.createElement("th");
        th.textContent = col;
        headerRow.appendChild(th);
      });

      const body = document.getElementById("gridBody");
      body.innerHTML = "";
      
      const startRow = (currentPage - 1) * rowsPerPage + 1;
      const endRow = Math.min(startRow + rowsPerPage - 1, maxRows);
      
      for (let r = startRow; r <= endRow; r++) {
        const tr = document.createElement("tr");
        tr.id = `row-${r}`;
        const rowLabel = document.createElement("th");
        rowLabel.textContent = r;
        tr.appendChild(rowLabel);

        colsToRender.forEach(col => {
          const cellId = `${col}${r}`;
          const td = document.createElement("td");
          td.id = cellId;
          td.contentEditable = "true";
          td.textContent = cellData[cellId] || "";

          // Apply styles if present
          if (cellStyles[cellId]) {
            const styles = cellStyles[cellId];
            if (styles.fontWeight) td.style.fontWeight = styles.fontWeight;
            if (styles.fontStyle) td.style.fontStyle = styles.fontStyle;
            if (styles.textDecoration) td.style.textDecoration = styles.textDecoration;
            if (styles.fontFamily) td.style.fontFamily = styles.fontFamily;
            if (styles.fontSize) td.style.fontSize = styles.fontSize;
            if (styles.textAlign) td.style.textAlign = styles.textAlign;
            if (styles.background) td.style.background = styles.background;
            if (styles.color) td.style.color = styles.color;
          }
          
          td.addEventListener("focus", () => {
            selectCell(cellId);
          });
          
          td.addEventListener("input", (e) => {
            cellData[cellId] = e.target.textContent;
            document.getElementById("formulaInput").value = cellData[cellId] || "";
            saveDoc();
            if (isTrackChanges) {
              logReview(`Edited cell ${cellId} to "${cellData[cellId]}"`);
            }
          });

          tr.appendChild(td);
        });

        body.appendChild(tr);
      }
      
      const totalPages = Math.ceil(maxRows / rowsPerPage);

    // Chart Insertion module (Canvas rendering)
    function drawChart(type) {
      const colLetter = selectedCell[0];
      const dataVals = [];
      const labels = [];
      for (let r = 1; r <= 15; r++) {
        const val = parseFloat(cellData[`${colLetter}${r}`]);
        if (!isNaN(val)) {
          dataVals.push(val);
          labels.push(`${colLetter}${r}`);
        }
      }

      if (dataVals.length === 0) {
        alert("Please enter numeric data in the top 15 rows of the current column to generate a chart.");
        return;
      }

      const container = document.getElementById("floatingChartContainer");
      container.style.display = "block";
      document.getElementById("chartTitle").textContent = `Selected Column ${colLetter} Data Visualization`;

      const canvas = document.getElementById("chartCanvas");
      const ctx = canvas.getContext("2d");
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const maxVal = Math.max(...dataVals, 1);
      const chartHeight = 150;
      const chartWidth = 350;
      const margin = 40;

      if (type === "bar") {
        const barWidth = (chartWidth / dataVals.length) - 10;
        ctx.fillStyle = "#107c41";
        dataVals.forEach((val, idx) => {
          const h = (val / maxVal) * chartHeight;
          const x = margin + idx * (barWidth + 10);
          const y = canvas.height - margin - h;
          ctx.fillRect(x, y, barWidth, h);

          // Draw values
          ctx.fillStyle = "#374151";
          ctx.font = "10px sans-serif";
          ctx.fillText(val, x + 2, y - 5);
          ctx.fillText(labels[idx], x, canvas.height - margin + 15);
          ctx.fillStyle = "#107c41";
        });
      } else {
        // Pie Chart
        const total = dataVals.reduce((a, b) => a + b, 0);
        let startAngle = 0;
        const colors = ["#ef4444", "#3b82f6", "#10b981", "#f59e0b", "#8b5cf6", "#ec4899", "#14b8a6"];
        
        ctx.save();
        ctx.translate(canvas.width / 2, canvas.height / 2);
        dataVals.forEach((val, idx) => {
          const sliceAngle = (val / total) * 2 * Math.PI;
          ctx.fillStyle = colors[idx % colors.length];
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.arc(0, 0, 70, startAngle, startAngle + sliceAngle);
          ctx.closePath();
          ctx.fill();

          // Legend
          ctx.fillStyle = colors[idx % colors.length];
          ctx.restore();
          ctx.fillRect(20, 20 + idx * 15, 10, 10);
          ctx.fillStyle = "#374151";
          ctx.font = "11px sans-serif";
          ctx.fillText(`${labels[idx]}: ${val}`, 35, 30 + idx * 15);
          ctx.save();
          ctx.translate(canvas.width / 2, canvas.height / 2);

          startAngle += sliceAngle;
        });
        ctx.restore();
      }
    }

        content: JSON.parse(JSON.stringify(cellData)),
        styles: JSON.parse(JSON.stringify(cellStyles)),
        comments: JSON.parse(JSON.stringify(docComments)),
        reviewLogs: JSON.parse(JSON.stringify(reviewLogs)),
        theme: activeDoc.theme || "green"
      };
      
      documentCatalog.push(newDoc);
      localStorage.setItem(DB_KEY, JSON.stringify(documentCatalog));
      alert(`New copy saved: ${copyName}`);
      window.location.href = `sheet.html?id=${newId}`;
    });

    document.getElementById("btnExportCSV").addEventListener("click", () => {
      let csvContent = "";
      updateMaxDimensions();
      for (let r = 1; r <= maxRows; r++) {
        const rowArr = [];
        for (let c = 0; c < Math.max(26, maxColumnsCount); c++) {
          const colLabel = getColumnLabel(c);
          rowArr.push(`"${(cellData[`${colLabel}${r}`] || "").replace(/"/g, '""')}"`);
        }
        csvContent += rowArr.join(",") + "\n";
      }
      
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.setAttribute("download", document.getElementById("docTitleInput").value.replace(/\.[^/.]+$/, "") + ".csv");
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    });

    document.getElementById("btnExportJSON").addEventListener("click", () => {
      const jsonContent = JSON.stringify({ cellData, cellStyles }, null, 2);
      const blob = new Blob([jsonContent], { type: 'application/json;charset=utf-8;' });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.setAttribute("download", document.getElementById("docTitleInput").value.replace(/\.[^/.]+$/, "") + ".json");
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    });

    document.getElementById("btnClearSheet").addEventListener("click", () => {
      if (confirm("Clear entire grid?")) {
        cellData = {};
        cellStyles = {};
        buildGrid();
        saveDoc();
        logReview("Cleared entire sheet", "deletion");
      }
    });

    // Watermark Module
    const chkWatermark = document.getElementById("chkWatermark");
    const watermarkText = document.getElementById("watermarkText");
    const overlay = document.getElementById("watermarkOverlay");

    function updateWatermark() {
      if (chkWatermark.checked && watermarkText.value) {
        overlay.style.display = "flex";
        overlay.textContent = watermarkText.value;
      } else {
        overlay.style.display = "none";
      }
    }
    chkWatermark.addEventListener("change", updateWatermark);
    watermarkText.addEventListener("input", updateWatermark);

    // Sidebar Comments
    const tabComments = document.getElementById("tabComments");
    const tabReview = document.getElementById("tabReview");

    tabComments.addEventListener("click", () => {
      activeTab = "comments";
      tabComments.classList.add("active");
      tabReview.classList.remove("active");
      renderSidebar();
    });

    tabReview.addEventListener("click", () => {
      activeTab = "review";
      tabReview.classList.add("active");
      tabComments.classList.remove("active");
      renderSidebar();
    });

    document.getElementById("btnTrackChanges").addEventListener("click", (e) => {
      isTrackChanges = !isTrackChanges;
      e.target.textContent = `Review Mode (${isTrackChanges ? 'ON' : 'OFF'})`;
      e.target.classList.toggle("active", isTrackChanges);
    });

    document.getElementById("btnAddComment").addEventListener("click", () => {
      const comment = prompt("Add comment for cell " + selectedCell + ":");
      if (!comment) return;
      
      const defaultUser = localStorage.getItem("bt_office_user") || "User";
      const author = prompt("Enter name:", defaultUser);
      if (!author) return;
      localStorage.setItem("bt_office_user", author);

      const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      docComments.push({ user: author, time, text: `[Cell ${selectedCell}] ${comment}` });
      saveDoc();
      renderSidebar();
    });

    function logReview(msg) {
      const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      reviewLogs.push({
        time,
        text: msg,
        cellDataSnapshot: JSON.parse(JSON.stringify(cellData))
      });
      saveDoc();
      if (activeTab === "review") renderSidebar();
    }

    window.restoreVersionSnapshot = function(idx) {
      if (confirm("Revert grid to this version?")) {
        const snapshot = reviewLogs[idx].cellDataSnapshot;
        if (snapshot) {
          cellData = JSON.parse(JSON.stringify(snapshot));
          buildGrid();
          saveDoc();
          alert("Version restored!");
        }
      }
    };

    function renderSidebar() {
      const content = document.getElementById("sidebarContent");
      content.innerHTML = "";
      
      if (activeTab === "comments") {
        docComments.forEach(c => {
          const div = document.createElement("div");
          div.className = "comment-card";
          div.innerHTML = `
            <div class="comment-meta">
              <span><strong>${c.user}</strong></span>
              <span>${c.time}</span>
            </div>
            <div style="color:#374151; margin-top:4px;">${c.text}</div>
          `;
          content.appendChild(div);
        });
      } else {
        reviewLogs.forEach((r, idx) => {
          const div = document.createElement("div");
          div.className = `track-changes-item`;
          div.style.cursor = "pointer";
          div.title = "Click to restore this snapshot";
          div.setAttribute("onclick", `restoreVersionSnapshot(${idx})`);
          div.innerHTML = `<strong>${r.time}</strong>: ${r.text} <span style="font-size:0.7rem; color:#107c41; float:right;">(Restore)</span>`;
          content.appendChild(div);
        });
      }
    }

    // Draggable canvas container script
    const dragContainer = document.getElementById("floatingChartContainer");
    let isDragging = false, currentX, currentY, initialX, initialY, xOffset = 0, yOffset = 0;
    
    dragContainer.addEventListener("mousedown", dragStart);
    document.addEventListener("mouseup", dragEnd);
    document.addEventListener("mousemove", drag);

    function dragStart(e) {
      if (e.target.tagName.toLowerCase() === 'canvas') return;
      initialX = e.clientX - xOffset;
      initialY = e.clientY - yOffset;
      isDragging = true;
    }

    function dragEnd() {
      initialX = currentX;
      initialY = currentY;
      isDragging = false;
    }

    function drag(e) {
      if (isDragging) {
        e.preventDefault();
        currentX = e.clientX - initialX;
        currentY = e.clientY - initialY;
        xOffset = currentX;
        yOffset = currentY;
        dragContainer.style.transform = `translate3d(${currentX}px, ${currentY}px, 0)`;
      }
    }

    loadDoc();
  </script>
