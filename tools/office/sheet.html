<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BlueSheet - Excel Online Editor | Bluetext.in</title>
  <link rel="stylesheet" href="/assets/css/main.css">
  <style>
    body {
      background: #f3f4f6;
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
    }
    
    /* Excel Green Header */
    .sheet-header {
      background: #107c41;
      color: #ffffff;
      height: 48px;
      display: flex;
      align-items: center;
      padding: 0 16px;
      justify-content: space-between;
      font-size: 0.9rem;
    }

    .sheet-header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .sheet-app-icon {
      font-size: 1.25rem;
      font-weight: 800;
    }

    .sheet-doc-title-box {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sheet-title-input {
      background: none;
      border: 1px solid transparent;
      color: #fff;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 2px 6px;
      border-radius: 3px;
      width: 200px;
    }
    .sheet-title-input:focus {
      background: rgba(255,255,255,0.15);
      border-color: #fff;
      outline: none;
    }

    .save-badge {
      font-size: 0.75rem;
      color: #bbf7d0;
    }

    /* Office Ribbon */
    .sheet-ribbon {
      background: #ffffff;
      border-bottom: 1px solid #d1d5db;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    .ribbon-tabs {
      display: flex;
      background: #f3f4f6;
      border-bottom: 1px solid #e5e7eb;
      padding-left: 20px;
    }

    .ribbon-tab {
      background: none;
      border: none;
      padding: 8px 16px;
      font-size: 0.8rem;
      color: #374151;
      cursor: pointer;
      font-weight: 500;
    }
    .ribbon-tab.active {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-bottom-color: transparent;
      color: #107c41;
      font-weight: 600;
    }

    .ribbon-toolbar-container {
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
    }

    .ribbon-toolbar {
      display: none;
      align-items: center;
      gap: 16px;
      padding: 8px 20px;
      background: #ffffff;
      flex-wrap: wrap;
    }
    .ribbon-toolbar.active {
      display: flex;
    }

    .ribbon-group {
      display: flex;
      align-items: center;
      gap: 6px;
      border-right: 1px solid #e5e7eb;
      padding-right: 12px;
    }

    .ribbon-group:last-child {
      border: none;
    }

    .ribbon-btn {
      background: none;
      border: 1px solid transparent;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
      color: #374151;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .ribbon-btn:hover {
      background: #f3f4f6;
    }
    .ribbon-btn.active {
      background: #dcfce7;
      border-color: #86efac;
      color: #107c41;
    }

    .ribbon-select {
      border: 1px solid #cbd5e1;
      background: #ffffff;
      padding: 4px;
      border-radius: 4px;
      font-size: 0.8rem;
      outline: none;
    }

    /* Formula Bar */
    .formula-bar-container {
      display: flex;
      align-items: center;
      background: #ffffff;
      border-bottom: 1px solid #d1d5db;
      padding: 4px 12px;
      gap: 8px;
      font-size: 0.85rem;
    }

    .formula-cell-indicator {
      font-weight: 600;
      color: #107c41;
      background: #f3f4f6;
      padding: 2px 8px;
      border: 1px solid #d1d5db;
      border-radius: 3px;
      min-width: 45px;
      text-align: center;
    }

    .formula-input {
      flex-grow: 1;
      border: 1px solid #d1d5db;
      padding: 4px 8px;
      border-radius: 3px;
      font-family: monospace;
      outline: none;
    }
    .formula-input:focus {
      border-color: #107c41;
    }

    /* Workspace Body */
    .sheet-workspace {
      display: flex;
      height: calc(100vh - 165px);
      overflow: hidden;
    }

    .sheet-center-pane {
      flex-grow: 1;
      background: #f3f4f6;
      overflow: auto;
      position: relative;
    }

    /* Spreadsheet Grid Table */
    .sheet-grid {
      border-collapse: collapse;
      background: #ffffff;
      font-size: 0.85rem;
      user-select: none;
      table-layout: fixed;
      width: 100%;
    }

    .sheet-grid th, .sheet-grid td {
      border: 1px solid #d1d5db;
      padding: 4px 6px;
      box-sizing: border-box;
      height: 25px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Row/Col Headers */
    .sheet-grid th {
      background: #f3f4f6;
      color: #4b5563;
      font-weight: 500;
      text-align: center;
      position: sticky;
      z-index: 10;
    }
    .sheet-grid tr th:first-child {
      left: 0;
      z-index: 15;
      width: 50px;
    }
    .sheet-grid thead th {
      top: 0;
    }

    /* Table cells */
    .sheet-grid td {
      background: #ffffff;
      outline: none;
      cursor: cell;
    }

    .sheet-grid td.selected {
      outline: 2px solid #107c41;
      z-index: 5;
      position: relative;
    }

    .sheet-grid tr.zebra td {
      background: #f9fafb;
    }

    .watermark-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 4.5rem;
      color: rgba(0,0,0,0.02);
      transform: rotate(-30deg);
      pointer-events: none;
      font-weight: 900;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      z-index: 5;
      user-select: none;
    }

    /* Right Sidebar comments & review */
    .sheet-right-sidebar {
      width: 280px;
      background: #ffffff;
      border-left: 1px solid #e5e7eb;
      display: flex;
      flex-direction: column;
      height: 100%;
      flex-shrink: 0;
    }

    .sidebar-tabs {
      display: flex;
      border-bottom: 1px solid #e5e7eb;
    }

    .sidebar-tab {
      flex: 1;
      background: #f9fafb;
      border: none;
      padding: 10px;
      font-size: 0.8rem;
      cursor: pointer;
      color: #4b5563;
    }
    .sidebar-tab.active {
      background: #ffffff;
      font-weight: 600;
      border-bottom: 2px solid #107c41;
      color: #107c41;
    }

    .sidebar-content {
      padding: 16px;
      overflow-y: auto;
      flex-grow: 1;
      font-size: 0.8rem;
    }

    .comment-card {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 8px;
    }

    .comment-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.72rem;
      color: #6b7280;
      margin-bottom: 4px;
    }

    .track-changes-item {
      padding: 6px 8px;
      border-left: 3px solid #10b981;
      background: rgba(16, 185, 129, 0.05);
      margin-bottom: 8px;
      border-radius: 0 4px 4px 0;
      font-size: 0.75rem;
    }
  </style>
</head>
<body>

  <!-- Excel Online Header -->
  <header class="sheet-header">
    <div class="sheet-header-left">
      <span class="sheet-app-icon">X📗</span>
      <div class="sheet-doc-title-box">
        <input type="text" class="sheet-title-input" id="docTitleInput" value="annual_budget.xlsx" />
        <span class="save-badge" id="saveIndicator">● Saved to Local Library</span>
      </div>
    </div>
    <div>
      <a href="office-suite.html" style="color:#fff; text-decoration:none; font-weight:600; background:rgba(255,255,255,0.15); padding:6px 12px; border-radius:4px;">Dashboard</a>
    </div>
  </header>

  <!-- Ribbon -->
  <div class="sheet-ribbon">
    <div class="ribbon-tabs">
      <button class="ribbon-tab active" data-tab="ribbon-file">File</button>
      <button class="ribbon-tab" data-tab="ribbon-home">Home</button>
      <button class="ribbon-tab" data-tab="ribbon-insert">Insert</button>
      <button class="ribbon-tab" data-tab="ribbon-layout">Page Layout</button>
      <button class="ribbon-tab" data-tab="ribbon-formulas">Formulas</button>
    </div>

    <div class="ribbon-toolbar-container">
      <!-- FILE TOOLBAR -->
      <div class="ribbon-toolbar active" id="ribbon-file">
        <div class="ribbon-group">
          <button class="ribbon-btn" id="btnSaveCopy" style="color:#107c41;">💾 Save Copy</button>
          <button class="ribbon-btn" id="btnExportCSV">Export CSV</button>
          <button class="ribbon-btn" id="btnExportJSON">Export JSON</button>
          <button class="ribbon-btn" id="btnClearSheet" style="color:#dc2626;">🗑️ Clear Grid</button>
        </div>
      </div>

      <!-- HOME TOOLBAR -->
      <div class="ribbon-toolbar" id="ribbon-home">
        <div class="ribbon-group">
          <button class="ribbon-btn" id="btnBold" title="Bold"><b>B</b></button>
          <button class="ribbon-btn" id="btnItalic" title="Italic"><i>I</i></button>
          <button class="ribbon-btn" id="btnUnderline" title="Underline"><u>U</u></button>
        </div>
        <div class="ribbon-group">
          <select class="ribbon-select" id="fontSizeSelect">
            <option value="12px">9</option>
            <option value="14px">10</option>
            <option value="16px" selected>11</option>
            <option value="18px">12</option>
          </select>
          <button class="ribbon-btn" id="btnZebraShading">Toggle Zebra Shading</button>
        </div>
        <div class="ribbon-group">
          <button class="ribbon-btn" id="btnAddComment" style="color:#107c41;">💬 New Comment</button>
          <button class="ribbon-btn" id="btnTrackChanges">Toggle Review Mode (OFF)</button>
        </div>
      </div>
      <!-- INSERT TOOLBAR -->
      <div class="ribbon-toolbar" id="ribbon-insert">
        <div class="ribbon-group">
          <button class="ribbon-btn" id="btnInsertRow">➕ Insert Row Above</button>
          <button class="ribbon-btn" id="btnInsertCol">➕ Insert Column Right</button>
          <button class="ribbon-btn" id="btnDeleteRow" style="color:#dc2626;">❌ Delete Row</button>
        </div>
      </div>

      <!-- PAGE LAYOUT TOOLBAR -->
      <div class="ribbon-toolbar" id="ribbon-layout">
        <div class="ribbon-group">
          <label style="font-size:0.75rem; color:#4b5563; display:flex; align-items:center; gap:6px; cursor:pointer;">
            <input type="checkbox" id="chkWatermark" /> Enable Watermark:
            <input type="text" id="watermarkText" value="DRAFT" style="width:90px; padding:2px; border:1px solid #ccc; font-size:0.7rem;" />
          </label>
        </div>
        <div class="ribbon-group">
          <button class="ribbon-btn" id="btnToggleGridlines" class="active">Hide Gridlines</button>
        </div>
      </div>

      <!-- FORMULAS TOOLBAR -->
      <div class="ribbon-toolbar" id="ribbon-formulas">
        <div class="ribbon-group">
          <button class="ribbon-btn" id="btnCalculateSum" style="color:#107c41; font-weight:bold;">∑ SUM</button>
          <button class="ribbon-btn" id="btnCalculateAverage">Average</button>
          <button class="ribbon-btn" id="btnCalculateCount">Count</button>
          <button class="ribbon-btn" id="btnCalculateMax">Max</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Formula Bar -->
  <div class="formula-bar-container">
    <div class="formula-cell-indicator" id="activeCellLabel">A1</div>
    <div style="font-style:italic; color:#6b7280; font-size:0.9rem;">fx</div>
    <input type="text" class="formula-input" id="formulaInput" placeholder="Enter values or formulas..." />
  </div>

  <!-- Main Workspace -->
  <div class="sheet-workspace">
    <div class="sheet-center-pane">
      <div class="watermark-overlay" id="watermarkOverlay" style="display:none;">DRAFT</div>
      <table class="sheet-grid" id="spreadsheetGrid">
        <thead>
          <tr id="gridHeaderRow">
            <th style="width: 50px;"></th>
            <!-- Letters A to Z populated via JS -->
          </tr>
        </thead>
        <tbody id="gridBody">
          <!-- Rows A-Z and 1-100 populated via JS -->
        </tbody>
      </table>
    </div>

    <!-- Right Sidebar comments & Review logs -->
    <aside class="sheet-right-sidebar">
      <div class="sidebar-tabs">
        <button class="sidebar-tab active" id="tabComments">Comments</button>
        <button class="sidebar-tab" id="tabReview">Review & History</button>
      </div>
      
      <div class="sidebar-content" id="sidebarContent">
        <!-- Loaded dynamically -->
      </div>
    </aside>
  </div>

  <script>
    const DB_KEY = "bt_office_docs_v1";
    let documentCatalog = [];
    let activeDoc = null;
    let docComments = [];
    let reviewLogs = []; // Stores version snapshots: { time, text, cellDataSnapshot }
    let activeTab = "comments";
    let isTrackChanges = false;
    
    // Spreadsheet state
    const COLUMNS = [];
    for (let i = 0; i < 26; i++) {
      COLUMNS.push(String.fromCharCode(65 + i)); // A to Z
    }
    const ROW_COUNT = 100;
    let cellData = {}; // Format: {"A1": "val", "B2": "100"}
    let selectedCell = "A1";

    const urlParams = new URLSearchParams(window.location.search);
    const docId = urlParams.get("id");

    // Ribbon Tabs switching
    document.querySelectorAll(".ribbon-tab").forEach(tab => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".ribbon-tab").forEach(t => t.classList.remove("active"));
        document.querySelectorAll(".ribbon-toolbar").forEach(b => b.classList.remove("active"));
        
        tab.classList.add("active");
        const toolbarId = tab.getAttribute("data-tab");
        document.getElementById(toolbarId).classList.add("active");
      });
    });

    function buildGrid() {
      const headerRow = document.getElementById("gridHeaderRow");
      // Clear header row (except first empty header cell)
      headerRow.innerHTML = '<th style="width: 50px;"></th>';
      COLUMNS.forEach(col => {
        const th = document.createElement("th");
        th.textContent = col;
        headerRow.appendChild(th);
      });

      const body = document.getElementById("gridBody");
      body.innerHTML = "";
      for (let r = 1; r <= ROW_COUNT; r++) {
        const tr = document.createElement("tr");
        tr.id = `row-${r}`;
        const rowLabel = document.createElement("th");
        rowLabel.textContent = r;
        tr.appendChild(rowLabel);

        COLUMNS.forEach(col => {
          const cellId = `${col}${r}`;
          const td = document.createElement("td");
          td.id = cellId;
          td.contentEditable = "true";
          
          td.addEventListener("focus", () => {
            selectCell(cellId);
          });
          
          td.addEventListener("input", (e) => {
            cellData[cellId] = e.target.textContent;
            document.getElementById("formulaInput").value = cellData[cellId] || "";
            saveDoc();
            if (isTrackChanges) {
              logReview(`Edited cell ${cellId} to "${cellData[cellId]}"`);
            }
          });

          tr.appendChild(td);
        });

        body.appendChild(tr);
      }
    }

    function selectCell(cellId) {
      if (selectedCell) {
        const prev = document.getElementById(selectedCell);
        if (prev) prev.classList.remove("selected");
      }
      selectedCell = cellId;
      const curr = document.getElementById(cellId);
      if (curr) {
        curr.classList.add("selected");
      }
      document.getElementById("activeCellLabel").textContent = cellId;
      document.getElementById("formulaInput").value = cellData[cellId] || "";
    }

    function loadDoc() {
      const stored = localStorage.getItem(DB_KEY);
      if (stored) {
        documentCatalog = JSON.parse(stored);
      }
      
      activeDoc = documentCatalog.find(d => d.id === docId);
      if (!activeDoc) {
        alert("Document not found.");
        window.location.href = "office-suite.html";
        return;
      }

      document.getElementById("docTitleInput").value = activeDoc.name;
      
      cellData = activeDoc.content && typeof activeDoc.content === 'object' ? activeDoc.content : {};

      // Fill values into spreadsheet DOM
      renderGridData();

      docComments = activeDoc.comments || [];
      reviewLogs = activeDoc.reviewLogs || [
        { time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }), text: "Initial spreadsheet version", cellDataSnapshot: JSON.parse(JSON.stringify(cellData)) }
      ];

      selectCell("A1");
      renderSidebar();
    }

    function renderGridData() {
      // Clear sheet
      for (let r = 1; r <= ROW_COUNT; r++) {
        COLUMNS.forEach(col => {
          const cell = document.getElementById(`${col}${r}`);
          if (cell) cell.textContent = "";
        });
      }
      // Populate new data
      Object.keys(cellData).forEach(cellId => {
        const cell = document.getElementById(cellId);
        if (cell) cell.textContent = cellData[cellId];
      });
    }

    function saveDoc() {
      if (!activeDoc) return;
      activeDoc.name = document.getElementById("docTitleInput").value;
      activeDoc.content = cellData;
      activeDoc.comments = docComments;
      activeDoc.reviewLogs = reviewLogs;

      const idx = documentCatalog.findIndex(d => d.id === activeDoc.id);
      if (idx !== -1) {
        documentCatalog[idx] = activeDoc;
      }
      localStorage.setItem(DB_KEY, JSON.stringify(documentCatalog));
    }

    // Formula Input Sync
    document.getElementById("formulaInput").addEventListener("input", (e) => {
      if (!selectedCell) return;
      cellData[selectedCell] = e.target.value;
      const cell = document.getElementById(selectedCell);
      if (cell) cell.textContent = e.target.value;
      saveDoc();
    });

    // Formatting Toolbar triggers
    document.getElementById("btnBold").addEventListener("click", () => {
      const cell = document.getElementById(selectedCell);
      if (cell) {
        cell.style.fontWeight = cell.style.fontWeight === 'bold' ? 'normal' : 'bold';
      }
    });

    document.getElementById("btnItalic").addEventListener("click", () => {
      const cell = document.getElementById(selectedCell);
      if (cell) {
        cell.style.fontStyle = cell.style.fontStyle === 'italic' ? 'normal' : 'italic';
      }
    });

    document.getElementById("btnUnderline").addEventListener("click", () => {
      const cell = document.getElementById(selectedCell);
      if (cell) {
        cell.style.textDecoration = cell.style.textDecoration === 'underline' ? 'none' : 'underline';
      }
    });

    document.getElementById("fontSizeSelect").addEventListener("change", (e) => {
      const cell = document.getElementById(selectedCell);
      if (cell) {
        cell.style.fontSize = e.target.value;
      }
    });

    // Zebra Shading toggle
    let zebraOn = false;
    document.getElementById("btnZebraShading").addEventListener("click", () => {
      zebraOn = !zebraOn;
      for (let r = 1; r <= ROW_COUNT; r++) {
        const row = document.getElementById(`row-${r}`);
        if (row) {
          if (zebraOn && r % 2 === 0) {
            row.classList.add("zebra");
          } else {
            row.classList.remove("zebra");
          }
        }
      }
    });

    // Insert/Delete Column or Row Functions
    document.getElementById("btnInsertRow").addEventListener("click", () => {
      const rowNum = parseInt(selectedCell.slice(1));
      // Shift all rows down from rowNum
      const tempCellData = {};
      Object.keys(cellData).forEach(key => {
        const col = key[0];
        const r = parseInt(key.slice(1));
        if (r >= rowNum) {
          tempCellData[`${col}${r + 1}`] = cellData[key];
        } else {
          tempCellData[key] = cellData[key];
        }
      });
      cellData = tempCellData;
      renderGridData();
      saveDoc();
      logReview(`Inserted row above row ${rowNum}`);
    });

    document.getElementById("btnDeleteRow").addEventListener("click", () => {
      const rowNum = parseInt(selectedCell.slice(1));
      const tempCellData = {};
      Object.keys(cellData).forEach(key => {
        const col = key[0];
        const r = parseInt(key.slice(1));
        if (r > rowNum) {
          tempCellData[`${col}${r - 1}`] = cellData[key];
        } else if (r < rowNum) {
          tempCellData[key] = cellData[key];
        }
      });
      cellData = tempCellData;
      renderGridData();
      saveDoc();
      logReview(`Deleted row ${rowNum}`);
    });

    document.getElementById("btnInsertCol").addEventListener("click", () => {
      const colLetter = selectedCell[0];
      const colIndex = COLUMNS.indexOf(colLetter);
      // Shift columns right
      const tempCellData = {};
      Object.keys(cellData).forEach(key => {
        const col = key[0];
        const r = key.slice(1);
        const idx = COLUMNS.indexOf(col);
        if (idx >= colIndex && idx < COLUMNS.length - 1) {
          tempCellData[`${COLUMNS[idx + 1]}${r}`] = cellData[key];
        } else if (idx < colIndex) {
          tempCellData[key] = cellData[key];
        }
      });
      cellData = tempCellData;
      renderGridData();
      saveDoc();
      logReview(`Inserted column right of ${colLetter}`);
    });

    // Clear Sheet
    document.getElementById("btnClearSheet").addEventListener("click", () => {
      if (confirm("Are you sure you want to clear the entire spreadsheet?")) {
        cellData = {};
        renderGridData();
        saveDoc();
        logReview("Cleared entire spreadsheet grid", "deletion");
      }
    });

    // Hide/Show Gridlines
    let gridlinesVisible = true;
    document.getElementById("btnToggleGridlines").addEventListener("click", (e) => {
      gridlinesVisible = !gridlinesVisible;
      const cells = document.querySelectorAll(".sheet-grid td, .sheet-grid th");
      cells.forEach(c => {
        c.style.border = gridlinesVisible ? "1px solid #d1d5db" : "none";
      });
      e.target.textContent = gridlinesVisible ? "Hide Gridlines" : "Show Gridlines";
    });

    // Formulas Helpers
    function getColNumbers(col, maxRow) {
      const vals = [];
      for (let r = 1; r < maxRow; r++) {
        const val = parseFloat(cellData[`${col}${r}`]);
        if (!isNaN(val)) vals.push(val);
      }
      return vals;
    }

    document.getElementById("btnCalculateSum").addEventListener("click", () => {
      if (!selectedCell) return;
      const col = selectedCell[0];
      const maxRow = parseInt(selectedCell.slice(1));
      const vals = getColNumbers(col, maxRow);
      const sum = vals.reduce((a, b) => a + b, 0);
      cellData[selectedCell] = sum.toString();
      renderGridData();
      document.getElementById("formulaInput").value = sum.toString();
      saveDoc();
      logReview(`Calculated AutoSum for cell ${selectedCell}: ${sum}`);
    });

    document.getElementById("btnCalculateAverage").addEventListener("click", () => {
      if (!selectedCell) return;
      const col = selectedCell[0];
      const maxRow = parseInt(selectedCell.slice(1));
      const vals = getColNumbers(col, maxRow);
      const avg = vals.length ? (vals.reduce((a, b) => a + b, 0) / vals.length).toFixed(2) : 0;
      cellData[selectedCell] = avg.toString();
      renderGridData();
      document.getElementById("formulaInput").value = avg.toString();
      saveDoc();
      logReview(`Calculated Average for cell ${selectedCell}: ${avg}`);
    });

    document.getElementById("btnCalculateCount").addEventListener("click", () => {
      if (!selectedCell) return;
      const col = selectedCell[0];
      const maxRow = parseInt(selectedCell.slice(1));
      const vals = getColNumbers(col, maxRow);
      cellData[selectedCell] = vals.length.toString();
      renderGridData();
      document.getElementById("formulaInput").value = vals.length.toString();
      saveDoc();
      logReview(`Calculated Count for cell ${selectedCell}: ${vals.length}`);
    });

    document.getElementById("btnCalculateMax").addEventListener("click", () => {
      if (!selectedCell) return;
      const col = selectedCell[0];
      const maxRow = parseInt(selectedCell.slice(1));
      const vals = getColNumbers(col, maxRow);
      const max = vals.length ? Math.max(...vals) : 0;
      cellData[selectedCell] = max.toString();
      renderGridData();
      document.getElementById("formulaInput").value = max.toString();
      saveDoc();
      logReview(`Calculated Max for cell ${selectedCell}: ${max}`);
    });

    // Save Copy
    document.getElementById("btnSaveCopy").addEventListener("click", () => {
      const timestamp = new Date().toISOString().replace(/T/, ' ').replace(/\..+/, '');
      const originalName = document.getElementById("docTitleInput").value;
      const copyName = prompt("Save as copy (leaves original intact):", `${originalName.replace(/\.[^/.]+$/, "")} (Backup ${timestamp}).xlsx`);
      if (!copyName) return;

      const newId = "doc_" + Math.random().toString(36).substr(2, 9);
      const newDoc = {
        id: newId,
        name: copyName,
        type: "CELL",
        size: activeDoc.size,
        content: JSON.parse(JSON.stringify(cellData)),
        comments: JSON.parse(JSON.stringify(docComments)),
        reviewLogs: JSON.parse(JSON.stringify(reviewLogs))
      };
      
      documentCatalog.push(newDoc);
      localStorage.setItem(DB_KEY, JSON.stringify(documentCatalog));
      alert(`New copy saved successfully: ${copyName}`);
      window.location.href = `sheet.html?id=${newId}`;
    });

    // Export Formats
    document.getElementById("btnExportCSV").addEventListener("click", () => {
      let csvContent = "";
      for (let r = 1; r <= ROW_COUNT; r++) {
        const rowArr = [];
        COLUMNS.forEach(col => {
          rowArr.push(cellData[`${col}${r}`] || "");
        });
        csvContent += rowArr.join(",") + "\n";
      }
      
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.setAttribute("download", document.getElementById("docTitleInput").value.replace(/\.[^/.]+$/, "") + ".csv");
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    });

    document.getElementById("btnExportJSON").addEventListener("click", () => {
      const jsonContent = JSON.stringify(cellData, null, 2);
      const blob = new Blob([jsonContent], { type: 'application/json;charset=utf-8;' });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.setAttribute("download", document.getElementById("docTitleInput").value.replace(/\.[^/.]+$/, "") + ".json");
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    });

    // Watermark
    const chkWatermark = document.getElementById("chkWatermark");
    const watermarkText = document.getElementById("watermarkText");
    const overlay = document.getElementById("watermarkOverlay");

    function updateWatermark() {
      if (chkWatermark.checked && watermarkText.value) {
        overlay.style.display = "flex";
        overlay.textContent = watermarkText.value;
      } else {
        overlay.style.display = "none";
      }
    }
    chkWatermark.addEventListener("change", updateWatermark);
    watermarkText.addEventListener("input", updateWatermark);

    // Comments & Review Tabs
    const tabComments = document.getElementById("tabComments");
    const tabReview = document.getElementById("tabReview");

    tabComments.addEventListener("click", () => {
      activeTab = "comments";
      tabComments.classList.add("active");
      tabReview.classList.remove("active");
      renderSidebar();
    });

    tabReview.addEventListener("click", () => {
      activeTab = "review";
      tabReview.classList.add("active");
      tabComments.classList.remove("active");
      renderSidebar();
    });

    document.getElementById("btnTrackChanges").addEventListener("click", (e) => {
      isTrackChanges = !isTrackChanges;
      e.target.textContent = `Toggle Review Mode (${isTrackChanges ? 'ON' : 'OFF'})`;
      e.target.classList.toggle("active", isTrackChanges);
    });

    document.getElementById("btnAddComment").addEventListener("click", () => {
      const comment = prompt("Add comment/notes for cell " + selectedCell + ":");
      if (!comment) return;
      
      const defaultUser = localStorage.getItem("bt_office_user") || "User";
      const author = prompt("Enter your name:", defaultUser);
      if (!author) return;
      localStorage.setItem("bt_office_user", author);

      const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      docComments.push({ user: author, time, text: `[Cell ${selectedCell}] ${comment}` });
      saveDoc();
      renderSidebar();
    });

    function logReview(msg, type = "addition") {
      const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      reviewLogs.push({
        time,
        text: msg,
        cellDataSnapshot: JSON.parse(JSON.stringify(cellData))
      });
      saveDoc();
      if (activeTab === "review") renderSidebar();
    }

    window.restoreVersionSnapshot = function(idx) {
      if (confirm("Are you sure you want to revert spreadsheet cells to this version?")) {
        const snapshot = reviewLogs[idx].cellDataSnapshot;
        if (snapshot) {
          cellData = JSON.parse(JSON.stringify(snapshot));
          renderGridData();
          saveDoc();
          alert("Version restored successfully!");
        }
      }
    };

    function renderSidebar() {
      const content = document.getElementById("sidebarContent");
      content.innerHTML = "";
      
      if (activeTab === "comments") {
        docComments.forEach(c => {
          const div = document.createElement("div");
          div.className = "comment-card";
          div.innerHTML = `
            <div class="comment-meta">
              <span><strong>${c.user}</strong></span>
              <span>${c.time}</span>
            </div>
            <div style="color: #374151; margin-top:4px;">${c.text}</div>
          `;
          content.appendChild(div);
        });
      } else {
        reviewLogs.forEach((r, idx) => {
          const div = document.createElement("div");
          div.className = `track-changes-item`;
          div.style.cursor = "pointer";
          div.title = "Click to restore this version snapshot";
          div.setAttribute("onclick", `restoreVersionSnapshot(${idx})`);
          div.innerHTML = `<strong>${r.time}</strong>: ${r.text} <span style="font-size:0.7rem; color:#107c41; float:right;">(Restore)</span>`;
          content.appendChild(div);
        });
      }
    }

    buildGrid();
    loadDoc();
  </script>
</body>
</html>
