<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="/assets/css/main.css">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BluePresent - PowerPoint Online Editor | Bluetext.in</title>
  
  
</head>
<body>

  <!-- Slide Header -->
  <header class="slides-header">
    <div class="slides-header-left">
      <span class="slides-app-icon">P📘</span>
      <div class="slides-doc-title-box">
        <input type="text" class="slides-title-input" id="docTitleInput" value="strategic_roadmap.pptx" />
        <span class="save-badge" id="saveIndicator">● Saved to Local Library</span>
      </div>
    </div>
    <div>
      <a href="office-suite.html">Dashboard</a>
    </div>
  </header>

  <!-- Ribbon -->
  <div class="slides-ribbon">
    <div class="ribbon-tabs">
      <button class="ribbon-tab active">Home</button>
      <button class="ribbon-tab" id="btnNewSlide">➕ New Slide</button>
      <button class="ribbon-tab" id="btnPresent">▶️ Present Slides</button>
    </div>

    <div class="ribbon-toolbar">
      <div class="ribbon-group">
        <button class="ribbon-btn" id="btnBold" title="Bold"><b>B</b></button>
        <button class="ribbon-btn" id="btnItalic" title="Italic"><i>I</i></button>
      </div>

      <!-- Watermark overlay and comments controls -->
      <div class="ribbon-group">
        <button class="ribbon-btn" id="btnAddComment">💬 New Comment</button>
        <button class="ribbon-btn" id="btnTrackChanges">Toggle Review Mode (OFF)</button>
        <label>
          <input type="checkbox" id="chkWatermark" /> Watermark:
          <input type="text" id="watermarkText" value="INTERNAL" />
        </label>
      </div>
    </div>
  </div>

  <!-- Workspace -->
  <div class="slides-workspace">
    <!-- Left thumb strip -->
    <div class="slide-deck-list" id="slideThumbList">
      <div class="slide-deck-title">Slides</div>
      <!-- Dynamically filled -->
    </div>

    <!-- Center Editor Canvas -->
    <div class="slides-center-pane">
      <div class="watermark-overlay" id="watermarkOverlay">INTERNAL</div>
      <div class="slide-canvas" id="slideCanvas" contenteditable="true">
        <!-- Slide content loaded here -->
      </div>
    </div>

    <!-- Right Sidebar comments & Review logs -->
    <aside class="slides-right-sidebar">
      <div class="sidebar-tabs">
        <button class="sidebar-tab active" id="tabComments">Comments</button>
        <button class="sidebar-tab" id="tabReview">Review Logs</button>
      </div>
      
      <div class="sidebar-content" id="sidebarContent">
        <!-- Loaded dynamically -->
      </div>
    </aside>
  </div>

  <!-- Presenter Mode Overlay -->
  <div class="presenter-overlay" id="presenterOverlay">
    <div class="presenter-slide" id="presenterSlideArea">
      <!-- Active slide contents -->
    </div>
    <div class="presenter-controls">
      <button class="presenter-btn" id="btnPresPrev">◀ Prev</button>
      <button class="presenter-btn" id="btnPresNext">Next ▶</button>
      <button class="presenter-btn" id="btnExitPresenter">Exit Presentation</button>
    </div>
  </div>

  <script>
    const DB_KEY = "bt_office_docs_v1";
    let documentCatalog = [];
    let activeDoc = null;
    let docComments = [];
    let reviewLogs = [];
    let activeTab = "comments";
    let isTrackChanges = false;

    // Slide state
    let slideDeck = [];
    let activeSlideIndex = 0;
    let isPresenterActive = false;

    const urlParams = new URLSearchParams(window.location.search);
    const docId = urlParams.get("id");

    function loadDoc() {
      const stored = localStorage.getItem(DB_KEY);
      if (stored) {
        documentCatalog = JSON.parse(stored);
      }
      
      activeDoc = documentCatalog.find(d => d.id === docId);
      if (!activeDoc) {
        alert("Document not found.");
        window.location.href = "office-suite.html";
        return;
      }

      document.getElementById("docTitleInput").value = activeDoc.name;

      slideDeck = Array.isArray(activeDoc.content) && activeDoc.content.length > 0 ? activeDoc.content : [
        { title: "Strategic Roadmap", subtitle: "Q3-Q4 Growth Business Outline" },
        { title: "Current Milestones", subtitle: "Completed setup and preliminary validation tests." },
        { title: "Next Phase Objectives", subtitle: "Rollout premium collaboration components and testing framework." }
      ];

      docComments = activeDoc.comments || [
        { user: "Jane Doe", time: "02:10 PM", text: "Slides flow logically." }
      ];
      
      reviewLogs = activeDoc.reviewLogs || [
        { time: "01:30 PM", text: "Created presentation deck", type: "addition" }
      ];

      renderDeck();
      renderActiveSlide();
      renderSidebar();
    }

    function saveDoc() {
      if (!activeDoc) return;
      activeDoc.name = document.getElementById("docTitleInput").value;
      activeDoc.content = slideDeck;
      activeDoc.comments = docComments;
      activeDoc.reviewLogs = reviewLogs;

      const idx = documentCatalog.findIndex(d => d.id === activeDoc.id);
      if (idx !== -1) {
        documentCatalog[idx] = activeDoc;
      }
      localStorage.setItem(DB_KEY, JSON.stringify(documentCatalog));
    }

    function renderDeck() {
      const list = document.getElementById("slideThumbList");
      // Keep title
      list.innerHTML = '<div class="slide-deck-title">Slides</div>';
      
      slideDeck.forEach((slide, idx) => {
        const thumb = document.createElement("div");
        thumb.className = `slide-thumb ${idx === activeSlideIndex ? 'active' : ''}`;
        thumb.innerHTML = `<strong>Slide ${idx + 1}</strong><br><span>${slide.title}</span>`;
        thumb.addEventListener("click", () => {
          activeSlideIndex = idx;
          renderDeck();
          renderActiveSlide();
        });
        list.appendChild(thumb);
      });
    }

    function renderActiveSlide() {
      const slide = slideDeck[activeSlideIndex];
      const canvas = document.getElementById("slideCanvas");
      canvas.innerHTML = `
        <h2>${slide.title}</h2>
        <p>${slide.subtitle}</p>
      `;
    }

    // Capture editing of active slide
    document.getElementById("slideCanvas").addEventListener("input", (e) => {
      const titleEl = e.target.querySelector("h2");
      const subEl = e.target.querySelector("p");
      if (slideDeck[activeSlideIndex]) {
        if (titleEl) slideDeck[activeSlideIndex].title = titleEl.textContent;
        if (subEl) slideDeck[activeSlideIndex].subtitle = subEl.textContent;
        saveDoc();
        
        // Update thumbnail listing real time
        const thumbs = document.querySelectorAll(".slide-thumb");
        if (thumbs[activeSlideIndex]) {
          thumbs[activeSlideIndex].innerHTML = `<strong>Slide ${activeSlideIndex + 1}</strong><br><span>${slideDeck[activeSlideIndex].title}</span>`;
        }
        
        if (isTrackChanges) {
          logReview(`Edited slide ${activeSlideIndex + 1} elements`);
        }
      }
    });

    document.getElementById("btnNewSlide").addEventListener("click", () => {
      slideDeck.push({ title: "New Slide Title", subtitle: "Double click to edit details" });
      activeSlideIndex = slideDeck.length - 1;
      saveDoc();
      renderDeck();
      renderActiveSlide();
      logReview("Added new slide to presentation");
    });

    // Formatting Tools
    document.getElementById("btnBold").addEventListener("click", () => document.execCommand("bold"));
    document.getElementById("btnItalic").addEventListener("click", () => document.execCommand("italic"));

    // Watermark
    const chkWatermark = document.getElementById("chkWatermark");
    const watermarkText = document.getElementById("watermarkText");
    const overlay = document.getElementById("watermarkOverlay");

    function updateWatermark() {
      if (chkWatermark.checked && watermarkText.value) {
        overlay.style.display = "flex";
        overlay.textContent = watermarkText.value;
      } else {
        overlay.style.display = "none";
      }
    }
    chkWatermark.addEventListener("change", updateWatermark);
    watermarkText.addEventListener("input", updateWatermark);

    // Presenter Mode Toggle
    const presOverlay = document.getElementById("presenterOverlay");
    const presSlideArea = document.getElementById("presenterSlideArea");
    let activePresIndex = 0;

    function renderPresenterSlide() {
      const slide = slideDeck[activePresIndex];
      presSlideArea.innerHTML = `
        <h2>${slide.title}</h2>
        <p>${slide.subtitle}</p>
      `;
    }

    document.getElementById("btnPresent").addEventListener("click", () => {
      isPresenterActive = true;
      activePresIndex = activeSlideIndex;
      presOverlay.style.display = "flex";
      renderPresenterSlide();
    });

    document.getElementById("btnExitPresenter").addEventListener("click", () => {
      isPresenterActive = false;
      presOverlay.style.display = "none";
    });

    document.getElementById("btnPresPrev").addEventListener("click", () => {
      if (activePresIndex > 0) {
        activePresIndex--;
        renderPresenterSlide();
      }
    });

    document.getElementById("btnPresNext").addEventListener("click", () => {
      if (activePresIndex < slideDeck.length - 1) {
        activePresIndex++;
        renderPresenterSlide();
      }
    });

    // Comments & Review Tabs
    const tabComments = document.getElementById("tabComments");
    const tabReview = document.getElementById("tabReview");

    tabComments.addEventListener("click", () => {
      activeTab = "comments";
      tabComments.classList.add("active");
      tabReview.classList.remove("active");
      renderSidebar();
    });

    tabReview.addEventListener("click", () => {
      activeTab = "review";
      tabReview.classList.add("active");
      tabComments.classList.remove("active");
      renderSidebar();
    });

    document.getElementById("btnTrackChanges").addEventListener("click", (e) => {
      isTrackChanges = !isTrackChanges;
      e.target.textContent = `Toggle Review Mode (${isTrackChanges ? 'ON' : 'OFF'})`;
      e.target.classList.toggle("active", isTrackChanges);
    });

    document.getElementById("btnAddComment").addEventListener("click", () => {
      const comment = prompt("Add comment/notes for active slide:");
      if (!comment) return;
      const user = "John Smith";
      const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      docComments.push({ user, time, text: `[Slide ${activeSlideIndex + 1}] ${comment}` });
      saveDoc();
      renderSidebar();
    });

    function logReview(msg, type = "addition") {
      const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      reviewLogs.push({ time, text: msg, type });
      saveDoc();
      if (activeTab === "review") renderSidebar();
    }

    function renderSidebar() {
      const content = document.getElementById("sidebarContent");
      content.innerHTML = "";
      
      if (activeTab === "comments") {
        docComments.forEach(c => {
          const div = document.createElement("div");
          div.className = "comment-card";
          div.innerHTML = `
            <div class="comment-meta">
              <span><strong>${c.user}</strong></span>
              <span>${c.time}</span>
            </div>
            <div>${c.text}</div>
          `;
          content.appendChild(div);
        });
      } else {
        reviewLogs.forEach(r => {
          const div = document.createElement("div");
          div.className = `track-changes-item`;
          div.innerHTML = `<strong>${r.time}</strong>: ${r.text}`;
          content.appendChild(div);
        });
      }
    }

    loadDoc();
  </script>
</body>
</html>
