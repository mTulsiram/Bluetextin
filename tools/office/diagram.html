<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="/assets/css/main.css">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BlueDiagram - Diagram Flowchart Editor | Bluetext.in</title>
  
  
</head>
<body>

  <!-- Visio Header -->
  <header class="diagram-header">
    <div class="diagram-header-left">
      <span class="diagram-app-icon">D📐</span>
      <div class="diagram-doc-title-box">
        <input type="text" class="diagram-title-input" id="docTitleInput" value="system_architecture.vsdx" />
        <span class="save-badge" id="saveIndicator">● Saved to Local Library</span>
      </div>
    </div>
    <div>
      <a href="office-suite.html">Dashboard</a>
    </div>
  </header>

  <!-- Ribbon -->
  <div class="diagram-ribbon">
    <div class="ribbon-tabs">
      <button class="ribbon-tab active">Shapes</button>
      <button class="ribbon-tab" id="btnClearBoard">Clear Canvas</button>
      <button class="ribbon-tab" onclick="alert('Simulation: SVG Connector logic initialized.')">Add Connector</button>
    </div>

    <div class="ribbon-toolbar">
      <!-- Watermark overlay and comments controls -->
      <div class="ribbon-group">
        <button class="ribbon-btn" id="btnAddComment">💬 New Comment</button>
        <button class="ribbon-btn" id="btnTrackChanges">Toggle Review Mode (OFF)</button>
        <label>
          <input type="checkbox" id="chkWatermark" /> Watermark:
          <input type="text" id="watermarkText" value="CONFIDENTIAL" />
        </label>
      </div>
    </div>
  </div>

  <!-- Workspace -->
  <div class="diagram-workspace">
    <!-- Shape bar -->
    <div class="shape-toolbox">
      <div class="toolbox-title">Shapes</div>
      <button class="shape-btn" id="btnAddProcess">🟦 Process</button>
      <button class="shape-btn" id="btnAddDecision">🔶 Decision</button>
      <button class="shape-btn" id="btnAddTerminator">🟢 Start/End</button>
    </div>

    <!-- Canvas -->
    <div class="diagram-center-pane">
      <div class="watermark-overlay" id="watermarkOverlay">CONFIDENTIAL</div>
      <div class="diagram-board" id="diagramBoard">
        <!-- SVG Connections Layer -->
        <svg id="connectorSvg"></svg>
        <!-- Nodes populated via JS -->
      </div>
    </div>

    <!-- Right Sidebar comments & Review logs -->
    <aside class="diagram-right-sidebar">
      <div class="sidebar-tabs">
        <button class="sidebar-tab active" id="tabComments">Comments</button>
        <button class="sidebar-tab" id="tabReview">Review Logs</button>
      </div>
      
      <div class="sidebar-content" id="sidebarContent">
        <!-- Loaded dynamically -->
      </div>
    </aside>
  </div>

  <script>
    const DB_KEY = "bt_office_docs_v1";
    let documentCatalog = [];
    let activeDoc = null;
    let docComments = [];
    let reviewLogs = [];
    let activeTab = "comments";
    let isTrackChanges = false;

    // Diagram nodes state
    let diagramNodes = [];
    const board = document.getElementById("diagramBoard");

    const urlParams = new URLSearchParams(window.location.search);
    const docId = urlParams.get("id");

    function loadDoc() {
      const stored = localStorage.getItem(DB_KEY);
      if (stored) {
        documentCatalog = JSON.parse(stored);
      }
      
      activeDoc = documentCatalog.find(d => d.id === docId);
      if (!activeDoc) {
        alert("Document not found.");
        window.location.href = "office-suite.html";
        return;
      }

      document.getElementById("docTitleInput").value = activeDoc.name;

      diagramNodes = Array.isArray(activeDoc.content) && activeDoc.content.length > 0 ? activeDoc.content : [
        { id: "node1", label: "User Input Request", x: 100, y: 150, type: "process" },
        { id: "node2", label: "Is Form Valid?", x: 300, y: 135, type: "decision" },
        { id: "node3", label: "Success & Store", x: 520, y: 150, type: "terminator" }
      ];

      docComments = activeDoc.comments || [
        { user: "Jane Doe", time: "04:15 PM", text: "Process connection points look aligned." }
      ];
      
      reviewLogs = activeDoc.reviewLogs || [
        { time: "04:00 PM", text: "Created diagram layout", type: "addition" }
      ];

      renderCanvasNodes();
      renderSidebar();
    }

    function saveDoc() {
      if (!activeDoc) return;
      activeDoc.name = document.getElementById("docTitleInput").value;
      activeDoc.content = diagramNodes;
      activeDoc.comments = docComments;
      activeDoc.reviewLogs = reviewLogs;

      const idx = documentCatalog.findIndex(d => d.id === activeDoc.id);
      if (idx !== -1) {
        documentCatalog[idx] = activeDoc;
      }
      localStorage.setItem(DB_KEY, JSON.stringify(documentCatalog));
    }

    function renderCanvasNodes() {
      // Clear current node DOM elements (keep SVG)
      const existingNodes = board.querySelectorAll(".diagram-node");
      existingNodes.forEach(n => n.remove());

      diagramNodes.forEach(node => {
        const div = document.createElement("div");
        div.className = `diagram-node ${node.type}`;
        div.style.left = `${node.x}px`;
        div.style.top = `${node.y}px`;
        div.id = node.id;
        
        const span = document.createElement("span");
        span.textContent = node.label;
        span.contentEditable = "true";
        span.addEventListener("blur", () => {
          node.label = span.textContent;
          saveDoc();
          if (isTrackChanges) {
            logReview(`Renamed shape to "${node.label}"`);
          }
        });
        
        div.appendChild(span);
        makeDraggable(div, node);
        board.appendChild(div);
      });

      drawLines();
    }

    function makeDraggable(el, nodeObj) {
      let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
      el.onmousedown = dragMouseDown;

      function dragMouseDown(e) {
        e = e || window.event;
        // Ignore drag if clicking inside editable text span
        if (e.target.contentEditable === "true") return;
        
        e.preventDefault();
        pos3 = e.clientX;
        pos4 = e.clientY;
        document.onmouseup = closeDragElement;
        document.onmousemove = elementDrag;
      }

      function elementDrag(e) {
        e = e || window.event;
        e.preventDefault();
        pos1 = pos3 - e.clientX;
        pos2 = pos4 - e.clientY;
        pos3 = e.clientX;
        pos4 = e.clientY;
        
        let newX = el.offsetLeft - pos1;
        let newY = el.offsetTop - pos2;

        // Boundaries
        if (newX < 0) newX = 0;
        if (newY < 0) newY = 0;
        if (newX > board.clientWidth - el.clientWidth) newX = board.clientWidth - el.clientWidth;
        if (newY > board.clientHeight - el.clientHeight) newY = board.clientHeight - el.clientHeight;

        el.style.left = `${newX}px`;
        el.style.top = `${newY}px`;

        nodeObj.x = newX;
        nodeObj.y = newY;
      }

      function closeDragElement() {
        document.onmouseup = null;
        document.onmousemove = null;
        saveDoc();
        drawLines();
        if (isTrackChanges) {
          logReview(`Moved shape "${nodeObj.label}" to position X:${nodeObj.x} Y:${nodeObj.y}`);
        }
      }
    }

    // Dynamic Line Connectors SVG builder
    function drawLines() {
      const svg = document.getElementById("connectorSvg");
      svg.innerHTML = "";
      
      // Let's draw lines sequentially from node 1 to node 2, etc.
      for (let i = 0; i < diagramNodes.length - 1; i++) {
        const startNode = diagramNodes[i];
        const endNode = diagramNodes[i + 1];
        
        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        // Center offset approximation
        const x1 = startNode.x + 50;
        const y1 = startNode.y + 25;
        const x2 = endNode.x + 50;
        const y2 = endNode.y + 25;

        line.setAttribute("x1", x1);
        line.setAttribute("y1", y1);
        line.setAttribute("x2", x2);
        line.setAttribute("y2", y2);
        line.setAttribute("stroke", "#181d26");
        line.setAttribute("stroke-width", "2");
        line.setAttribute("marker-end", "url(#arrow)");
        
        svg.appendChild(line);
      }
    }

    // Toolbox adds
    document.getElementById("btnAddProcess").addEventListener("click", () => {
      const id = "node_" + Date.now();
      diagramNodes.push({ id, label: "Process Block", x: 50, y: 50, type: "process" });
      saveDoc();
      renderCanvasNodes();
      logReview("Added Process block shape to diagram");
    });

    document.getElementById("btnAddDecision").addEventListener("click", () => {
      const id = "node_" + Date.now();
      diagramNodes.push({ id, label: "Decision", x: 50, y: 50, type: "decision" });
      saveDoc();
      renderCanvasNodes();
      logReview("Added Decision diamond shape to diagram");
    });

    document.getElementById("btnAddTerminator").addEventListener("click", () => {
      const id = "node_" + Date.now();
      diagramNodes.push({ id, label: "End Terminus", x: 50, y: 50, type: "terminator" });
      saveDoc();
      renderCanvasNodes();
      logReview("Added Start/End terminus shape to diagram");
    });

    document.getElementById("btnClearBoard").addEventListener("click", () => {
      diagramNodes = [];
      saveDoc();
      renderCanvasNodes();
      logReview("Cleared all elements from diagram canvas", "deletion");
    });

    // Watermark
    const chkWatermark = document.getElementById("chkWatermark");
    const watermarkText = document.getElementById("watermarkText");
    const overlay = document.getElementById("watermarkOverlay");

    function updateWatermark() {
      if (chkWatermark.checked && watermarkText.value) {
        overlay.style.display = "flex";
        overlay.textContent = watermarkText.value;
      } else {
        overlay.style.display = "none";
      }
    }
    chkWatermark.addEventListener("change", updateWatermark);
    watermarkText.addEventListener("input", updateWatermark);

    // Comments & Review Tabs
    const tabComments = document.getElementById("tabComments");
    const tabReview = document.getElementById("tabReview");

    tabComments.addEventListener("click", () => {
      activeTab = "comments";
      tabComments.classList.add("active");
      tabReview.classList.remove("active");
      renderSidebar();
    });

    tabReview.addEventListener("click", () => {
      activeTab = "review";
      tabReview.classList.add("active");
      tabComments.classList.remove("active");
      renderSidebar();
    });

    document.getElementById("btnTrackChanges").addEventListener("click", (e) => {
      isTrackChanges = !isTrackChanges;
      e.target.textContent = `Toggle Review Mode (${isTrackChanges ? 'ON' : 'OFF'})`;
      e.target.classList.toggle("active", isTrackChanges);
    });

    document.getElementById("btnAddComment").addEventListener("click", () => {
      const comment = prompt("Add comment/notes for active layout elements:");
      if (!comment) return;
      const user = "John Smith";
      const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      docComments.push({ user, time, text: comment });
      saveDoc();
      renderSidebar();
    });

    function logReview(msg, type = "addition") {
      const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      reviewLogs.push({ time, text: msg, type });
      saveDoc();
      if (activeTab === "review") renderSidebar();
    }

    function renderSidebar() {
      const content = document.getElementById("sidebarContent");
      content.innerHTML = "";
      
      if (activeTab === "comments") {
        docComments.forEach(c => {
          const div = document.createElement("div");
          div.className = "comment-card";
          div.innerHTML = `
            <div class="comment-meta">
              <span><strong>${c.user}</strong></span>
              <span>${c.time}</span>
            </div>
            <div>${c.text}</div>
          `;
          content.appendChild(div);
        });
      } else {
        reviewLogs.forEach(r => {
          const div = document.createElement("div");
          div.className = `track-changes-item`;
          div.innerHTML = `<strong>${r.time}</strong>: ${r.text}`;
          content.appendChild(div);
        });
      }
    }

    loadDoc();
  </script>
</body>
</html>
