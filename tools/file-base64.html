<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="/assets/css/main.css">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>File to Base64 Encoder | BlueTEXT</title>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <div id="site-header" class="global-header"></div>

  <main id="main-content" class="app-container" style="margin-top: var(--space-6);">
    <header style="margin-bottom: var(--space-4);">
      <p style="font-size:0.875rem; color:var(--accent-success); font-weight:600;"><a href="/index.html">&larr; Back to Dashboard</a></p>
      <h1 style="margin-top: var(--space-2);">File to Base64 Encoder</h1>
      <p style="color:var(--text-secondary); font-size:0.95rem;">Encode images, documents, or binaries into base64 strings or decode back instantly.</p>
    </header>

    <div class="tool-layout">
      <!-- Upload Panel -->
      <section class="glass-card" style="display:flex; flex-direction:column; gap:var(--space-4);">
        <h3 style="font-size:1.15rem; font-weight:600;">Upload File to Encode</h3>
        <div class="drop-zone" id="file-drop-zone">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
          <p style="font-size:0.9rem; font-weight:500;">Drag &amp; Drop Any File Here</p>
          <span style="font-size:0.75rem; color:var(--text-muted);">supports images, PDFs, text, zip, etc.</span>
          <input type="file" id="file-input" style="display:none;">
        </div>

        <div style="display:grid; grid-template-columns:1fr; gap:var(--space-3);" id="meta-display">
          <!-- Dynamically populated info cards -->
        </div>
      </section>

      <!-- Snippets & Preview Panel -->
      <section class="glass-card" style="display:flex; flex-direction:column; gap:var(--space-4);">
        <h3 style="font-size:1.15rem; font-weight:600;">Base64 Output</h3>
        
        <div class="form-group" style="margin:0;">
          <label for="base64-output">Data URI String</label>
          <textarea id="base64-output" class="textarea" placeholder="Base64 code will generate here..." style="min-height:160px; font-family:monospace; font-size:0.825rem; word-break:break-all;"></textarea>
        </div>

        <div style="display:flex; gap:var(--space-2);">
          <button class="btn btn--primary" id="btn-copy-base64" style="flex:1;">Copy Base64</button>
          <button class="btn btn--ghost" id="btn-copy-css" style="flex:1;">Copy CSS URI</button>
        </div>

        <!-- Preview Area -->
        <div id="preview-wrapper" style="display:none; border-top:1px solid var(--border-subtle); padding-top:var(--space-4); text-align:center;">
          <h4 style="font-size:0.875rem; color:var(--text-secondary); margin-bottom:var(--space-3); text-align:left;">Live Preview</h4>
          <div id="preview-content" style="max-height:180px; overflow:hidden; display:flex; justify-content:center; align-items:center; background:rgba(0,0,0,0.1); border-radius:var(--radius-sm); border:1px solid var(--border-subtle); padding:var(--space-2);"></div>
        </div>
      </section>
    </div>
  </main>

  <div id="site-footer" class="global-footer"></div>

  <script src="/assets/js/app.js" defer></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const dropZone = document.getElementById('file-drop-zone');
      const fileInput = document.getElementById('file-input');
      const base64Output = document.getElementById('base64-output');
      const metaDisplay = document.getElementById('meta-display');
      const previewWrapper = document.getElementById('preview-wrapper');
      const previewContent = document.getElementById('preview-content');

      dropZone.addEventListener('click', () => fileInput.click());

      ['dragenter', 'dragover'].forEach(name => {
        dropZone.addEventListener(name, (e) => {
          e.preventDefault();
          dropZone.classList.add('dragover');
        });
      });
      ['dragleave', 'drop'].forEach(name => {
        dropZone.addEventListener(name, (e) => {
          e.preventDefault();
          dropZone.classList.remove('dragover');
        });
      });

      dropZone.addEventListener('drop', (e) => {
        const file = e.dataTransfer.files[0];
        if (file) handleFile(file);
      });

      fileInput.addEventListener('change', () => {
        const file = fileInput.files[0];
        if (file) handleFile(file);
      });

      function handleFile(file) {
        // Display Meta
        const sizeKB = (file.size / 1024).toFixed(1);
        metaDisplay.innerHTML = `
          <div style="background:rgba(255,255,255,0.02); border:1px solid var(--border-subtle); border-radius:var(--radius-sm); padding:var(--space-3); display:flex; flex-direction:column; gap:0.2rem;">
            <span style="font-size:0.75rem; color:var(--text-muted);">Filename</span>
            <strong style="font-size:0.9rem; text-overflow:ellipsis; overflow:hidden; white-space:nowrap;">${file.name}</strong>
          </div>
          <div style="background:rgba(255,255,255,0.02); border:1px solid var(--border-subtle); border-radius:var(--radius-sm); padding:var(--space-3); display:flex; flex-direction:column; gap:0.2rem;">
            <span style="font-size:0.75rem; color:var(--text-muted);">Size / Type</span>
            <strong style="font-size:0.9rem;">${sizeKB} KB &middot; ${file.type || 'unknown'}</strong>
          </div>
        `;

        const reader = new FileReader();
        reader.onload = (e) => {
          const rawBase64 = e.target.result;
          base64Output.value = rawBase64;

          // Build Preview if it's an image
          previewContent.innerHTML = '';
          if (file.type.startsWith('image/')) {
            const img = document.createElement('img');
            img.src = rawBase64;
            img.style.maxWidth = '100%';
            img.style.maxHeight = '160px';
            img.style.objectFit = 'contain';
            img.style.borderRadius = '4px';
            previewContent.appendChild(img);
            previewWrapper.style.display = 'block';
          } else {
            previewWrapper.style.display = 'none';
          }
        };
        reader.readAsDataURL(file);
      }

      document.getElementById('btn-copy-base64').addEventListener('click', () => {
        const text = base64Output.value;
        const base64Only = text.includes(',') ? text.split(',')[1] : text;
        navigator.clipboard.writeText(base64Only).then(() => {
          const btn = document.getElementById('btn-copy-base64');
          btn.textContent = 'Copied Base64!';
          setTimeout(() => { btn.textContent = 'Copy Base64'; }, 1500);
        });
      });

      document.getElementById('btn-copy-css').addEventListener('click', () => {
        const text = base64Output.value;
        const cssSnippet = `background-image: url("${text}");`;
        navigator.clipboard.writeText(cssSnippet).then(() => {
          const btn = document.getElementById('btn-copy-css');
          btn.textContent = 'Copied CSS Snippet!';
          setTimeout(() => { btn.textContent = 'Copy CSS URI'; }, 1500);
        });
      });
    });
  </script>
</body>
</html>
