<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="/assets/css/main.css">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Text Case & Analytics | BlueTEXT</title>
  <meta name="description" content="Local, secure text case converter and real-time word counter. UPPERCASE, lowercase, camelCase, reading times.">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <div id="site-header" class="global-header"></div>

  <main id="main-content" class="app-container" style="margin-top: var(--space-6);">
    <header style="margin-bottom: var(--space-4);">
      <p style="font-size:0.875rem; color:var(--accent-primary); font-weight:600;"><a href="/index.html">&larr; Back to Dashboard</a></p>
      <h1 style="margin-top: var(--space-2);">Text Case &amp; Analytics</h1>
      <p style="color:var(--text-secondary); font-size:0.95rem;">Process text formatting and calculate content metrics instantly. All analysis runs locally in memory.</p>
    </header>

    <div class="tool-layout">
      <!-- Editor Panel -->
      <section class="glass-card" style="display:flex; flex-direction:column; gap:var(--space-4);">
        <div class="form-group" style="flex-grow:1; margin:0;">
          <label for="text-input">Input your text here</label>
          <textarea id="text-input" class="textarea" placeholder="Start typing or paste your content..." style="flex-grow:1; min-height:300px; font-family:inherit; font-size:1rem;"></textarea>
        </div>

        <div style="display:grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap:var(--space-2);">
          <button class="btn btn--primary" id="btn-upper">UPPERCASE</button>
          <button class="btn btn--primary" id="btn-lower">lowercase</button>
          <button class="btn btn--primary" id="btn-title">Title Case</button>
          <button class="btn btn--primary" id="btn-camel">camelCase</button>
          <button class="btn btn--primary" id="btn-kebab">kebab-case</button>
          <button class="btn btn--ghost" id="btn-clear" style="color:var(--accent-danger);">Clear</button>
          <button class="btn btn--accent" id="btn-copy" style="grid-column: span 2;">Copy Text</button>
        </div>
      </section>

      <!-- Analytics Dashboard -->
      <section style="display:flex; flex-direction:column; gap:var(--space-4);">
        <div class="glass-card" style="text-align:center;">
          <h3 style="font-size:0.875rem; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:var(--space-2);">Estimated Read Time</h3>
          <p id="read-time" style="font-size:2.5rem; font-family:var(--font-display); font-weight:700; color:var(--accent-primary);">0 sec</p>
          <p style="font-size:0.825rem; color:var(--text-secondary); margin-top:0.25rem;">Based on average speed of 200 WPM</p>
        </div>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:var(--space-4);">
          <div class="glass-card" style="text-align:center; padding:var(--space-4);">
            <h4 style="font-size:0.825rem; color:var(--text-secondary); margin-bottom:0.25rem;">Characters</h4>
            <span id="char-count" style="font-size:1.75rem; font-family:var(--font-display); font-weight:600;">0</span>
          </div>
          <div class="glass-card" style="text-align:center; padding:var(--space-4);">
            <h4 style="font-size:0.825rem; color:var(--text-secondary); margin-bottom:0.25rem;">Words</h4>
            <span id="word-count" style="font-size:1.75rem; font-family:var(--font-display); font-weight:600;">0</span>
          </div>
          <div class="glass-card" style="text-align:center; padding:var(--space-4);">
            <h4 style="font-size:0.825rem; color:var(--text-secondary); margin-bottom:0.25rem;">Sentences</h4>
            <span id="sentence-count" style="font-size:1.75rem; font-family:var(--font-display); font-weight:600;">0</span>
          </div>
          <div class="glass-card" style="text-align:center; padding:var(--space-4);">
            <h4 style="font-size:0.825rem; color:var(--text-secondary); margin-bottom:0.25rem;">Paragraphs</h4>
            <span id="para-count" style="font-size:1.75rem; font-family:var(--font-display); font-weight:600;">0</span>
          </div>
        </div>
      </section>
    </div>
  </main>

  <div id="site-footer" class="global-footer"></div>

  <script src="/assets/js/app.js" defer></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const textarea = document.getElementById('text-input');
      const charCount = document.getElementById('char-count');
      const wordCount = document.getElementById('word-count');
      const sentenceCount = document.getElementById('sentence-count');
      const paraCount = document.getElementById('para-count');
      const readTime = document.getElementById('read-time');

      function updateAnalytics() {
        const text = textarea.value;
        const chars = text.length;
        const words = text.trim() ? text.trim().split(/\s+/).length : 0;
        const sentences = text.trim() ? text.split(/[.!?]+/).filter(s => s.trim().length > 0).length : 0;
        const paragraphs = text.trim() ? text.split(/\n+/).filter(p => p.trim().length > 0).length : 0;
        
        charCount.textContent = chars;
        wordCount.textContent = words;
        sentenceCount.textContent = sentences;
        paraCount.textContent = paragraphs;

        // Reading time
        const readingTimeSeconds = Math.round((words / 200) * 60);
        if (readingTimeSeconds < 60) {
          readTime.textContent = `${readingTimeSeconds} sec`;
        } else {
          readTime.textContent = `${Math.floor(readingTimeSeconds / 60)} min ${readingTimeSeconds % 60} sec`;
        }
      }

      textarea.addEventListener('input', updateAnalytics);

      // Case conversions
      document.getElementById('btn-upper').addEventListener('click', () => {
        textarea.value = textarea.value.toUpperCase();
        updateAnalytics();
      });

      document.getElementById('btn-lower').addEventListener('click', () => {
        textarea.value = textarea.value.toLowerCase();
        updateAnalytics();
      });

      document.getElementById('btn-title').addEventListener('click', () => {
        textarea.value = textarea.value.replace(/\w\S*/g, (txt) => {
          return txt.charAt(0).toUpperCase() + txt.substr(1).toLowerCase();
        });
        updateAnalytics();
      });

      document.getElementById('btn-camel').addEventListener('click', () => {
        textarea.value = textarea.value.toLowerCase().replace(/[^a-zA-Z0-9]+(.)/g, (m, chr) => chr.toUpperCase());
        updateAnalytics();
      });

      document.getElementById('btn-kebab').addEventListener('click', () => {
        textarea.value = textarea.value.toLowerCase().trim().replace(/[\s_]+/g, '-').replace(/[^\w\-]+/g, '');
        updateAnalytics();
      });

      document.getElementById('btn-clear').addEventListener('click', () => {
        textarea.value = '';
        updateAnalytics();
      });

      document.getElementById('btn-copy').addEventListener('click', () => {
        navigator.clipboard.writeText(textarea.value).then(() => {
          const btn = document.getElementById('btn-copy');
          btn.textContent = 'Copied!';
          setTimeout(() => { btn.textContent = 'Copy Text'; }, 1500);
        });
      });
    });
  </script>
</body>
</html>
