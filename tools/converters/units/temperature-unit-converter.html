<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="/assets/css/main.css">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Temperature Converter | Bluetext.in</title>
  <meta name="description" content="Convert temperatures between Celsius, Fahrenheit, Kelvin, and Rankine instantly.">
  
</head>
<body>
  <div id="site-header"></div>
  <main class="doc-page" role="main">
    <p class="doc-page__back"><a href="../../../index.html">Back to home</a></p>
    <h1>Temperature Converter</h1>
    <p>Convert temperatures between Celsius, Fahrenheit, Kelvin, and Rankine.</p>

    <section class="panel">
      <form id="temp-form" class="tool-form" novalidate>
        <div class="tool-grid-2">
          <label>
            Value
            <input id="temp-val" type="number" step="any" placeholder="e.g. 100" autocomplete="off">
          </label>
          <label>
            From unit
            <select id="temp-from">
              <option value="C">Celsius (°C)</option>
              <option value="F">Fahrenheit (°F)</option>
              <option value="K">Kelvin (K)</option>
              <option value="R">Rankine (°R)</option>
            </select>
          </label>
        </div>
        <div class="tool-actions">
          <button class="btn btn--primary" type="submit">Convert</button>
          <button class="btn btn--ghost" type="reset">Clear</button>
        </div>
      </form>
    </section>

    <section class="tool-output" aria-live="polite">
      <p id="temp-error"></p>
      <div class="tool-grid-2" id="temp-results"></div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script>
    // Convert any unit to Celsius first, then to all others
    function toCelsius(v, from) {
      switch (from) {
        case "C": return v;
        case "F": return (v - 32) * 5 / 9;
        case "K": return v - 273.15;
        case "R": return (v - 491.67) * 5 / 9;
      }
    }
    function fromCelsius(c, to) {
      switch (to) {
        case "C": return c;
        case "F": return c * 9 / 5 + 32;
        case "K": return c + 273.15;
        case "R": return (c + 273.15) * 9 / 5;
      }
    }

    const UNITS = [
      { id: "C", label: "Celsius (°C)" },
      { id: "F", label: "Fahrenheit (°F)" },
      { id: "K", label: "Kelvin (K)" },
      { id: "R", label: "Rankine (°R)" },
    ];

    const form = document.querySelector("#temp-form");
    const errorEl = document.querySelector("#temp-error");
    const resultsEl = document.querySelector("#temp-results");

    form.addEventListener("submit", e => {
      e.preventDefault();
      errorEl.textContent = "";
      resultsEl.innerHTML = "";
      const raw = document.querySelector("#temp-val").value;
      const from = document.querySelector("#temp-from").value;
      const v = Number(raw);
      if (raw === "" || isNaN(v)) { errorEl.textContent = "Enter a valid number."; return; }

      const celsius = toCelsius(v, from);

      UNITS.forEach(({ id, label }) => {
        const result = fromCelsius(celsius, id);
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `<p>${label}</p><p>${result.toFixed(4)}</p>`;
        resultsEl.appendChild(card);
      });
    });

    form.addEventListener("reset", () => { errorEl.textContent = ""; resultsEl.innerHTML = ""; });

    // Live convert as user types
    document.querySelector("#temp-val").addEventListener("input", () => form.requestSubmit && form.requestSubmit());
  </script>
  <script src="/assets/js/partials.js"></script>
</body>
</html>
