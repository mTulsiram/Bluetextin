<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CSV to JSON Converter | Bluetext.in</title>
  <meta name="description" content="Convert CSV data to JSON format instantly in your browser.">
  <link rel="stylesheet" href="../../../assets/css/main.css">
</head>
<body>
  <div id="site-header"></div>
  <main class="doc-page" role="main">
    <p class="doc-page__back"><a href="../../../index.html">Back to home</a></p>
    <h1>CSV to JSON Converter</h1>
    <p>Paste CSV data (first row as headers) and convert it to a JSON array.</p>

    <section class="panel">
      <div class="tool-form">
        <label class="search__label" for="csv-input">CSV input</label>
        <textarea id="csv-input" rows="10" class="mono" style="width:100%;border:1px solid var(--stroke);border-radius:var(--radius-sm);padding:0.65rem 0.75rem;font:inherit;resize:vertical;" placeholder="name,age,city&#10;Alice,30,Delhi&#10;Bob,25,Mumbai"></textarea>
        <label style="margin-top:0.5rem;display:flex;align-items:center;gap:0.5rem;font-size:0.9rem;">
          <input id="has-header" type="checkbox" checked>
          First row is header
        </label>
      </div>
      <div class="tool-actions" style="margin-top:0.75rem;">
        <button id="btn-convert" class="btn btn--primary" type="button">Convert to JSON</button>
        <button id="btn-copy" class="btn btn--ghost" type="button">Copy JSON</button>
        <button id="btn-clear" class="btn btn--ghost" type="button">Clear</button>
      </div>
    </section>

    <section class="tool-output" aria-live="polite">
      <p id="csv-status" style="margin:0 0 0.6rem;font-weight:600;"></p>
      <pre id="csv-output" class="mono" style="overflow:auto;white-space:pre-wrap;max-height:400px;"></pre>
    </section>
  </main>
  <div id="site-footer"></div>
  <script>
    const inputEl = document.querySelector("#csv-input");
    const outputEl = document.querySelector("#csv-output");
    const statusEl = document.querySelector("#csv-status");
    const hasHeaderEl = document.querySelector("#has-header");

    function parseCSV(text) {
      const lines = text.trim().split(/\r?\n/);
      const results = [];
      lines.forEach((line, idx) => {
        const cols = [];
        let inQuotes = false, col = "";
        for (let i = 0; i < line.length; i++) {
          const c = line[i];
          if (c === '"') { inQuotes = !inQuotes; continue; }
          if (c === "," && !inQuotes) { cols.push(col); col = ""; continue; }
          col += c;
        }
        cols.push(col);
        results.push(cols);
      });
      return results;
    }

    document.querySelector("#btn-convert").addEventListener("click", () => {
      const text = inputEl.value.trim();
      outputEl.textContent = "";
      statusEl.textContent = "";
      if (!text) { statusEl.textContent = "Paste CSV data first."; return; }

      const rows = parseCSV(text);
      const hasHeader = hasHeaderEl.checked;
      let headers, dataRows;

      if (hasHeader && rows.length > 0) {
        headers = rows[0];
        dataRows = rows.slice(1);
      } else {
        headers = rows[0].map((_, i) => `col${i + 1}`);
        dataRows = rows;
      }

      const result = dataRows.map((row) => {
        const obj = {};
        headers.forEach((h, i) => { obj[h.trim()] = (row[i] || "").trim(); });
        return obj;
      });

      outputEl.textContent = JSON.stringify(result, null, 2);
      statusEl.textContent = `Converted ${result.length} row${result.length !== 1 ? "s" : ""}.`;
    });

    document.querySelector("#btn-copy").addEventListener("click", () => {
      if (!outputEl.textContent) return;
      navigator.clipboard.writeText(outputEl.textContent).then(() => { statusEl.textContent = "Copied."; });
    });

    document.querySelector("#btn-clear").addEventListener("click", () => {
      inputEl.value = "";
      outputEl.textContent = "";
      statusEl.textContent = "";
    });
  </script>
  <script src="/assets/js/partials.js"></script>
</body>
</html>
