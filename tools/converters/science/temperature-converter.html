<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="/assets/css/main.css">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Temperature Converter | Bluetext.in</title>
  <meta name="description" content="Convert temperature between Celsius, Fahrenheit, and Kelvin.">
  
</head>
<body>
  <div id="site-header"></div>
  <main class="doc-page" role="main">
    <p class="doc-page__back"><a href="../../../index.html">Back to home</a></p>
    <h1>Temperature Converter</h1>
    <p>Convert values instantly between Celsius, Fahrenheit, and Kelvin.</p>

    <section class="panel">
      <form id="temp-form" class="tool-form" novalidate>
        <div class="tool-grid-2">
          <label>
            Input value
            <input id="temp-value" type="number" step="any" placeholder="e.g. 25" required>
          </label>
          <label>
            From unit
            <select id="temp-from">
              <option value="C">Celsius (C)</option>
              <option value="F">Fahrenheit (F)</option>
              <option value="K">Kelvin (K)</option>
            </select>
          </label>
        </div>

        <label>
          To unit
          <select id="temp-to">
            <option value="F">Fahrenheit (F)</option>
            <option value="C">Celsius (C)</option>
            <option value="K">Kelvin (K)</option>
          </select>
        </label>

        <div class="tool-actions">
          <button class="btn btn--primary" type="submit">Convert</button>
          <button class="btn btn--ghost" type="reset">Reset</button>
        </div>
      </form>
    </section>

    <section class="tool-output" aria-live="polite">
      <p id="temp-result">Enter a value and choose units to convert.</p>
    </section>
  </main>

  <script>
    const form = document.querySelector("#temp-form");
    const valueInput = document.querySelector("#temp-value");
    const fromInput = document.querySelector("#temp-from");
    const toInput = document.querySelector("#temp-to");
    const result = document.querySelector("#temp-result");

    function toCelsius(value, from) {
      if (from === "C") return value;
      if (from === "F") return (value - 32) * (5 / 9);
      return value - 273.15;
    }

    function fromCelsius(value, to) {
      if (to === "C") return value;
      if (to === "F") return value * (9 / 5) + 32;
      return value + 273.15;
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const value = Number(valueInput.value);
      if (!Number.isFinite(value)) {
        result.textContent = "Please enter a valid temperature value.";
        return;
      }

      const celsius = toCelsius(value, fromInput.value);
      const converted = fromCelsius(celsius, toInput.value);
      result.textContent = `${value.toFixed(2)} ${fromInput.value} = ${converted.toFixed(2)} ${toInput.value}`;
    });

    form.addEventListener("reset", () => {
      result.textContent = "Enter a value and choose units to convert.";
    });
  </script>
  <div id="site-footer"></div>
  <script src="/assets/js/partials.js"></script>
</body>
</html>
