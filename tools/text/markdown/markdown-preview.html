<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="/assets/css/main.css">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Markdown Preview | Bluetext.in</title>
  <meta name="description" content="Write Markdown and see a live HTML preview instantly in your browser.">
</head>
<body>
  <div id="site-header"></div>
  <main class="doc-page" role="main">
    <p class="doc-page__back"><a href="../../../index.html">Back to home</a></p>
    <h1>Markdown Preview</h1>
    <p>Write Markdown on the left and see a live rendered preview on the right.</p>

    <section class="panel">
      <div id="md-grid">
        <div>
          <p>Markdown</p>
          <textarea id="md-input" rows="20" class="mono" placeholder="# Hello world&#10;&#10;Write **Markdown** here..."></textarea>
        </div>
        <div>
          <p>Preview</p>
          <div id="md-preview"></div>
        </div>
      </div>
      <div class="tool-actions">
        <button id="copy-html" class="btn btn--ghost" type="button">Copy HTML</button>
        <button id="btn-clear" class="btn btn--ghost" type="button">Clear</button>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script>
    const inputEl = document.querySelector("#md-input");
    const previewEl = document.querySelector("#md-preview");

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function renderInline(text) {
      let out = escapeHtml(text);
      out = out.replace(/`([^`]+)`/g, "<code>$1</code>");
      out = out.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      out = out.replace(/\*([^*]+)\*/g, "<em>$1</em>");
      out = out.replace(/\[([^\]]+)\]\(([^)]+)\)/g, "<a href=\"$2\" target=\"_blank\" rel=\"noopener noreferrer\">$1</a>");
      return out;
    }

    function renderMarkdown(mdText) {
      const lines = mdText.replace(/\r/g, "").split("\n");
      const html = [];
      let inList = false;

      const closeList = () => {
        if (inList) {
          html.push("</ul>");
          inList = false;
        }
      };

      for (const line of lines) {
        if (/^\s*$/.test(line)) {
          closeList();
          continue;
        }

        const heading = line.match(/^(#{1,6})\s+(.+)$/);
        if (heading) {
          closeList();
          const level = heading[1].length;
          html.push(`<h${level}>${renderInline(heading[2])}</h${level}>`);
          continue;
        }

        const listItem = line.match(/^\s*[-*]\s+(.+)$/);
        if (listItem) {
          if (!inList) {
            html.push("<ul>");
            inList = true;
          }
          html.push(`<li>${renderInline(listItem[1])}</li>`);
          continue;
        }

        closeList();
        html.push(`<p>${renderInline(line)}</p>`);
      }

      closeList();
      return html.join("\n");
    }

    // Responsive: stack on small screens
    if (window.innerWidth < 640) {
      document.querySelector("#md-grid").style.gridTemplateColumns = "1fr";
    }

    function render() {
      previewEl.innerHTML = renderMarkdown(inputEl.value);
    }

    inputEl.addEventListener("input", render);

    document.querySelector("#copy-html").addEventListener("click", () => {
      navigator.clipboard.writeText(renderMarkdown(inputEl.value)).then(() => {});
    });

    document.querySelector("#btn-clear").addEventListener("click", () => {
      inputEl.value = "";
      previewEl.innerHTML = "";
    });

    render();
  </script>
  <script src="/assets/js/partials.js"></script>
</body>
</html>
