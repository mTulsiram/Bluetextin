<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="/assets/css/main.css">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Title Case Converter | Bluetext.in</title>
  <meta name="description" content="Convert text to Title Case instantly. Also supports lowercase, UPPERCASE, camelCase, and more.">
  
</head>
<body>
  <div id="site-header"></div>
  <main class="doc-page" role="main">
    <p class="doc-page__back"><a href="../../../index.html">Back to home</a></p>
    <h1>Title Case Converter</h1>
    <p>Convert your text to Title Case — every word capitalised. Switch between any case format below.</p>

    <section class="panel">
      <div class="tool-form">
        <label class="search__label" for="case-input">Your text</label>
        <textarea id="case-input" rows="8" placeholder="Type or paste text here..."></textarea>
      </div>
      <div class="tool-actions">
        <button data-case="title" class="btn btn--primary" type="button">Title Case</button>
        <button data-case="lower" class="btn btn--ghost" type="button">lowercase</button>
        <button data-case="upper" class="btn btn--ghost" type="button">UPPERCASE</button>
        <button data-case="sentence" class="btn btn--ghost" type="button">Sentence case</button>
        <button data-case="camel" class="btn btn--ghost" type="button">camelCase</button>
        <button data-case="kebab" class="btn btn--ghost" type="button">kebab-case</button>
        <button id="copy-btn" class="btn btn--ghost" type="button">Copy</button>
      </div>
    </section>

    <section class="tool-output" aria-live="polite">
      <p id="case-status"></p>
      <textarea id="case-output" rows="8" readonly placeholder="Output..."></textarea>
    </section>
  </main>
  <div id="site-footer"></div>
  <script>
    const inputEl = document.querySelector("#case-input");
    const outputEl = document.querySelector("#case-output");
    const statusEl = document.querySelector("#case-status");
    const transforms = {
      upper: s => s.toUpperCase(),
      lower: s => s.toLowerCase(),
      title: s => s.replace(/\w\S*/g, w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()),
      sentence: s => s.charAt(0).toUpperCase() + s.slice(1).toLowerCase(),
      camel: s => s.trim().toLowerCase().split(/[\s_\-]+/).map((w, i) => i === 0 ? w : w.charAt(0).toUpperCase() + w.slice(1)).join(""),
      kebab: s => s.trim().toLowerCase().split(/[\s_]+/).join("-"),
    };
    document.querySelectorAll("[data-case]").forEach(btn => {
      btn.addEventListener("click", () => {
        outputEl.value = transforms[btn.dataset.case](inputEl.value);
        statusEl.textContent = "Converted to " + btn.textContent + ".";
      });
    });
    document.querySelector("#copy-btn").addEventListener("click", () => {
      if (!outputEl.value) return;
      navigator.clipboard.writeText(outputEl.value).then(() => { statusEl.textContent = "Copied."; });
    });
  </script>
  <script src="/assets/js/partials.js"></script>
</body>
</html>
