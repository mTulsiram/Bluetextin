<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Text Case Converter | Bluetext.in</title>
  <meta name="description" content="Convert text to UPPERCASE, lowercase, Title Case, Sentence case, and more.">
  <link rel="stylesheet" href="../../../assets/css/main.css">
</head>
<body>
  <div id="site-header"></div>
  <main class="doc-page" role="main">
    <p class="doc-page__back"><a href="../../../index.html">Back to home</a></p>
    <h1>Text Case Converter</h1>
    <p>Transform your text to any common case format instantly.</p>

    <section class="panel">
      <div class="tool-form">
        <label class="search__label" for="case-input">Your text</label>
        <textarea id="case-input" rows="7" style="width:100%;border:1px solid var(--stroke);border-radius:var(--radius-sm);padding:0.65rem 0.75rem;font:inherit;resize:vertical;" placeholder="Type or paste text here..."></textarea>
      </div>
      <div class="tool-actions" style="margin-top:0.75rem;flex-wrap:wrap;">
        <button data-case="upper" class="btn btn--primary" type="button">UPPERCASE</button>
        <button data-case="lower" class="btn btn--ghost" type="button">lowercase</button>
        <button data-case="title" class="btn btn--ghost" type="button">Title Case</button>
        <button data-case="sentence" class="btn btn--ghost" type="button">Sentence case</button>
        <button data-case="camel" class="btn btn--ghost" type="button">camelCase</button>
        <button data-case="snake" class="btn btn--ghost" type="button">snake_case</button>
        <button data-case="kebab" class="btn btn--ghost" type="button">kebab-case</button>
        <button id="copy-btn" class="btn btn--ghost" type="button">Copy</button>
      </div>
    </section>

    <section class="tool-output" aria-live="polite">
      <p id="case-status" style="margin:0 0 0.6rem;font-weight:600;"></p>
      <textarea id="case-output" rows="7" readonly style="width:100%;border:1px solid var(--stroke);border-radius:var(--radius-sm);padding:0.65rem 0.75rem;font:inherit;resize:vertical;background:var(--surface-soft);" placeholder="Output will appear here..."></textarea>
    </section>
  </main>
  <div id="site-footer"></div>
  <script>
    const inputEl = document.querySelector("#case-input");
    const outputEl = document.querySelector("#case-output");
    const statusEl = document.querySelector("#case-status");

    function titleCase(str) {
      return str.replace(/\w\S*/g, (w) => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase());
    }
    function sentenceCase(str) {
      return str.charAt(0).toUpperCase() + str.slice(1).toLowerCase();
    }
    function camelCase(str) {
      return str.trim().toLowerCase().split(/[\s_\-]+/).map((w, i) => i === 0 ? w : w.charAt(0).toUpperCase() + w.slice(1)).join("");
    }
    function snakeCase(str) {
      return str.trim().toLowerCase().split(/[\s\-]+/).join("_");
    }
    function kebabCase(str) {
      return str.trim().toLowerCase().split(/[\s_]+/).join("-");
    }

    const transforms = {
      upper: (s) => s.toUpperCase(),
      lower: (s) => s.toLowerCase(),
      title: titleCase,
      sentence: sentenceCase,
      camel: camelCase,
      snake: snakeCase,
      kebab: kebabCase,
    };

    document.querySelectorAll("[data-case]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const text = inputEl.value;
        const fn = transforms[btn.dataset.case];
        outputEl.value = fn(text);
        statusEl.textContent = `Converted to ${btn.textContent}.`;
      });
    });

    document.querySelector("#copy-btn").addEventListener("click", () => {
      if (!outputEl.value) return;
      navigator.clipboard.writeText(outputEl.value).then(() => { statusEl.textContent = "Copied."; });
    });
  </script>
  <script src="/assets/js/partials.js"></script>
</body>
</html>
