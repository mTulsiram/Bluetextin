<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="/assets/css/main.css">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Character Counter | Bluetext.in</title>
  <meta name="description" content="Count characters with and without spaces, and track limits for social media posts.">
  
</head>
<body>
  <div id="site-header"></div>
  <main class="doc-page" role="main">
    <p class="doc-page__back"><a href="../../../index.html">Back to home</a></p>
    <h1>Character Counter</h1>
    <p>Count characters and track limits for Twitter/X, LinkedIn, and SMS.</p>

    <section class="panel">
      <div class="tool-form">
        <label class="search__label" for="text-input">Your text</label>
        <textarea id="text-input" rows="8" placeholder="Type or paste text here..."></textarea>
      </div>
    </section>

    <section class="tool-output" aria-live="polite">
      <div class="tool-grid-2">
        <div class="card"><h3 id="stat-chars">0</h3><p>Characters (with spaces)</p></div>
        <div class="card"><h3 id="stat-no-space">0</h3><p>Characters (no spaces)</p></div>
        <div class="card"><h3 id="stat-words">0</h3><p>Words</p></div>
        <div class="card"><h3 id="stat-lines">0</h3><p>Lines</p></div>
      </div>
      <p>Platform limits</p>
      <div id="limits"></div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script>
    const LIMITS = [
      { name: "Twitter/X post", max: 280 },
      { name: "LinkedIn post", max: 3000 },
      { name: "SMS (1 message)", max: 160 },
      { name: "Meta description", max: 160 },
      { name: "Page title", max: 60 },
    ];

    const inputEl = document.querySelector("#text-input");
    const charsEl = document.querySelector("#stat-chars");
    const noSpaceEl = document.querySelector("#stat-no-space");
    const wordsEl = document.querySelector("#stat-words");
    const linesEl = document.querySelector("#stat-lines");
    const limitsEl = document.querySelector("#limits");

    // build limit bars
    LIMITS.forEach((lim) => {
      const bar = document.createElement("div");
      bar.style.cssText = "background:var(--surface-soft);border:1px solid var(--stroke);border-radius:var(--radius-sm);padding:0.5rem 0.75rem;";
      bar.innerHTML = `<div>
        <span>${lim.name}</span>
        <span id="lim-${lim.max}">0 / ${lim.max}</span>
      </div>
      <div>
        <div id="bar-${lim.max}"></div>
      </div>`;
      limitsEl.appendChild(bar);
    });

    function update() {
      const text = inputEl.value;
      const chars = text.length;
      const noSpace = text.replace(/\s/g, "").length;
      const words = text.trim() === "" ? 0 : text.trim().split(/\s+/).length;
      const lines = text === "" ? 0 : text.split(/\n/).length;

      charsEl.textContent = chars.toLocaleString("en-IN");
      noSpaceEl.textContent = noSpace.toLocaleString("en-IN");
      wordsEl.textContent = words.toLocaleString("en-IN");
      linesEl.textContent = lines.toLocaleString("en-IN");

      LIMITS.forEach((lim) => {
        const pct = Math.min(100, (chars / lim.max) * 100);
        const over = chars > lim.max;
        document.querySelector(`#lim-${lim.max}`).textContent = `${chars} / ${lim.max}`;
        document.querySelector(`#bar-${lim.max}`).style.background = over ? "#e11d48" : "var(--accent)";
        document.querySelector(`#bar-${lim.max}`).style.width = pct + "%";
      });
    }

    inputEl.addEventListener("input", update);
  </script>
  <script src="/assets/js/partials.js"></script>
</body>
</html>
