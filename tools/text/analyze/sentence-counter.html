<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sentence Counter | Bluetext.in</title>
  <meta name="description" content="Count sentences, words, characters, and estimate reading time for any text.">
  <link rel="stylesheet" href="../../../assets/css/main.css">
</head>
<body>
  <div id="site-header"></div>
  <main class="doc-page" role="main">
    <p class="doc-page__back"><a href="../../../index.html">Back to home</a></p>
    <h1>Sentence Counter</h1>
    <p>Paste your text to count sentences, words, characters, and estimate reading time.</p>

    <section class="panel">
      <div class="tool-form">
        <label class="search__label" for="text-input">Your text</label>
        <textarea id="text-input" rows="10" style="width:100%;border:1px solid var(--stroke);border-radius:var(--radius-sm);padding:0.65rem 0.75rem;font:inherit;resize:vertical;" placeholder="Type or paste text here..."></textarea>
      </div>
    </section>

    <section class="tool-output" aria-live="polite">
      <div class="tool-grid-2" style="gap:0.6rem;">
        <div class="card"><h3 id="stat-sentences">0</h3><p>Sentences</p></div>
        <div class="card"><h3 id="stat-words">0</h3><p>Words</p></div>
        <div class="card"><h3 id="stat-chars">0</h3><p>Characters</p></div>
        <div class="card"><h3 id="stat-paragraphs">0</h3><p>Paragraphs</p></div>
        <div class="card"><h3 id="stat-read-time">0 min</h3><p>Reading time (~200 wpm)</p></div>
        <div class="card"><h3 id="stat-speak-time">0 min</h3><p>Speaking time (~130 wpm)</p></div>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script>
    const inputEl = document.querySelector("#text-input");

    function update() {
      const text = inputEl.value;
      const words = text.trim() === "" ? 0 : text.trim().split(/\s+/).length;
      const sentences = text.trim() === "" ? 0 : (text.match(/[^.!?]*[.!?]+/g) || [text.trim()]).length;
      const chars = text.length;
      const paragraphs = text.trim() === "" ? 0 : text.split(/\n\s*\n/).filter(p => p.trim()).length || (text.trim() ? 1 : 0);

      document.querySelector("#stat-sentences").textContent = sentences.toLocaleString("en-IN");
      document.querySelector("#stat-words").textContent = words.toLocaleString("en-IN");
      document.querySelector("#stat-chars").textContent = chars.toLocaleString("en-IN");
      document.querySelector("#stat-paragraphs").textContent = paragraphs.toLocaleString("en-IN");
      document.querySelector("#stat-read-time").textContent = Math.ceil(words / 200) + " min";
      document.querySelector("#stat-speak-time").textContent = Math.ceil(words / 130) + " min";
    }

    inputEl.addEventListener("input", update);
  </script>
  <script src="/assets/js/partials.js"></script>
</body>
</html>
