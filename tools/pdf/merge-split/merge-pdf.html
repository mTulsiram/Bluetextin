<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Merge PDF | Bluetext.in</title>
	<meta name="description" content="Merge multiple PDF files into one document directly in your browser.">
	<link rel="stylesheet" href="../../../assets/css/main.css">
</head>
<body>
  <div id="site-header"></div>
	<main class="doc-page" role="main">
		<p class="doc-page__back"><a href="../../../index.html">Back to home</a></p>
		<h1>Merge PDF</h1>
		<p>Select two or more PDF files and merge them in your browser.</p>

		<section class="panel">
			<form id="merge-form" class="tool-form">
				<label>
					Choose PDF files
					<input id="pdf-files" type="file" accept="application/pdf" multiple required>
				</label>

				<div class="tool-actions">
					<button class="btn btn--primary" type="submit">Merge and Download</button>
					<button class="btn btn--ghost" type="reset">Reset</button>
				</div>
			</form>
		</section>

		<section class="tool-output" aria-live="polite">
			<p id="merge-status">Select PDF files to begin.</p>
		</section>
	</main>

	<script src="https://cdn.jsdelivr.net/npm/pdf-lib/dist/pdf-lib.min.js"></script>
	<script>
		const form = document.querySelector("#merge-form");
		const filesInput = document.querySelector("#pdf-files");
		const status = document.querySelector("#merge-status");

		form.addEventListener("submit", async (event) => {
			event.preventDefault();

			const files = Array.from(filesInput.files || []);
			if (files.length < 2) {
				status.textContent = "Please choose at least two PDF files.";
				return;
			}

			if (!window.PDFLib) {
				status.textContent = "PDF engine failed to load. Check network access and try again.";
				return;
			}

			try {
				status.textContent = "Merging PDFs...";
				const { PDFDocument } = window.PDFLib;
				const mergedDoc = await PDFDocument.create();

				for (const file of files) {
					const bytes = await file.arrayBuffer();
					const doc = await PDFDocument.load(bytes);
					const pages = await mergedDoc.copyPages(doc, doc.getPageIndices());
					pages.forEach((page) => mergedDoc.addPage(page));
				}

				const mergedBytes = await mergedDoc.save();
				const blob = new Blob([mergedBytes], { type: "application/pdf" });
				const url = URL.createObjectURL(blob);
				const link = document.createElement("a");
				link.href = url;
				link.download = "merged.pdf";
				link.click();
				URL.revokeObjectURL(url);
				status.textContent = `Merged ${files.length} files successfully.`;
			} catch (error) {
				console.error(error);
				status.textContent = "Could not merge these files. Ensure all selected files are valid PDFs.";
			}
		});

		form.addEventListener("reset", () => {
			status.textContent = "Select PDF files to begin.";
		});
	</script>
  <div id="site-footer"></div>
  <script src="/assets/js/partials.js"></script>
</body>
</html>
