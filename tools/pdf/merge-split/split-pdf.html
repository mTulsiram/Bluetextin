<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Split PDF | Bluetext.in</title>
  <meta name="description" content="Split a PDF by page ranges or extract individual pages — runs entirely in your browser.">
  <link rel="stylesheet" href="../../../assets/css/main.css">
  <script src="https://cdn.jsdelivr.net/npm/pdf-lib/dist/pdf-lib.min.js"></script>
</head>
<body>
  <div id="site-header"></div>
  <main class="doc-page" role="main">
    <p class="doc-page__back"><a href="../../../index.html">Back to home</a></p>
    <h1>Split PDF</h1>
    <p>Upload a PDF and extract specific pages or page ranges into a new file. No server — runs 100% in browser.</p>

    <section class="panel">
      <form id="split-form" class="tool-form" novalidate>
        <label>Upload PDF<input id="pdf-file" type="file" accept="application/pdf" required></label>
        <p id="page-count" style="color:var(--text-soft);font-size:0.9rem;margin:0.25rem 0 0;"></p>
        <label style="margin-top:0.75rem;">
          Pages to extract <span style="color:#888;font-size:0.8rem;">(e.g. 1, 3-5, 7)</span>
          <input id="page-range" type="text" placeholder="e.g. 1, 3-5, 7" required>
        </label>
        <div class="tool-actions">
          <button id="btn-split" class="btn btn--primary" type="submit" disabled>Extract Pages</button>
        </div>
      </form>
    </section>

    <section class="tool-output" aria-live="polite">
      <p id="split-status">Upload a PDF to begin.</p>
    </section>
  </main>
  <div id="site-footer"></div>
  <script>
    const fileInput = document.querySelector("#pdf-file");
    const pageCountEl = document.querySelector("#page-count");
    const btnSplit = document.querySelector("#btn-split");
    const statusEl = document.querySelector("#split-status");
    let pdfBytes = null;
    let totalPages = 0;

    fileInput.addEventListener("change", async () => {
      const file = fileInput.files && fileInput.files[0];
      if (!file) return;
      statusEl.textContent = "Reading PDF…";
      try {
        pdfBytes = await file.arrayBuffer();
        const { PDFDocument } = PDFLib;
        const doc = await PDFDocument.load(pdfBytes);
        totalPages = doc.getPageCount();
        pageCountEl.textContent = `PDF has ${totalPages} page${totalPages !== 1 ? "s" : ""}.`;
        statusEl.textContent = `${file.name} — ${(file.size / 1024).toFixed(1)} KB`;
        btnSplit.disabled = false;
      } catch {
        statusEl.textContent = "Could not read the PDF. Make sure it is not password-protected.";
      }
    });

    function parseRanges(rangeStr, total) {
      const pages = new Set();
      const parts = rangeStr.split(",");
      for (const part of parts) {
        const t = part.trim();
        const match = t.match(/^(\d+)(?:-(\d+))?$/);
        if (!match) return null;
        const from = Number(match[1]);
        const to = match[2] ? Number(match[2]) : from;
        if (from < 1 || to > total || from > to) return null;
        for (let i = from; i <= to; i++) pages.add(i);
      }
      return [...pages].sort((a, b) => a - b);
    }

    document.querySelector("#split-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const rangeStr = document.querySelector("#page-range").value;
      const pages = parseRanges(rangeStr, totalPages);
      if (!pages || pages.length === 0) {
        statusEl.textContent = `Invalid page range. Enter numbers between 1 and ${totalPages}.`;
        return;
      }

      statusEl.textContent = `Extracting ${pages.length} page${pages.length !== 1 ? "s" : ""}…`;
      btnSplit.disabled = true;

      try {
        const { PDFDocument } = PDFLib;
        const srcDoc = await PDFDocument.load(pdfBytes);
        const newDoc = await PDFDocument.create();
        const copied = await newDoc.copyPages(srcDoc, pages.map(p => p - 1));
        copied.forEach(page => newDoc.addPage(page));

        const bytes = await newDoc.save();
        const blob = new Blob([bytes], { type: "application/pdf" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = "extracted-pages.pdf";
        link.click();
        statusEl.textContent = `Done! Extracted pages: ${pages.join(", ")}.`;
      } catch (err) {
        statusEl.textContent = "Split failed: " + err.message;
      } finally {
        btnSplit.disabled = false;
      }
    });
  </script>
  <script src="/assets/js/partials.js"></script>
</body>
</html>
