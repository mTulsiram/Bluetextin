<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="/assets/css/main.css">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF Viewer | Bluetext.in</title>
  <meta name="description" content="View any PDF file directly in your browser without installing software.">
  
</head>
<body>
  <div id="site-header"></div>
  <main class="doc-page" role="main">
    <p class="doc-page__back"><a href="../../../index.html">Back to home</a></p>
    <h1>PDF Viewer</h1>
    <p>Upload a PDF and view it directly in your browser. Files stay on your device.</p>

    <section class="panel">
      <div class="tool-form">
        <label>Upload PDF<input id="pdf-file" type="file" accept="application/pdf"></label>
      </div>
    </section>

    <section class="tool-output" aria-live="polite">
      <p id="pdf-status">Upload a PDF to view it.</p>
      <div id="pdf-container">
        <iframe id="pdf-frame" title="PDF Viewer"></iframe>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script>
    const fileInput = document.querySelector("#pdf-file");
    const statusEl = document.querySelector("#pdf-status");
    const container = document.querySelector("#pdf-container");
    const frame = document.querySelector("#pdf-frame");
    let currentUrl = null;

    fileInput.addEventListener("change", () => {
      const file = fileInput.files && fileInput.files[0];
      if (!file) return;
      if (currentUrl) URL.revokeObjectURL(currentUrl);
      currentUrl = URL.createObjectURL(file);
      frame.src = currentUrl;
      container.style.display = "block";
      statusEl.textContent = `${file.name} — ${(file.size / 1024).toFixed(1)} KB`;
    });
  </script>
  <script src="/assets/js/partials.js"></script>
</body>
</html>
