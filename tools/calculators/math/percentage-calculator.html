<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="/assets/css/main.css">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Percentage Calculator | Bluetext.in</title>
  <meta name="description" content="Calculate percentages, percentage change, and percentage of a value.">
  
</head>
<body>
  <div id="site-header"></div>
  <main class="doc-page" role="main">
    <p class="doc-page__back"><a href="../../../index.html">Back to home</a></p>
    <h1>Percentage Calculator</h1>
    <p>Three common percentage calculations in one place.</p>

    <section class="panel">
      <div class="panel__head"><h2>What is X% of Y?</h2></div>
      <form id="form-of" class="tool-form" novalidate>
        <div class="tool-grid-2">
          <label>Percentage (X)<input id="of-x" type="number" step="any" placeholder="e.g. 15"></label>
          <label>Value (Y)<input id="of-y" type="number" step="any" placeholder="e.g. 200"></label>
        </div>
        <div class="tool-actions"><button class="btn btn--primary" type="submit">Calculate</button></div>
      </form>
      <p id="of-result" class="tool-output"></p>
    </section>

    <section class="panel">
      <div class="panel__head"><h2>X is what % of Y?</h2></div>
      <form id="form-what" class="tool-form" novalidate>
        <div class="tool-grid-2">
          <label>Value (X)<input id="what-x" type="number" step="any" placeholder="e.g. 30"></label>
          <label>Total (Y)<input id="what-y" type="number" step="any" placeholder="e.g. 200"></label>
        </div>
        <div class="tool-actions"><button class="btn btn--primary" type="submit">Calculate</button></div>
      </form>
      <p id="what-result" class="tool-output"></p>
    </section>

    <section class="panel">
      <div class="panel__head"><h2>Percentage Change</h2></div>
      <form id="form-change" class="tool-form" novalidate>
        <div class="tool-grid-2">
          <label>From<input id="change-from" type="number" step="any" placeholder="e.g. 80"></label>
          <label>To<input id="change-to" type="number" step="any" placeholder="e.g. 100"></label>
        </div>
        <div class="tool-actions"><button class="btn btn--primary" type="submit">Calculate</button></div>
      </form>
      <p id="change-result" class="tool-output"></p>
    </section>
  </main>
  <div id="site-footer"></div>
  <script>
    document.querySelector("#form-of").addEventListener("submit", (e) => {
      e.preventDefault();
      const x = Number(document.querySelector("#of-x").value);
      const y = Number(document.querySelector("#of-y").value);
      document.querySelector("#of-result").textContent =
        Number.isFinite(x) && Number.isFinite(y) ? `${x}% of ${y} = ${(x / 100 * y).toFixed(4)}` : "Enter valid values.";
    });

    document.querySelector("#form-what").addEventListener("submit", (e) => {
      e.preventDefault();
      const x = Number(document.querySelector("#what-x").value);
      const y = Number(document.querySelector("#what-y").value);
      document.querySelector("#what-result").textContent =
        Number.isFinite(x) && Number.isFinite(y) && y !== 0 ? `${x} is ${(x / y * 100).toFixed(4)}% of ${y}` : "Enter valid values (Y cannot be 0).";
    });

    document.querySelector("#form-change").addEventListener("submit", (e) => {
      e.preventDefault();
      const from = Number(document.querySelector("#change-from").value);
      const to = Number(document.querySelector("#change-to").value);
      if (!Number.isFinite(from) || !Number.isFinite(to) || from === 0) {
        document.querySelector("#change-result").textContent = "Enter valid values (From cannot be 0).";
        return;
      }
      const change = ((to - from) / Math.abs(from)) * 100;
      document.querySelector("#change-result").textContent = `Change: ${change >= 0 ? "+" : ""}${change.toFixed(4)}%`;
    });
  </script>
  <script src="/assets/js/partials.js"></script>
</body>
</html>
