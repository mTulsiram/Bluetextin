<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Speed Calculator | Bluetext.in</title>
  <meta name="description" content="Calculate speed, distance, or time given the other two values.">
  <link rel="stylesheet" href="../../../assets/css/main.css">
</head>
<body>
  <div id="site-header"></div>
  <main class="doc-page" role="main">
    <p class="doc-page__back"><a href="../../../index.html">Back to home</a></p>
    <h1>Speed Calculator</h1>
    <p>Enter any two of Speed, Distance, or Time to calculate the third.</p>

    <section class="panel">
      <form id="speed-form" class="tool-form" novalidate>
        <p style="color:var(--text-soft);font-size:0.9rem;margin-top:0;">Leave one field empty — it will be calculated.</p>
        <div class="tool-grid-2">
          <label>
            Speed
            <div style="display:flex;gap:0.5rem;">
              <input id="speed-val" type="number" min="0" step="any" placeholder="e.g. 60" style="flex:1;">
              <select id="speed-unit" style="width:80px;">
                <option value="km/h">km/h</option>
                <option value="m/s">m/s</option>
                <option value="mph">mph</option>
              </select>
            </div>
          </label>
          <label>
            Distance
            <div style="display:flex;gap:0.5rem;">
              <input id="dist-val" type="number" min="0" step="any" placeholder="e.g. 120" style="flex:1;">
              <select id="dist-unit" style="width:80px;">
                <option value="km">km</option>
                <option value="m">m</option>
                <option value="mi">mi</option>
              </select>
            </div>
          </label>
        </div>
        <label>
          Time (hours : minutes : seconds)
          <div style="display:flex;gap:0.5rem;">
            <input id="time-h" type="number" min="0" step="1" placeholder="h" style="flex:1;">
            <input id="time-m" type="number" min="0" max="59" step="1" placeholder="min" style="flex:1;">
            <input id="time-s" type="number" min="0" max="59" step="1" placeholder="sec" style="flex:1;">
          </div>
        </label>
        <div class="tool-actions">
          <button class="btn btn--primary" type="submit">Calculate</button>
          <button class="btn btn--ghost" type="reset">Reset</button>
        </div>
      </form>
    </section>

    <section class="tool-output" aria-live="polite">
      <p id="speed-error" style="color:#e11d48;margin:0 0 0.5rem;"></p>
      <p id="speed-result" style="font-size:1.15rem;font-weight:700;margin:0;"></p>
    </section>
  </main>
  <div id="site-footer"></div>
  <script>
    // Convert to SI units (m/s and seconds)
    const toMS = { "km/h": 1/3.6, "m/s": 1, "mph": 0.44704 };
    const toM = { "km": 1000, "m": 1, "mi": 1609.344 };

    function fromMS(v, unit) { return v / toMS[unit]; }
    function fromM(v, unit) { return v / toM[unit]; }

    function timeToSec(h, m, s) {
      const hv = Number(h) || 0, mv = Number(m) || 0, sv = Number(s) || 0;
      if (hv === 0 && mv === 0 && sv === 0) return null;
      return hv * 3600 + mv * 60 + sv;
    }

    function secToHMS(sec) {
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = Math.round(sec % 60);
      return `${h}h ${m}m ${s}s`;
    }

    document.querySelector("#speed-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const errorEl = document.querySelector("#speed-error");
      const resultEl = document.querySelector("#speed-result");
      errorEl.textContent = "";
      resultEl.textContent = "";

      const speedRaw = document.querySelector("#speed-val").value;
      const distRaw = document.querySelector("#dist-val").value;
      const speedUnit = document.querySelector("#speed-unit").value;
      const distUnit = document.querySelector("#dist-unit").value;
      const timeS = timeToSec(
        document.querySelector("#time-h").value,
        document.querySelector("#time-m").value,
        document.querySelector("#time-s").value
      );

      const hasSpeed = speedRaw !== "";
      const hasDist = distRaw !== "";
      const hasTime = timeS !== null;

      const filled = [hasSpeed, hasDist, hasTime].filter(Boolean).length;
      if (filled < 2) { errorEl.textContent = "Enter at least two values."; return; }
      if (filled === 3) { errorEl.textContent = "Leave one field empty to calculate it."; return; }

      if (!hasSpeed) {
        // calculate speed
        const d = Number(distRaw) * toM[distUnit];
        const spd = d / timeS;
        resultEl.textContent = `Speed = ${fromMS(spd, speedUnit).toFixed(4)} ${speedUnit}`;
      } else if (!hasDist) {
        // calculate distance
        const spd = Number(speedRaw) * toMS[speedUnit];
        const d = spd * timeS;
        resultEl.textContent = `Distance = ${fromM(d, distUnit).toFixed(4)} ${distUnit}`;
      } else {
        // calculate time
        const spd = Number(speedRaw) * toMS[speedUnit];
        const d = Number(distRaw) * toM[distUnit];
        const t = d / spd;
        resultEl.textContent = `Time = ${secToHMS(t)} (${t.toFixed(2)} seconds)`;
      }
    });

    document.querySelector("#speed-form").addEventListener("reset", () => {
      document.querySelector("#speed-error").textContent = "";
      document.querySelector("#speed-result").textContent = "";
    });
  </script>
  <script src="/assets/js/partials.js"></script>
</body>
</html>
