<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simple Interest Calculator | Bluetext.in</title>
  <meta name="description" content="Calculate simple interest, total amount, and interest earned.">
  <link rel="stylesheet" href="../../../assets/css/main.css">
</head>
<body>
  <div id="site-header"></div>
  <main class="doc-page" role="main">
    <p class="doc-page__back"><a href="../../../index.html">Back to home</a></p>
    <h1>Simple Interest Calculator</h1>
    <p>Calculate simple interest using principal, rate, and time.</p>

    <section class="panel">
      <form id="si-form" class="tool-form" novalidate>
        <div class="tool-grid-2">
          <label>Principal (P)<input id="si-p" type="number" min="0" step="0.01" placeholder="e.g. 10000" required></label>
          <label>Annual Rate (%) (R)<input id="si-r" type="number" min="0" step="0.01" placeholder="e.g. 8.5" required></label>
        </div>
        <label>Time (years) (T)<input id="si-t" type="number" min="0" step="0.5" placeholder="e.g. 3" required></label>
        <div class="tool-actions">
          <button class="btn btn--primary" type="submit">Calculate</button>
          <button class="btn btn--ghost" type="reset">Reset</button>
        </div>
      </form>
    </section>

    <section class="tool-output" aria-live="polite">
      <p id="si-result">Enter values to calculate interest.</p>
      <p id="si-detail" class="mono" style="margin-top:0.5rem;"></p>
    </section>
  </main>
  <div id="site-footer"></div>
  <script>
    const fmt = (v) => new Intl.NumberFormat("en-IN", { style: "currency", currency: "INR", maximumFractionDigits: 2 }).format(v);

    document.querySelector("#si-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const P = Number(document.querySelector("#si-p").value);
      const R = Number(document.querySelector("#si-r").value);
      const T = Number(document.querySelector("#si-t").value);
      if (!Number.isFinite(P) || !Number.isFinite(R) || !Number.isFinite(T) || P < 0 || R < 0 || T < 0) {
        document.querySelector("#si-result").textContent = "Please enter valid non-negative values.";
        document.querySelector("#si-detail").textContent = "";
        return;
      }
      const SI = (P * R * T) / 100;
      const total = P + SI;
      document.querySelector("#si-result").textContent = `Simple Interest: ${fmt(SI)}`;
      document.querySelector("#si-detail").textContent = `Principal: ${fmt(P)} | Total Amount: ${fmt(total)}`;
    });

    document.querySelector("#si-form").addEventListener("reset", () => {
      document.querySelector("#si-result").textContent = "Enter values to calculate interest.";
      document.querySelector("#si-detail").textContent = "";
    });
  </script>
  <script src="/assets/js/partials.js"></script>
</body>
</html>
