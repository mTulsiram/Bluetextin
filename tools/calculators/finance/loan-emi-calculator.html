<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="/assets/css/main.css">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loan EMI Calculator | Bluetext.in</title>
  <meta name="description" content="Calculate loan EMI, total payment, and total interest in seconds.">
  
</head>
<body>
  <div id="site-header"></div>
  <main class="doc-page" role="main">
    <p class="doc-page__back"><a href="../../../index.html">Back to home</a></p>
    <h1>Loan EMI Calculator</h1>
    <p>Estimate monthly EMI with principal, annual interest rate, and tenure.</p>

    <section class="panel">
      <form id="emi-form" class="tool-form" novalidate>
        <div class="tool-grid-2">
          <label>
            Loan amount
            <input id="loan-amount" type="number" min="1" step="0.01" placeholder="e.g. 500000" required>
          </label>
          <label>
            Annual interest rate (%)
            <input id="annual-rate" type="number" min="0" step="0.01" placeholder="e.g. 8.5" required>
          </label>
        </div>

        <label>
          Tenure (years)
          <input id="loan-years" type="number" min="1" step="1" placeholder="e.g. 5" required>
        </label>

        <div class="tool-actions">
          <button class="btn btn--primary" type="submit">Calculate EMI</button>
          <button class="btn btn--ghost" type="reset">Reset</button>
        </div>
      </form>
    </section>

    <section class="tool-output" aria-live="polite">
      <p id="emi-result">Enter values to calculate your EMI.</p>
      <p id="emi-summary" class="mono"></p>
    </section>
  </main>

  <script>
    const form = document.querySelector("#emi-form");
    const amountInput = document.querySelector("#loan-amount");
    const rateInput = document.querySelector("#annual-rate");
    const yearsInput = document.querySelector("#loan-years");
    const result = document.querySelector("#emi-result");
    const summary = document.querySelector("#emi-summary");

    function formatCurrency(value) {
      return new Intl.NumberFormat("en-IN", {
        style: "currency",
        currency: "INR",
        maximumFractionDigits: 2
      }).format(value);
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      const principal = Number(amountInput.value);
      const annualRate = Number(rateInput.value);
      const years = Number(yearsInput.value);

      if (!Number.isFinite(principal) || !Number.isFinite(annualRate) || !Number.isFinite(years) || principal <= 0 || annualRate < 0 || years <= 0) {
        result.textContent = "Please enter valid positive values.";
        summary.textContent = "";
        return;
      }

      const months = years * 12;
      const monthlyRate = annualRate / 12 / 100;

      let emi;
      if (monthlyRate === 0) {
        emi = principal / months;
      } else {
        const factor = Math.pow(1 + monthlyRate, months);
        emi = principal * monthlyRate * factor / (factor - 1);
      }

      const totalPayment = emi * months;
      const totalInterest = totalPayment - principal;

      result.textContent = `Monthly EMI: ${formatCurrency(emi)}`;
      summary.textContent = `Total payment: ${formatCurrency(totalPayment)} | Total interest: ${formatCurrency(totalInterest)}`;
    });

    form.addEventListener("reset", () => {
      result.textContent = "Enter values to calculate your EMI.";
      summary.textContent = "";
    });
  </script>
  <div id="site-footer"></div>
  <script src="/assets/js/partials.js"></script>
</body>
</html>
