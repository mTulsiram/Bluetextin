<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loan Calculator | Bluetext.in</title>
  <meta name="description" content="Calculate monthly payments, total interest, and see a full amortization schedule.">
  <link rel="stylesheet" href="../../../assets/css/main.css">
</head>
<body>
  <div id="site-header"></div>
  <main class="doc-page" role="main">
    <p class="doc-page__back"><a href="../../../index.html">Back to home</a></p>
    <h1>Loan Calculator</h1>
    <p>Enter loan details to see monthly EMI, total payment, interest paid, and a full amortization schedule.</p>

    <section class="panel">
      <form id="loan-form" class="tool-form" novalidate>
        <div class="tool-grid-2">
          <label>Loan Amount (₹)<input id="principal" type="number" min="1" step="1000" placeholder="e.g. 500000" required></label>
          <label>Annual Interest Rate (%)<input id="rate" type="number" min="0" step="0.01" placeholder="e.g. 8.5" required></label>
        </div>
        <div class="tool-grid-2">
          <label>Loan Tenure<input id="tenure" type="number" min="1" step="1" placeholder="e.g. 5" required></label>
          <label>Tenure unit
            <select id="tenure-unit">
              <option value="years">Years</option>
              <option value="months">Months</option>
            </select>
          </label>
        </div>
        <div class="tool-actions">
          <button class="btn btn--primary" type="submit">Calculate</button>
          <button class="btn btn--ghost" type="reset">Reset</button>
        </div>
      </form>
    </section>

    <section class="tool-output" aria-live="polite">
      <div class="tool-grid-2" id="loan-summary" style="gap:0.6rem;margin-bottom:1.25rem;"></div>
      <div id="amort-wrapper" style="display:none;">
        <p style="font-weight:700;margin:0 0 0.5rem;">Amortization Schedule</p>
        <div style="overflow-x:auto;">
          <table id="amort-table" style="width:100%;border-collapse:collapse;font-size:0.85rem;"></table>
        </div>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script>
    const fmt = v => new Intl.NumberFormat("en-IN", { style: "currency", currency: "INR", maximumFractionDigits: 2 }).format(v);

    function statCard(label, value) {
      const d = document.createElement("div");
      d.className = "card";
      d.innerHTML = `<p style="font-size:0.8rem;color:var(--text-soft);margin:0 0 0.25rem;">${label}</p><p style="font-size:1.05rem;font-weight:700;margin:0;">${value}</p>`;
      return d;
    }

    document.querySelector("#loan-form").addEventListener("submit", e => {
      e.preventDefault();
      const P = Number(document.querySelector("#principal").value);
      const annualRate = Number(document.querySelector("#rate").value);
      let months = Number(document.querySelector("#tenure").value);
      if (document.querySelector("#tenure-unit").value === "years") months *= 12;

      const summaryEl = document.querySelector("#loan-summary");
      const amortWrapper = document.querySelector("#amort-wrapper");
      const table = document.querySelector("#amort-table");
      summaryEl.innerHTML = ""; table.innerHTML = "";

      if (P <= 0 || annualRate < 0 || months <= 0) { summaryEl.innerHTML = "<p style='color:#e11d48;'>Enter valid positive values.</p>"; return; }

      const r = annualRate / 100 / 12;
      let emi;
      if (r === 0) {
        emi = P / months;
      } else {
        emi = (P * r * Math.pow(1 + r, months)) / (Math.pow(1 + r, months) - 1);
      }
      const totalPayment = emi * months;
      const totalInterest = totalPayment - P;

      summaryEl.appendChild(statCard("Monthly EMI", fmt(emi)));
      summaryEl.appendChild(statCard("Total Payment", fmt(totalPayment)));
      summaryEl.appendChild(statCard("Principal", fmt(P)));
      summaryEl.appendChild(statCard("Total Interest", fmt(totalInterest)));

      // Amortization table
      table.innerHTML = `<thead><tr style="background:var(--surface-soft);text-align:right;">
        <th style="padding:0.4rem 0.6rem;text-align:left;">Month</th>
        <th style="padding:0.4rem 0.6rem;">EMI</th>
        <th style="padding:0.4rem 0.6rem;">Principal</th>
        <th style="padding:0.4rem 0.6rem;">Interest</th>
        <th style="padding:0.4rem 0.6rem;">Balance</th>
      </tr></thead>`;
      const tbody = document.createElement("tbody");
      let balance = P;
      for (let i = 1; i <= months; i++) {
        const interest = balance * r;
        const principal = emi - interest;
        balance = Math.max(0, balance - principal);
        const tr = document.createElement("tr");
        tr.style.borderBottom = "1px solid var(--stroke)";
        tr.style.textAlign = "right";
        tr.innerHTML = `<td style="padding:0.35rem 0.6rem;text-align:left;">${i}</td>
          <td style="padding:0.35rem 0.6rem;">${fmt(emi)}</td>
          <td style="padding:0.35rem 0.6rem;">${fmt(principal)}</td>
          <td style="padding:0.35rem 0.6rem;">${fmt(interest)}</td>
          <td style="padding:0.35rem 0.6rem;">${fmt(balance)}</td>`;
        tbody.appendChild(tr);
      }
      table.appendChild(tbody);
      amortWrapper.style.display = "";
    });

    document.querySelector("#loan-form").addEventListener("reset", () => {
      document.querySelector("#loan-summary").innerHTML = "";
      document.querySelector("#amort-wrapper").style.display = "none";
    });
  </script>
  <script src="/assets/js/partials.js"></script>
</body>
</html>
