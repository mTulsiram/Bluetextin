<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Date Difference Calculator | Bluetext.in</title>
  <meta name="description" content="Calculate the exact difference between two dates in years, months, days, hours, and weeks.">
  <link rel="stylesheet" href="../../../assets/css/main.css">
</head>
<body>
  <div id="site-header"></div>
  <main class="doc-page" role="main">
    <p class="doc-page__back"><a href="../../../index.html">Back to home</a></p>
    <h1>Date Difference Calculator</h1>
    <p>Find the exact gap between two dates in years, months, days, and more.</p>

    <section class="panel">
      <form id="date-form" class="tool-form" novalidate>
        <div class="tool-grid-2">
          <label>Start date<input id="date-start" type="date" required></label>
          <label>End date<input id="date-end" type="date" required></label>
        </div>
        <div class="tool-actions">
          <button class="btn btn--primary" type="submit">Calculate</button>
          <button class="btn btn--ghost" type="reset">Reset</button>
        </div>
      </form>
    </section>

    <section class="tool-output" aria-live="polite">
      <p id="date-error" style="color:#e11d48;margin:0 0 0.5rem;"></p>
      <div class="tool-grid-2" id="date-results" style="gap:0.6rem;"></div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script>
    const form = document.querySelector("#date-form");
    const startEl = document.querySelector("#date-start");
    const endEl = document.querySelector("#date-end");
    const errorEl = document.querySelector("#date-error");
    const resultsEl = document.querySelector("#date-results");

    // Default: today and 1 year ago
    const today = new Date();
    endEl.value = today.toISOString().slice(0, 10);
    const oneYearAgo = new Date(today);
    oneYearAgo.setFullYear(oneYearAgo.getFullYear() - 1);
    startEl.value = oneYearAgo.toISOString().slice(0, 10);

    function statCard(label, value) {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `<p style="font-size:0.8rem;color:var(--text-soft);margin:0 0 0.25rem;">${label}</p><p style="font-size:1.15rem;font-weight:700;margin:0;">${value}</p>`;
      return card;
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      errorEl.textContent = "";
      resultsEl.innerHTML = "";

      const start = new Date(startEl.value);
      const end = new Date(endEl.value);

      if (isNaN(start) || isNaN(end)) { errorEl.textContent = "Enter valid dates."; return; }

      const [d1, d2] = start <= end ? [start, end] : [end, start];
      const msPerDay = 86400000;
      const totalDays = Math.round((d2 - d1) / msPerDay);
      const totalWeeks = Math.floor(totalDays / 7);
      const totalHours = totalDays * 24;
      const totalMinutes = totalHours * 60;

      // Years / months / days
      let y = d2.getFullYear() - d1.getFullYear();
      let m = d2.getMonth() - d1.getMonth();
      let d = d2.getDate() - d1.getDate();
      if (d < 0) { m--; const prev = new Date(d2.getFullYear(), d2.getMonth(), 0); d += prev.getDate(); }
      if (m < 0) { y--; m += 12; }

      resultsEl.appendChild(statCard("Years · Months · Days", `${y}y ${m}m ${d}d`));
      resultsEl.appendChild(statCard("Total Days", totalDays.toLocaleString("en-IN")));
      resultsEl.appendChild(statCard("Total Weeks", totalWeeks.toLocaleString("en-IN")));
      resultsEl.appendChild(statCard("Total Hours", totalHours.toLocaleString("en-IN")));
      resultsEl.appendChild(statCard("Total Minutes", totalMinutes.toLocaleString("en-IN")));
      resultsEl.appendChild(statCard("Direction", start <= end ? "Future → Past" : "Past → Future"));
    });

    form.addEventListener("reset", () => { errorEl.textContent = ""; resultsEl.innerHTML = ""; });
  </script>
  <script src="/assets/js/partials.js"></script>
</body>
</html>
