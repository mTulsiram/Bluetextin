<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="/assets/css/main.css">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Age Calculator | Bluetext.in</title>
  <meta name="description" content="Calculate exact age in years, months, and days from date of birth.">
  
</head>
<body>
  <div id="site-header"></div>
  <main class="doc-page" role="main">
    <p class="doc-page__back"><a href="../../../index.html">Back to home</a></p>
    <h1>Age Calculator</h1>
    <p>Find exact age between date of birth and a target date.</p>

    <section class="panel">
      <form id="age-form" class="tool-form" novalidate>
        <div class="tool-grid-2">
          <label>
            Date of birth
            <input id="dob" type="date" required>
          </label>
          <label>
            Calculate age on
            <input id="asof" type="date" required>
          </label>
        </div>

        <div class="tool-actions">
          <button class="btn btn--primary" type="submit">Calculate Age</button>
          <button class="btn btn--ghost" type="reset">Reset</button>
        </div>
      </form>
    </section>

    <section class="tool-output" aria-live="polite">
      <p id="age-result">Pick dates to calculate age.</p>
      <p id="age-summary" class="mono"></p>
    </section>
  </main>

  <script>
    const form = document.querySelector("#age-form");
    const dobInput = document.querySelector("#dob");
    const asOfInput = document.querySelector("#asof");
    const result = document.querySelector("#age-result");
    const summary = document.querySelector("#age-summary");

    asOfInput.valueAsDate = new Date();

    function calculateAgeParts(fromDate, toDate) {
      let years = toDate.getFullYear() - fromDate.getFullYear();
      let months = toDate.getMonth() - fromDate.getMonth();
      let days = toDate.getDate() - fromDate.getDate();

      if (days < 0) {
        const prevMonthDate = new Date(toDate.getFullYear(), toDate.getMonth(), 0);
        days += prevMonthDate.getDate();
        months -= 1;
      }

      if (months < 0) {
        months += 12;
        years -= 1;
      }

      return { years, months, days };
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      const dob = dobInput.valueAsDate;
      const asOf = asOfInput.valueAsDate;

      if (!dob || !asOf) {
        result.textContent = "Please select both dates.";
        summary.textContent = "";
        return;
      }

      if (dob > asOf) {
        result.textContent = "Date of birth cannot be later than target date.";
        summary.textContent = "";
        return;
      }

      const parts = calculateAgeParts(dob, asOf);
      const diffMs = asOf.getTime() - dob.getTime();
      const totalDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));

      result.textContent = `Age: ${parts.years} years, ${parts.months} months, ${parts.days} days`;
      summary.textContent = `Total days lived: ${totalDays.toLocaleString("en-IN")}`;
    });

    form.addEventListener("reset", () => {
      asOfInput.valueAsDate = new Date();
      result.textContent = "Pick dates to calculate age.";
      summary.textContent = "";
    });
  </script>
  <div id="site-footer"></div>
  <script src="/assets/js/partials.js"></script>
</body>
</html>
