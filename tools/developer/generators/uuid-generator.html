<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="/assets/css/main.css">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UUID Generator | Bluetext.in</title>
  <meta name="description" content="Generate cryptographically random UUIDs v4 instantly in browser.">
  
</head>
<body>
  <div id="site-header"></div>
  <main class="doc-page" role="main">
    <p class="doc-page__back"><a href="../../../index.html">Back to home</a></p>
    <h1>UUID Generator</h1>
    <p>Generate cryptographically random UUID v4 identifiers instantly.</p>

    <section class="panel">
      <form id="uuid-form" class="tool-form" novalidate>
        <label>
          How many UUIDs?
          <input id="uuid-count" type="number" min="1" max="100" value="1" step="1">
        </label>
        <div class="tool-actions">
          <button class="btn btn--primary" type="submit">Generate</button>
          <button id="copy-all" class="btn btn--ghost" type="button">Copy All</button>
        </div>
      </form>
    </section>

    <section class="tool-output" aria-live="polite">
      <p id="uuid-status"></p>
      <textarea id="uuid-output" rows="8" class="mono" readonly placeholder="UUIDs will appear here..."></textarea>
    </section>
  </main>
  <div id="site-footer"></div>
  <script>
    function generateUUID() {
      if (crypto && crypto.randomUUID) return crypto.randomUUID();
      return ([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g, c =>
        (c ^ (crypto.getRandomValues(new Uint8Array(1))[0] & (15 >> (c / 4)))).toString(16)
      );
    }

    const form = document.querySelector("#uuid-form");
    const countInput = document.querySelector("#uuid-count");
    const output = document.querySelector("#uuid-output");
    const statusEl = document.querySelector("#uuid-status");
    const copyBtn = document.querySelector("#copy-all");

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const count = Math.max(1, Math.min(100, Number(countInput.value) || 1));
      const uuids = Array.from({ length: count }, generateUUID);
      output.value = uuids.join("\n");
      statusEl.textContent = `Generated ${count} UUID${count > 1 ? "s" : ""}.`;
    });

    copyBtn.addEventListener("click", () => {
      const text = output.value;
      if (!text) return;
      navigator.clipboard.writeText(text).then(() => { statusEl.textContent = "Copied to clipboard."; });
    });
  </script>
  <script src="/assets/js/partials.js"></script>
</body>
</html>
