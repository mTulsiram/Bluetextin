<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HTML Formatter | Bluetext.in</title>
  <meta name="description" content="Beautify and minify HTML markup instantly in your browser.">
  <link rel="stylesheet" href="../../../assets/css/main.css">
</head>
<body>
  <div id="site-header"></div>
  <main class="doc-page" role="main">
    <p class="doc-page__back"><a href="../../../index.html">Back to home</a></p>
    <h1>HTML Formatter</h1>
    <p>Paste HTML to beautify it with proper indentation, or minify it for production.</p>

    <section class="panel">
      <div class="tool-form">
        <label class="search__label" for="html-input">Paste HTML</label>
        <textarea id="html-input" rows="12" class="mono" style="width:100%;border:1px solid var(--stroke);border-radius:var(--radius-sm);padding:0.65rem 0.75rem;font:inherit;resize:vertical;" placeholder="&lt;div&gt;&lt;p&gt;Hello&lt;/p&gt;&lt;/div&gt;"></textarea>
      </div>
      <div class="tool-actions" style="margin-top:0.75rem;">
        <button id="btn-format" class="btn btn--primary" type="button">Beautify</button>
        <button id="btn-minify" class="btn btn--ghost" type="button">Minify</button>
        <button id="btn-copy" class="btn btn--ghost" type="button">Copy</button>
        <button id="btn-clear" class="btn btn--ghost" type="button">Clear</button>
      </div>
    </section>

    <section class="tool-output" aria-live="polite">
      <p id="html-status" style="margin:0 0 0.6rem;font-weight:600;"></p>
      <textarea id="html-output" rows="12" class="mono" readonly style="width:100%;border:1px solid var(--stroke);border-radius:var(--radius-sm);padding:0.65rem 0.75rem;font:inherit;resize:vertical;background:var(--surface-soft);" placeholder="Output will appear here..."></textarea>
    </section>
  </main>
  <div id="site-footer"></div>
  <script>
    const inputEl = document.querySelector("#html-input");
    const outputEl = document.querySelector("#html-output");
    const statusEl = document.querySelector("#html-status");

    const VOID = new Set(["area","base","br","col","embed","hr","img","input","link","meta","param","source","track","wbr"]);
    const INLINE = new Set(["a","abbr","b","bdi","bdo","cite","code","data","dfn","em","i","kbd","mark","q","rp","rt","ruby","s","samp","small","span","strong","sub","sup","time","u","var","wbr"]);

    function beautifyHTML(html) {
      // Tokenize
      const tokens = [];
      const re = /<!--[\s\S]*?-->|<([a-zA-Z][a-zA-Z0-9]*)[^>]*\/?>|<\/([a-zA-Z][a-zA-Z0-9]*)>|[^<]+/g;
      let m;
      while ((m = re.exec(html)) !== null) {
        if (m[0].startsWith("<!--")) tokens.push({ type: "comment", val: m[0] });
        else if (m[0].startsWith("</")) tokens.push({ type: "close", tag: m[2].toLowerCase() });
        else if (m[0].startsWith("<")) {
          const tag = m[1].toLowerCase();
          tokens.push({ type: VOID.has(tag) ? "void" : "open", tag, val: m[0] });
        } else {
          const text = m[0].trim();
          if (text) tokens.push({ type: "text", val: text });
        }
      }

      let depth = 0;
      const indent = "  ";
      let out = "";

      tokens.forEach(({ type, tag, val }) => {
        if (type === "close" && !INLINE.has(tag)) {
          depth = Math.max(0, depth - 1);
          out += indent.repeat(depth) + `</${tag}>\n`;
        } else if (type === "open") {
          out += indent.repeat(depth) + val + "\n";
          if (!INLINE.has(tag)) depth++;
        } else if (type === "void") {
          out += indent.repeat(depth) + val + "\n";
        } else {
          out += indent.repeat(depth) + val + "\n";
        }
      });

      return out.trim();
    }

    function minifyHTML(html) {
      return html
        .replace(/<!--[\s\S]*?-->/g, "")
        .replace(/\s+/g, " ")
        .replace(/>\s+</g, "><")
        .trim();
    }

    document.querySelector("#btn-format").addEventListener("click", () => {
      const html = inputEl.value.trim();
      if (!html) { statusEl.textContent = "Paste HTML first."; return; }
      outputEl.value = beautifyHTML(html);
      statusEl.textContent = "HTML beautified.";
    });

    document.querySelector("#btn-minify").addEventListener("click", () => {
      const html = inputEl.value.trim();
      if (!html) { statusEl.textContent = "Paste HTML first."; return; }
      const minified = minifyHTML(html);
      outputEl.value = minified;
      const saving = (((html.length - minified.length) / html.length) * 100).toFixed(1);
      statusEl.textContent = `Minified. Saved ${saving}% (${html.length - minified.length} chars).`;
    });

    document.querySelector("#btn-copy").addEventListener("click", () => {
      if (!outputEl.value) return;
      navigator.clipboard.writeText(outputEl.value).then(() => { statusEl.textContent = "Copied."; });
    });

    document.querySelector("#btn-clear").addEventListener("click", () => {
      inputEl.value = ""; outputEl.value = ""; statusEl.textContent = "";
    });
  </script>
  <script src="/assets/js/partials.js"></script>
</body>
</html>
