<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="/assets/css/main.css">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CSS Formatter | Bluetext.in</title>
  <meta name="description" content="Beautify and minify CSS code instantly in your browser.">
  
</head>
<body>
  <div id="site-header"></div>
  <main class="doc-page" role="main">
    <p class="doc-page__back"><a href="../../../index.html">Back to home</a></p>
    <h1>CSS Formatter</h1>
    <p>Paste CSS to beautify it with proper indentation, or minify it to reduce size.</p>

    <section class="panel">
      <div class="tool-form">
        <label class="search__label" for="css-input">Paste CSS</label>
        <textarea id="css-input" rows="12" class="mono" placeholder="body { color: red; margin: 0; } h1{font-size:2rem;}"></textarea>
      </div>
      <div class="tool-actions">
        <button id="btn-format" class="btn btn--primary" type="button">Beautify</button>
        <button id="btn-minify" class="btn btn--ghost" type="button">Minify</button>
        <button id="btn-copy" class="btn btn--ghost" type="button">Copy</button>
        <button id="btn-clear" class="btn btn--ghost" type="button">Clear</button>
      </div>
    </section>

    <section class="tool-output" aria-live="polite">
      <p id="css-status"></p>
      <textarea id="css-output" rows="12" class="mono" readonly placeholder="Output will appear here..."></textarea>
    </section>
  </main>
  <div id="site-footer"></div>
  <script>
    const inputEl = document.querySelector("#css-input");
    const outputEl = document.querySelector("#css-output");
    const statusEl = document.querySelector("#css-status");

    function minifyCSS(css) {
      return css
        .replace(/\/\*[\s\S]*?\*\//g, "")   // remove comments
        .replace(/\s*([{}:;,])\s*/g, "$1")  // remove spaces around punctuation
        .replace(/\s+/g, " ")               // collapse whitespace
        .replace(/;\}/g, "}")               // remove last semicolon in rule
        .trim();
    }

    function beautifyCSS(css) {
      const minified = minifyCSS(css);
      let result = "";
      let depth = 0;
      const indent = "  ";

      for (let i = 0; i < minified.length; i++) {
        const c = minified[i];
        if (c === "{") {
          result += " {\n";
          depth++;
          result += indent.repeat(depth);
        } else if (c === "}") {
          result = result.trimEnd();
          depth--;
          result += "\n}\n\n";
          if (depth > 0) result += indent.repeat(depth);
        } else if (c === ";") {
          result += ";\n" + indent.repeat(depth);
        } else {
          result += c;
        }
      }
      return result.trim();
    }

    document.querySelector("#btn-format").addEventListener("click", () => {
      const css = inputEl.value.trim();
      if (!css) { statusEl.textContent = "Paste CSS first."; return; }
      outputEl.value = beautifyCSS(css);
      statusEl.textContent = "CSS beautified.";
    });

    document.querySelector("#btn-minify").addEventListener("click", () => {
      const css = inputEl.value.trim();
      if (!css) { statusEl.textContent = "Paste CSS first."; return; }
      const minified = minifyCSS(css);
      outputEl.value = minified;
      const saving = (((css.length - minified.length) / css.length) * 100).toFixed(1);
      statusEl.textContent = `Minified. Saved ${saving}% (${css.length - minified.length} chars).`;
    });

    document.querySelector("#btn-copy").addEventListener("click", () => {
      if (!outputEl.value) return;
      navigator.clipboard.writeText(outputEl.value).then(() => { statusEl.textContent = "Copied."; });
    });

    document.querySelector("#btn-clear").addEventListener("click", () => {
      inputEl.value = ""; outputEl.value = ""; statusEl.textContent = "";
    });
  </script>
  <script src="/assets/js/partials.js"></script>
</body>
</html>
