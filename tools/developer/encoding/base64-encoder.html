<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Base64 Encoder / Decoder | Bluetext.in</title>
  <meta name="description" content="Encode or decode text and files to/from Base64 instantly in browser.">
  <link rel="stylesheet" href="../../../assets/css/main.css">
</head>
<body>
  <div id="site-header"></div>
  <main class="doc-page" role="main">
    <p class="doc-page__back"><a href="../../../index.html">Back to home</a></p>
    <h1>Base64 Encoder / Decoder</h1>
    <p>Convert text to Base64 or decode Base64 back to plain text instantly.</p>

    <section class="panel">
      <div class="tool-form">
        <label class="search__label" for="b64-input">Input text</label>
        <textarea id="b64-input" rows="8" class="mono" style="width:100%;border:1px solid var(--stroke);border-radius:var(--radius-sm);padding:0.65rem 0.75rem;font:inherit;resize:vertical;" placeholder="Enter plain text or Base64 string..."></textarea>
      </div>
      <div class="tool-actions" style="margin-top:0.75rem;">
        <button id="btn-encode" class="btn btn--primary" type="button">Encode to Base64</button>
        <button id="btn-decode" class="btn btn--ghost" type="button">Decode from Base64</button>
        <button id="btn-copy" class="btn btn--ghost" type="button">Copy Output</button>
        <button id="btn-clear" class="btn btn--ghost" type="button">Clear</button>
      </div>
    </section>

    <section class="tool-output" aria-live="polite">
      <p id="b64-status" style="margin:0 0 0.6rem;font-weight:600;"></p>
      <textarea id="b64-output" rows="8" class="mono" readonly style="width:100%;border:1px solid var(--stroke);border-radius:var(--radius-sm);padding:0.65rem 0.75rem;font:inherit;resize:vertical;background:var(--surface-soft);" placeholder="Output will appear here..."></textarea>
    </section>
  </main>
  <div id="site-footer"></div>
  <script>
    const inputEl = document.querySelector("#b64-input");
    const outputEl = document.querySelector("#b64-output");
    const statusEl = document.querySelector("#b64-status");

    document.querySelector("#btn-encode").addEventListener("click", () => {
      const text = inputEl.value;
      if (!text) { statusEl.textContent = "Enter text to encode."; return; }
      try {
        outputEl.value = btoa(unescape(encodeURIComponent(text)));
        statusEl.textContent = "Encoded successfully.";
      } catch {
        statusEl.textContent = "Encoding failed. Ensure text is valid UTF-8.";
      }
    });

    document.querySelector("#btn-decode").addEventListener("click", () => {
      const text = inputEl.value.trim();
      if (!text) { statusEl.textContent = "Enter Base64 text to decode."; return; }
      try {
        outputEl.value = decodeURIComponent(escape(atob(text)));
        statusEl.textContent = "Decoded successfully.";
      } catch {
        statusEl.textContent = "Decoding failed. Input is not valid Base64.";
      }
    });

    document.querySelector("#btn-copy").addEventListener("click", () => {
      const text = outputEl.value;
      if (!text) return;
      navigator.clipboard.writeText(text).then(() => { statusEl.textContent = "Copied to clipboard."; });
    });

    document.querySelector("#btn-clear").addEventListener("click", () => {
      inputEl.value = "";
      outputEl.value = "";
      statusEl.textContent = "";
    });
  </script>
  <script src="/assets/js/partials.js"></script>
</body>
</html>
