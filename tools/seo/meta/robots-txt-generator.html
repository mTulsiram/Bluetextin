<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="/assets/css/main.css">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Robots.txt Generator | Bluetext.in</title>
  <meta name="description" content="Generate a robots.txt file for your website with common rules for search engine crawlers.">
  
</head>
<body>
  <div id="site-header"></div>
  <main class="doc-page" role="main">
    <p class="doc-page__back"><a href="../../../index.html">Back to home</a></p>
    <h1>Robots.txt Generator</h1>
    <p>Build a robots.txt file by configuring crawl rules and sitemap URL.</p>

    <section class="panel">
      <form id="robots-form" class="tool-form" novalidate>
        <label>
          Sitemap URL
          <input id="sitemap-url" type="url" placeholder="https://example.com/sitemap.xml">
        </label>

        <fieldset>
          <legend>Common bot rules</legend>
          <label><input type="checkbox" id="allow-all" checked> Allow all bots to crawl everything (default)</label>
          <label><input type="checkbox" id="block-gpt"> Block GPTBot (OpenAI)</label>
          <label><input type="checkbox" id="block-ccbot"> Block CCBot (Common Crawl)</label>
          <label><input type="checkbox" id="block-google-ai"> Block Google-Extended (Bard/Gemini training)</label>
        </fieldset>

        <label>
          Disallow paths (one per line)
          <textarea id="disallow-paths" rows="4" placeholder="/admin/&#10;/private/&#10;/*.pdf"></textarea>
        </label>

        <div class="tool-actions">
          <button class="btn btn--primary" type="submit">Generate robots.txt</button>
          <button class="btn btn--ghost" type="reset">Reset</button>
        </div>
      </form>
    </section>

    <section class="tool-output" aria-live="polite">
      <div>
        <p id="robots-label"></p>
        <button id="copy-btn" class="btn btn--ghost" type="button">Copy</button>
      </div>
      <pre id="robots-output" class="mono"></pre>
    </section>
  </main>
  <div id="site-footer"></div>
  <script>
    const form = document.querySelector("#robots-form");
    const output = document.querySelector("#robots-output");
    const label = document.querySelector("#robots-label");
    const copyBtn = document.querySelector("#copy-btn");

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const sitemapUrl = document.querySelector("#sitemap-url").value.trim();
      const allowAll = document.querySelector("#allow-all").checked;
      const blockGpt = document.querySelector("#block-gpt").checked;
      const blockCc = document.querySelector("#block-ccbot").checked;
      const blockGoogleAi = document.querySelector("#block-google-ai").checked;
      const disallowPaths = document.querySelector("#disallow-paths").value.split(/\r?\n/).map(s => s.trim()).filter(Boolean);

      const lines = [];

      lines.push("User-agent: *");
      if (allowAll) {
        lines.push("Allow: /");
      }
      disallowPaths.forEach(p => lines.push(`Disallow: ${p}`));
      lines.push("");

      if (blockGpt) {
        lines.push("User-agent: GPTBot");
        lines.push("Disallow: /");
        lines.push("");
      }

      if (blockCc) {
        lines.push("User-agent: CCBot");
        lines.push("Disallow: /");
        lines.push("");
      }

      if (blockGoogleAi) {
        lines.push("User-agent: Google-Extended");
        lines.push("Disallow: /");
        lines.push("");
      }

      if (sitemapUrl) {
        lines.push(`Sitemap: ${sitemapUrl}`);
      }

      output.textContent = lines.join("\n");
      label.textContent = "robots.txt generated.";
    });

    form.addEventListener("reset", () => { output.textContent = ""; label.textContent = ""; });

    copyBtn.addEventListener("click", () => {
      if (!output.textContent) return;
      navigator.clipboard.writeText(output.textContent).then(() => { label.textContent = "Copied to clipboard."; });
    });
  </script>
  <script src="/assets/js/partials.js"></script>
</body>
</html>
