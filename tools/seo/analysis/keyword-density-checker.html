<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Keyword Density Checker | Bluetext.in</title>
  <meta name="description" content="Analyse keyword frequency and density in any text or webpage content.">
  <link rel="stylesheet" href="../../../assets/css/main.css">
</head>
<body>
  <div id="site-header"></div>
  <main class="doc-page" role="main">
    <p class="doc-page__back"><a href="../../../index.html">Back to home</a></p>
    <h1>Keyword Density Checker</h1>
    <p>Paste page content and see the frequency and density of every keyword.</p>

    <section class="panel">
      <div class="tool-form">
        <label class="search__label" for="content-input">Page content</label>
        <textarea id="content-input" rows="10" style="width:100%;border:1px solid var(--stroke);border-radius:var(--radius-sm);padding:0.65rem 0.75rem;font:inherit;resize:vertical;" placeholder="Paste your article or page text here..."></textarea>
        <div class="tool-grid-2" style="margin-top:0.6rem;">
          <label>Min word length<input id="min-len" type="number" min="1" max="20" value="3" step="1"></label>
          <label>Top results<input id="top-n" type="number" min="5" max="100" value="20" step="5"></label>
        </div>
      </div>
      <div class="tool-actions" style="margin-top:0.75rem;">
        <button id="btn-analyse" class="btn btn--primary" type="button">Analyse</button>
        <button id="btn-clear" class="btn btn--ghost" type="button">Clear</button>
      </div>
    </section>

    <section class="tool-output" aria-live="polite">
      <p id="kd-status" style="margin:0 0 0.75rem;font-weight:600;"></p>
      <div id="kd-results"></div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script>
    const STOP = new Set(["the","a","an","and","or","but","in","on","at","to","for","of","with","is","are","was","were","be","been","being","have","has","had","do","does","did","will","would","could","should","may","might","shall","can","this","that","these","those","i","you","he","she","it","we","they","me","him","her","us","them","my","your","his","its","our","their","by","from","as","not","no","so","if","then","than","when","where","who","which","what","how","all","any","each","more","most","also","about","into","up","out","over","after","before","between"]);

    document.querySelector("#btn-analyse").addEventListener("click", () => {
      const text = document.querySelector("#content-input").value;
      const minLen = Number(document.querySelector("#min-len").value) || 3;
      const topN = Number(document.querySelector("#top-n").value) || 20;
      const statusEl = document.querySelector("#kd-status");
      const resultsEl = document.querySelector("#kd-results");
      resultsEl.innerHTML = "";

      if (!text.trim()) { statusEl.textContent = "Paste some text first."; return; }

      const allWords = text.toLowerCase().match(/\b[a-z]{2,}\b/g) || [];
      const totalWords = allWords.length;
      const freq = {};
      allWords.forEach((w) => {
        if (w.length >= minLen && !STOP.has(w)) freq[w] = (freq[w] || 0) + 1;
      });

      const sorted = Object.entries(freq).sort((a, b) => b[1] - a[1]).slice(0, topN);
      statusEl.textContent = `${totalWords} total words · ${Object.keys(freq).length} unique keywords · showing top ${Math.min(topN, sorted.length)}`;

      const table = document.createElement("table");
      table.style.cssText = "width:100%;border-collapse:collapse;font-size:0.9rem;";
      table.innerHTML = `<thead><tr style="text-align:left;border-bottom:2px solid var(--stroke);">
        <th style="padding:0.4rem 0.6rem;">Keyword</th>
        <th style="padding:0.4rem 0.6rem;">Count</th>
        <th style="padding:0.4rem 0.6rem;">Density</th>
        <th style="padding:0.4rem 0.6rem;width:200px;">Bar</th>
      </tr></thead>`;
      const tbody = document.createElement("tbody");
      const maxCount = sorted[0]?.[1] || 1;

      sorted.forEach(([word, count], idx) => {
        const density = ((count / totalWords) * 100).toFixed(2);
        const barW = Math.round((count / maxCount) * 100);
        const tr = document.createElement("tr");
        tr.style.borderBottom = "1px solid var(--stroke)";
        tr.innerHTML = `
          <td style="padding:0.4rem 0.6rem;font-weight:600;">${word}</td>
          <td style="padding:0.4rem 0.6rem;">${count}</td>
          <td style="padding:0.4rem 0.6rem;">${density}%</td>
          <td style="padding:0.4rem 0.6rem;">
            <div style="background:var(--stroke);border-radius:999px;height:8px;overflow:hidden;">
              <div style="width:${barW}%;height:100%;background:var(--accent);border-radius:999px;"></div>
            </div>
          </td>`;
        tbody.appendChild(tr);
      });

      table.appendChild(tbody);
      resultsEl.appendChild(table);
    });

    document.querySelector("#btn-clear").addEventListener("click", () => {
      document.querySelector("#content-input").value = "";
      document.querySelector("#kd-results").innerHTML = "";
      document.querySelector("#kd-status").textContent = "";
    });
  </script>
  <script src="/assets/js/partials.js"></script>
</body>
</html>
