<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="/assets/css/main.css">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SEO Title Generator | Bluetext.in</title>
  <meta name="description" content="Generate click-worthy SEO page titles using your keywords and topic.">
  
</head>
<body>
  <div id="site-header"></div>
  <main class="doc-page" role="main">
    <p class="doc-page__back"><a href="../../../index.html">Back to home</a></p>
    <h1>SEO Title Generator</h1>
    <p>Enter your topic and keywords to generate optimised, click-worthy page titles.</p>

    <section class="panel">
      <form id="title-form" class="tool-form" novalidate>
        <label>Main topic / keyword<input id="topic" type="text" placeholder="e.g. image compression" required></label>
        <div class="tool-grid-2">
          <label>Target audience <span>(optional)</span><input id="audience" type="text" placeholder="e.g. photographers, developers"></label>
          <label>Benefit / outcome <span>(optional)</span><input id="benefit" type="text" placeholder="e.g. save storage, rank higher"></label>
        </div>
        <label>
          Format
          <select id="title-format">
            <option value="howto">How-to guide</option>
            <option value="list">Listicle</option>
            <option value="best">Best tools</option>
            <option value="free">Free online tool</option>
            <option value="vs">Comparison</option>
          </select>
        </label>
        <div class="tool-actions">
          <button class="btn btn--primary" type="submit">Generate Titles</button>
          <button class="btn btn--ghost" type="reset">Clear</button>
        </div>
      </form>
    </section>

    <section class="tool-output" aria-live="polite">
      <p id="title-status"></p>
      <div id="title-results"></div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script>
    const TEMPLATES = {
      howto: [
        "How to {topic} — Step-by-Step Guide {year}",
        "How to {topic} in Minutes (Free & Easy)",
        "The Complete Guide to {topic} for {audience}",
        "How to {topic} and {benefit}",
        "How to Master {topic}: Tips, Tools & Techniques",
      ],
      list: [
        "10 Best Ways to {topic} in {year}",
        "7 Proven Tips to {topic} (and {benefit})",
        "Top 5 Tools to {topic} for {audience}",
        "12 Expert Tips on {topic} You Need to Know",
        "15 Easy Ways to {topic} Faster",
      ],
      best: [
        "Best {topic} Tools in {year} (Free & Paid)",
        "Top {topic} Tools for {audience} — {year} Review",
        "The Best Free {topic} Tools Online",
        "Best Ways to {topic} and {benefit}",
        "Best {topic} Software: A Complete {year} Guide",
      ],
      free: [
        "Free Online {topic} Tool — No Sign-up Required",
        "{topic} — Free, Fast & Secure Online Tool",
        "Free {topic} for {audience} | Works in Browser",
        "{topic}: Free Tool to {benefit}",
        "Online {topic} Tool — Fast Results in Seconds",
      ],
      vs: [
        "{topic} vs Alternatives: Which is Best in {year}?",
        "{topic}: Manual vs Automated — What Works Better?",
        "Free vs Paid {topic} Tools: Full Comparison",
        "{topic} Compared: What {audience} Need to Know",
        "Before vs After {topic}: Real Results Explained",
      ],
    };

    function fill(tpl, topic, audience, benefit) {
      const year = new Date().getFullYear();
      return tpl
        .replace(/{topic}/g, topic || "your content")
        .replace(/{audience}/g, audience || "beginners")
        .replace(/{benefit}/g, benefit || "save time")
        .replace(/{year}/g, year);
    }

    document.querySelector("#title-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const topic = document.querySelector("#topic").value.trim();
      const audience = document.querySelector("#audience").value.trim();
      const benefit = document.querySelector("#benefit").value.trim();
      const format = document.querySelector("#title-format").value;
      const statusEl = document.querySelector("#title-status");
      const resultsEl = document.querySelector("#title-results");
      resultsEl.innerHTML = "";

      if (!topic) { statusEl.textContent = "Enter a topic first."; return; }

      const templates = TEMPLATES[format] || TEMPLATES.howto;
      statusEl.textContent = `${templates.length} title suggestions:`;

      templates.forEach((tpl) => {
        const title = fill(tpl, topic, audience, benefit);
        const len = title.length;
        const isGood = len >= 50 && len <= 60;
        const row = document.createElement("div");
        row.style.cssText = "border:1px solid var(--stroke);border-radius:var(--radius-sm);padding:0.6rem 0.85rem;display:flex;justify-content:space-between;align-items:center;gap:0.5rem;";
        row.innerHTML = `
          <span>${title}</span>
          <span#f0fdf4" : "#fff8e1"};color:${isGood ? "#15803d" : "#92400e"};font-weight:500;">${len} chars</span>`;
        const copyBtn = document.createElement("button");
        copyBtn.textContent = "Copy";
        copyBtn.className = "btn btn--ghost";
        copyBtn.style.cssText = "padding:0.3rem 0.65rem;font-size:0.8rem;white-space:nowrap;";
        copyBtn.addEventListener("click", () => {
          navigator.clipboard.writeText(title).then(() => { copyBtn.textContent = "Copied!"; setTimeout(() => { copyBtn.textContent = "Copy"; }, 1500); });
        });
        row.appendChild(copyBtn);
        resultsEl.appendChild(row);
      });
    });

    document.querySelector("#title-form").addEventListener("reset", () => {
      document.querySelector("#title-results").innerHTML = "";
      document.querySelector("#title-status").textContent = "";
    });
  </script>
  <script src="/assets/js/partials.js"></script>
</body>
</html>
