<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="/assets/css/main.css">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Excel / CSV to JSON | Bluetext.in</title>
  <meta name="description" content="Convert Excel (.xlsx) or CSV files to JSON instantly in your browser using our in-house parser.">
  
  <script src="/assets/js/lib/xlsx-reader.js"></script>
</head>
<body>
  <div id="site-header"></div>
  <main class="doc-page" role="main">
    <p class="doc-page__back"><a href="../../../index.html">Back to home</a></p>
    <h1>Excel / CSV to JSON</h1>
    <p>Upload an Excel (.xlsx, .xls) or CSV file and convert it to JSON instantly. Nothing is uploaded to any server.</p>

    <section class="panel">
      <div class="tool-form">
        <label>Upload Excel or CSV<input id="file-input" type="file" accept=".xlsx,.xls,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel,text/csv"></label>
        <label>
          <input id="has-header" type="checkbox" checked>
          First row is header
        </label>
      </div>
      <div class="tool-actions">
        <button id="btn-convert" class="btn btn--primary" type="button" disabled>Convert to JSON</button>
        <button id="btn-copy" class="btn btn--ghost" type="button">Copy JSON</button>
        <button id="btn-download" class="btn btn--ghost" type="button">Download JSON</button>
      </div>
    </section>

    <section class="tool-output" aria-live="polite">
      <p id="status">Upload a file to begin.</p>
      <pre id="json-output" class="mono"></pre>
    </section>
  </main>
  <div id="site-footer"></div>
  <script>
    const fileInput = document.querySelector("#file-input");
    const btnConvert = document.querySelector("#btn-convert");
    const btnCopy = document.querySelector("#btn-copy");
    const btnDownload = document.querySelector("#btn-download");
    const status = document.querySelector("#status");
    const output = document.querySelector("#json-output");
    let jsonData = null;

    fileInput.addEventListener("change", () => {
      if (fileInput.files && fileInput.files[0]) {
        status.textContent = fileInput.files[0].name;
        btnConvert.disabled = false;
        output.textContent = "";
        btnDownload.style.display = "none";
      }
    });

    btnConvert.addEventListener("click", () => {
      const file = fileInput.files && fileInput.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async e => {
        try {
          const workbook = await XLSXReader.read(e.target.result);
          const sheetName = workbook.sheetNames[0] || "Sheet1";
          const ws = await workbook.getSheet(sheetName);
          const hasHeader = document.querySelector("#has-header").checked;

          let data;
          if (hasHeader) {
            data = ws.rows;
          } else {
            const firstRow = ws.fields || [];
            const remainingRows = ws.rows.map(row => firstRow.map(field => row[field] ?? ""));
            data = [firstRow, ...remainingRows];
          }

          jsonData = data;
          output.textContent = JSON.stringify(data, null, 2);
          status.textContent = `Converted sheet "${sheetName}" — ${data.length} row${data.length !== 1 ? "s" : ""}.`;
          btnDownload.style.display = "";
        } catch (err) {
          status.textContent = "Error: " + err.message;
        }
      };
      reader.readAsArrayBuffer(file);
    });

    btnCopy.addEventListener("click", () => {
      if (!output.textContent) return;
      navigator.clipboard.writeText(output.textContent).then(() => { status.textContent = "Copied."; });
    });

    btnDownload.addEventListener("click", () => {
      if (!jsonData) return;
      const blob = new Blob([JSON.stringify(jsonData, null, 2)], { type: "application/json" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = (fileInput.files[0].name.replace(/\.[^.]+$/, "") || "data") + ".json";
      link.click();
    });
  </script>
  <script src="/assets/js/partials.js"></script>
</body>
</html>
