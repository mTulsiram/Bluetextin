<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Excel / CSV to JSON | Bluetext.in</title>
  <meta name="description" content="Convert Excel (.xlsx) or CSV files to JSON instantly in your browser using SheetJS.">
  <link rel="stylesheet" href="../../../assets/css/main.css">
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
</head>
<body>
  <div id="site-header"></div>
  <main class="doc-page" role="main">
    <p class="doc-page__back"><a href="../../../index.html">Back to home</a></p>
    <h1>Excel / CSV to JSON</h1>
    <p>Upload an Excel (.xlsx, .xls) or CSV file and convert it to JSON instantly. Nothing is uploaded to any server.</p>

    <section class="panel">
      <div class="tool-form">
        <label>Upload Excel or CSV<input id="file-input" type="file" accept=".xlsx,.xls,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel,text/csv"></label>
        <label style="margin-top:0.5rem;display:flex;align-items:center;gap:0.5rem;font-size:0.9rem;">
          <input id="has-header" type="checkbox" checked>
          First row is header
        </label>
      </div>
      <div class="tool-actions" style="margin-top:0.75rem;">
        <button id="btn-convert" class="btn btn--primary" type="button" disabled>Convert to JSON</button>
        <button id="btn-copy" class="btn btn--ghost" type="button">Copy JSON</button>
        <button id="btn-download" class="btn btn--ghost" type="button" style="display:none;">Download JSON</button>
      </div>
    </section>

    <section class="tool-output" aria-live="polite">
      <p id="status" style="margin:0 0 0.6rem;font-weight:600;">Upload a file to begin.</p>
      <pre id="json-output" class="mono" style="overflow:auto;white-space:pre-wrap;max-height:500px;font-size:0.85rem;"></pre>
    </section>
  </main>
  <div id="site-footer"></div>
  <script>
    const fileInput = document.querySelector("#file-input");
    const btnConvert = document.querySelector("#btn-convert");
    const btnCopy = document.querySelector("#btn-copy");
    const btnDownload = document.querySelector("#btn-download");
    const status = document.querySelector("#status");
    const output = document.querySelector("#json-output");
    let jsonData = null;

    fileInput.addEventListener("change", () => {
      if (fileInput.files && fileInput.files[0]) {
        status.textContent = fileInput.files[0].name;
        btnConvert.disabled = false;
        output.textContent = "";
        btnDownload.style.display = "none";
      }
    });

    btnConvert.addEventListener("click", () => {
      const file = fileInput.files && fileInput.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        try {
          const wb = XLSX.read(e.target.result, { type: "array" });
          const sheetName = wb.SheetNames[0];
          const ws = wb.Sheets[sheetName];
          const hasHeader = document.querySelector("#has-header").checked;
          const raw = XLSX.utils.sheet_to_json(ws, { header: hasHeader ? 1 : undefined, defval: "" });
          let data;
          if (hasHeader && raw.length > 0) {
            const headers = raw[0];
            data = raw.slice(1).map(row => {
              const obj = {};
              headers.forEach((h, i) => { obj[h] = row[i] ?? ""; });
              return obj;
            });
          } else {
            data = raw;
          }
          jsonData = data;
          output.textContent = JSON.stringify(data, null, 2);
          status.textContent = `Converted sheet "${sheetName}" — ${data.length} row${data.length !== 1 ? "s" : ""}.`;
          btnDownload.style.display = "";
        } catch (err) {
          status.textContent = "Error: " + err.message;
        }
      };
      reader.readAsArrayBuffer(file);
    });

    btnCopy.addEventListener("click", () => {
      if (!output.textContent) return;
      navigator.clipboard.writeText(output.textContent).then(() => { status.textContent = "Copied."; });
    });

    btnDownload.addEventListener("click", () => {
      if (!jsonData) return;
      const blob = new Blob([JSON.stringify(jsonData, null, 2)], { type: "application/json" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = (fileInput.files[0].name.replace(/\.[^.]+$/, "") || "data") + ".json";
      link.click();
    });
  </script>
  <script src="/assets/js/partials.js"></script>
</body>
</html>
