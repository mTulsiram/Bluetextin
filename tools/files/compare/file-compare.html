<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="/assets/css/main.css">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>File Compare | Bluetext.in</title>
  <meta name="description" content="Compare two text files side-by-side and see line-by-line differences instantly.">
  
</head>
<body>
  <div id="site-header"></div>
  <main class="doc-page" role="main">
    <p class="doc-page__back"><a href="../../../index.html">Back to home</a></p>
    <h1>File Compare</h1>
    <p>Upload two text files to compare them line by line and highlight differences.</p>

    <section class="panel">
      <div class="tool-form">
        <div class="tool-grid-2">
          <label>File A<input id="file-a" type="file" accept="text/*,.txt,.csv,.json,.xml,.html,.css,.js,.md,.log"></label>
          <label>File B<input id="file-b" type="file" accept="text/*,.txt,.csv,.json,.xml,.html,.css,.js,.md,.log"></label>
        </div>
        <div class="tool-actions">
          <button id="btn-compare" class="btn btn--primary" type="button" disabled>Compare Files</button>
          <button id="btn-clear" class="btn btn--ghost" type="button">Clear</button>
        </div>
      </div>
    </section>

    <section class="tool-output" aria-live="polite">
      <p id="compare-status"></p>
      <div id="diff-output"></div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script>
    const fileA = document.querySelector("#file-a");
    const fileB = document.querySelector("#file-b");
    const btnCompare = document.querySelector("#btn-compare");
    const statusEl = document.querySelector("#compare-status");
    const outputEl = document.querySelector("#diff-output");

    function readFile(file) {
      return new Promise((res, rej) => {
        const r = new FileReader();
        r.onload = e => res(e.target.result);
        r.onerror = rej;
        r.readAsText(file);
      });
    }

    function checkReady() {
      btnCompare.disabled = !(fileA.files && fileA.files[0] && fileB.files && fileB.files[0]);
    }
    fileA.addEventListener("change", checkReady);
    fileB.addEventListener("change", checkReady);

    // LCS line diff
    function diffLines(aLines, bLines) {
      const m = aLines.length, n = bLines.length;
      const dp = Array.from({ length: m + 1 }, () => Array(n + 1).fill(0));
      for (let i = m - 1; i >= 0; i--)
        for (let j = n - 1; j >= 0; j--)
          dp[i][j] = aLines[i] === bLines[j] ? dp[i+1][j+1]+1 : Math.max(dp[i+1][j], dp[i][j+1]);
      const result = [];
      let i = 0, j = 0;
      while (i < m || j < n) {
        if (i < m && j < n && aLines[i] === bLines[j]) { result.push({ type: "eq", text: aLines[i] }); i++; j++; }
        else if (j < n && (i >= m || dp[i+1][j] >= dp[i][j+1])) { result.push({ type: "add", text: bLines[j] }); j++; }
        else { result.push({ type: "rm", text: aLines[i] }); i++; }
      }
      return result;
    }

    btnCompare.addEventListener("click", async () => {
      const [a, b] = await Promise.all([readFile(fileA.files[0]), readFile(fileB.files[0])]);
      const aLines = a.split(/\r?\n/), bLines = b.split(/\r?\n/);
      outputEl.innerHTML = "";
      const diff = diffLines(aLines, bLines);
      let adds = 0, removes = 0;

      diff.forEach(({ type, text }) => {
        const div = document.createElement("div");
        div.style.cssText = "padding:1px 8px;white-space:pre-wrap;word-break:break-word;border-radius:3px;";
        const esc = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
        if (type === "add") { div.style.background="#f0fdf4"; div.style.color="#15803d"; div.innerHTML=`+ ${esc}`; adds++; }
        else if (type === "rm") { div.style.background="#fff1f2"; div.style.color="#be123c"; div.innerHTML=`- ${esc}`; removes++; }
        else { div.style.color="var(--text-soft)"; div.innerHTML=`  ${esc}`; }
        outputEl.appendChild(div);
      });

      statusEl.textContent = adds === 0 && removes === 0
        ? "Files are identical."
        : `+${adds} lines added · -${removes} lines removed`;
    });

    document.querySelector("#btn-clear").addEventListener("click", () => {
      fileA.value = ""; fileB.value = "";
      outputEl.innerHTML = ""; statusEl.textContent = "";
      btnCompare.disabled = true;
    });
  </script>
  <script src="/assets/js/partials.js"></script>
</body>
</html>
