<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bluetext.in | 900+ Free Online Tools</title>
    <link rel="stylesheet" href="/assets/css/main.css">

    <!-- 1. Initialise DataLayer & Set DEFAULT Consent (Must be first) -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}

      // Default all to 'denied' for Consent Mode v2 compliance
      gtag('consent', 'default', {
        'analytics_storage': 'denied',
        'ad_storage': 'denied',
        'ad_user_data': 'denied',
        'ad_personalization': 'denied',
        'wait_for_update': 500 
      });
      gtag('js', new Date());
  gtag('config', 'G-K4KGMMJ1YY', {
    'allow_enhanced_conversions': true
  });
  // Example: Add this to your form submission script
gtag('set', 'user_data', {
  "email": "user@example.com" // Google will automatically hash this for privacy
});

    </script>

    <!-- 2. Load Google Tag -->
    <script async src="https://googletagmanager.com"></script>
    <script>
      gtag('js', new Date());
      gtag('config', 'G-K4KGMMJ1YY');
    </script>

    <!-- 3. Load Silktide Assets (Update paths to your actual folders) -->
    <link rel="stylesheet" id="silktide-consent-manager-css" href="/assets/css/silktide-consent-manager.css">
    <script src="/assets/js/silktide-consent-manager.js"></script>

    <!-- 4. Silktide Configuration -->
    <script>
    silktideCookieBannerManager.updateCookieBannerConfig({
      background: { showBackground: true },
      cookieIcon: { position: "bottomLeft" },
      cookieTypes: [
        {
          id: "necessary",
          name: "Necessary",
          description: "<p>Required for the site to function properly.</p>",
          required: true
        },
        {
          id: "analytics",
          name: "Analytics",
          description: "<p>Helps us understand how you use BlueText.in.</p>",
          onAccept: function() {
            gtag('consent', 'update', { 'analytics_storage': 'granted' });
          }
        },
        {
          id: "advertising",
          name: "Advertising",
          description: "<p>Used for Google Ads and personalized marketing.</p>",
          onAccept: function() {
            gtag('consent', 'update', {
              'ad_storage': 'granted',
              'ad_user_data': 'granted',
              'ad_personalization': 'granted'
            });
          }
        }
      ],
      text: {
        banner: {
          description: "<p>We use cookies on BlueText.in to enhance your experience. <a href='/cookie-policy'>Cookie Policy.</a></p>",
          acceptAllButtonText: "Accept all",
          rejectNonEssentialButtonText: "Reject non-essential"
        }
      },
      position: { banner: "bottomCenter" }
    });
    </script>
</head>
