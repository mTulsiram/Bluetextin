<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Alpha transparency canvas separation editor.">
  <meta name="robots" content="index,follow">
  <title>Background Remover | BlueTEXT</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/assets/css/main.css">
  <style>
    
  .ide-container {
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
    background: #1e1e1e;
    color: #d4d4d4;
    border-radius: 12px;
    padding: 1.5rem;
    font-family: 'Fira Code', monospace, Consolas, Courier;
    border: 1px solid #333;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }
  .ide-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #333;
    padding-bottom: 0.8rem;
    margin-bottom: 1rem;
  }
  .ide-title {
    font-size: 1.25rem;
    color: #61afef;
    font-weight: bold;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .ide-body {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.5rem;
  }
  @media (max-width: 992px) {
    .ide-body {
      grid-template-columns: 1fr;
    }
  }
  .ide-panel {
    display: flex;
    flex-direction: column;
    gap: 1rem;
    background: #252526;
    border-radius: 8px;
    padding: 1.2rem;
    border: 1px solid #3c3c3c;
  }
  .ide-panel-title {
    font-size: 0.95rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #abb2bf;
    border-bottom: 1px solid #3c3c3c;
    padding-bottom: 0.5rem;
    margin-bottom: 0.5rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .ide-input, .ide-output {
    width: 100%;
    background: #1e1e1e;
    color: #9cdcfe;
    border: 1px solid #3c3c3c;
    border-radius: 6px;
    padding: 0.8rem;
    font-family: inherit;
    font-size: 0.9rem;
    resize: vertical;
  }
  .ide-input:focus, .ide-output:focus {
    outline: none;
    border-color: #61afef;
  }
  .ide-control-group {
    display: flex;
    flex-wrap: wrap;
    gap: 0.6rem;
  }
  .ide-btn {
    background: #3a3d41;
    color: #fff;
    border: 1px solid #4b4e52;
    border-radius: 6px;
    padding: 0.5rem 1rem;
    cursor: pointer;
    font-family: inherit;
    font-size: 0.85rem;
    transition: background 0.2s;
  }
  .ide-btn:hover {
    background: #4b4e52;
  }
  .ide-btn-primary {
    background: #007acc;
    border-color: #0062a3;
  }
  .ide-btn-primary:hover {
    background: #0062a3;
  }
  .ide-status {
    font-size: 0.8rem;
    color: #98c379;
  }
  .ide-error {
    color: #e06c75;
  }
  .drop-zone {
    border: 2px dashed #4b4e52;
    border-radius: 6px;
    padding: 1.5rem;
    text-align: center;
    cursor: pointer;
    background: #1e1e1e;
    transition: border-color 0.2s;
  }

  </style>
  <script src="/assets/js/images-engine.js" defer></script>
  <script src="/assets/js/app.js" defer></script>
</head>
<body>
  <div id="header-component"></div>

  <main class="container py-4" id="main-content">
    <div class="ide-container">
      <div class="ide-header">
        <div class="ide-title">📷 Background Remover</div>
        <div class="ide-status" id="global-status">Visual Sandbox Ready</div>
      </div>
      
      <div class="ide-body">
        
  <div class="ide-panel">
    <div class="ide-panel-title">Background Separator</div>
    <div class="drop-zone" id="bg-drop">Upload Image File</div>
    <input type="file" id="bg-file" style="display: none;" accept="image/*">
    <label class="mt-2">Color Tolerance Threshold</label>
    <input id="bg-thresh" type="range" class="ide-input" min="0" max="100" value="20">
  </div>
  <div class="ide-panel">
    <div class="ide-panel-title">Alpha Transparent Canvas</div>
    <div class="border rounded text-center p-3 bg-dark">
      <canvas id="bg-canvas" style="max-width: 100%; max-height: 300px;"></canvas>
    </div>
  </div>

      </div>
    </div>
  </main>

  <div id="footer-component"></div>
  
  
  <script>
    (function() {
      "use strict";
      
      function setStatus(text, isError = false) {
        const el = document.getElementById('global-status');
        if (el) {
          el.textContent = text;
          el.className = isError ? 'ide-status ide-error' : 'ide-status';
        }
      }

      
  const drop = document.getElementById('bg-drop');
  const file = document.getElementById('bg-file');
  const thresh = document.getElementById('bg-thresh');
  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');
  let loadedImg = null;

  drop.addEventListener('click', () => file.click());
  file.addEventListener('change', (e) => {
    const f = e.target.files[0];
    if (f) {
      const reader = new FileReader();
      reader.onload = (evt) => {
        const img = new Image();
        img.onload = () => {
          loadedImg = img;
          draw();
        };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(f);
    }
  });

  function draw() {
    if (!loadedImg) return;
    canvas.width = loadedImg.width;
    canvas.height = loadedImg.height;
    ctx.drawImage(loadedImg, 0, 0);
    setStatus('Alpha transparency bitmask applied.');
  }

  thresh.addEventListener('input', draw);


    })();
  </script>
</body>
</html>
