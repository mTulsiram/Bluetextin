<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>All Tools – Bluetext.in</title>
    <meta name="description" content="Browse, search, and filter through our complete collection of over 900+ free online tools for developers, creators, and professionals." />
    <link rel="canonical" href="https://bluetext.in/tools-platform/all-tools.html" />
    <link rel="stylesheet" href="/assets/css/main.css" />
</head>
<body>
    <!-- Header injected by main.js -->
    <div id="header-placeholder"></div>

    <main class="container">
        <div class="all-tools-layout">
            <!-- Directory Header -->
            <section class="directory-header">
                <h1>Master Tools Directory</h1>
                <p>Browse our complete collection of 900+ free online tools, neatly organized by category.</p>
            </section>
            
            <!-- Directory Controls -->
            <div class="directory-controls">
                <input
                    type="text"
                    id="directoryFilter"
                    placeholder="Filter tools or categories... (e.g., 'pdf' or 'image compressor')"
                    aria-label="Filter tools directory"
                />
            </div>

            <!-- Tools Directory (built dynamically by main.js) -->
            <div class="directory-content" id="masterDirectory">
                <!-- Tool categories & links will be injected here by JavaScript -->
            </div>
        </div>
    </main>

    <!-- Footer injected by main.js -->
    <div id="footer-placeholder"></div>
    
    <!-- Core JS -->
    <script src="/assets/js/main.js"></script>
</body>
</html>
