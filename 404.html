<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Page Not Found – Bluetext.in</title>
  <link rel="stylesheet" href="/assets/css/main.css" />
  <style>
    .error-container { text-align: center; padding: 100px 20px; }
    .error-code { font-size: 120px; font-weight: 900; color: var(--primary-blue); margin: 0; }
    .error-msg { font-size: 1.5rem; margin: 10px 0 20px; }
    .error-container a { 
      display: inline-block; background: var(--brand-yellow); color: var(--primary-blue);
      padding: 15px 30px; text-decoration: none; border-radius: 8px; font-weight: 700;
    }
  </style>
</head>
<body>
  <div id="header-placeholder"></div>
  <main class="error-container">
    <p class="error-code">404</p>
    <h1 class="error-msg">Oops! That page could not be found.</h1>
    <p>Don’t worry – we have hundreds of other useful tools for you.</p>
    <a href="/tools-platform/all-tools.html">Browse All Tools</a>
  </main>
  <div id="footer-placeholder"></div>
</body>
</html>
